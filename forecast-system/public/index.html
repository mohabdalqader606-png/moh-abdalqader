<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام التنبؤ بمسحوبات العملاء</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="loginScreen">
  <h1>📦 نظام التنبؤ بمسحوبات العملاء</h1>
  <input type="text" id="loginUser" placeholder="اسم المستخدم">
  <input type="password" id="loginPass" placeholder="كلمة المرور">
  <button class="btn" style="width:100%" onclick="doLogin()">دخول</button>
  <div id="loginErr"></div>
</div>
<div id="app" style="display:none">
  <header>
    <h1>📦 نظام التنبؤ بمسحوبات العملاء</h1>
    <div class="row" style="margin:0">
      <span id="whoami" class="badge b-blue"></span>
      <button class="btn ghost sm" onclick="doLogout()">خروج</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
  <footer>Prototype v2 — مبني على PostgreSQL، يعمل بمستخدمين متعددين.</footer>
</div>
<script src="/app.js"></script>
</body>
</html>
