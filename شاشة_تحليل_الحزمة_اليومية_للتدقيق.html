ROUND(X."UPF",4) AS "سعر المنشأ للوحدة بالعملة",
ROUND(X."LastUPF",4) AS "اخر سعر منشأ بنفس العملة",
LI."DocRate" AS "سعر صرف اخر شراء",
ROUND((X."UPF"-X."LastUPF")*100/NULLIF(X."LastUPF",0),2) AS "نسبة التغير بالعملة",
ROUND((X."UPF"-X."LastUPF")*X."BQ",3) AS "اثر التغير بالعملة",
ROUND((X."UPF"-X."LastUPF")*X."BQ"*X."Rate",3) AS "اثر التغير بالدينار",
LI."DocEntry" AS "فتح اخر فاتورة شراء",
LI."DocDate" AS "تاريخ اخر شراء",
LI."CardName" AS "مورد اخر شراء",
PO."DocEntry" AS "فتح امر الشراء",
X."BaseP" AS "سعر امر الشراء",
X."BaseQ" AS "كمية امر الشراء",
GR."DocEntry" AS "فتح سند الاستلام",
X."RQ" AS "الكمية المستلمة",
X."GD" AS "تاريخ الاستلام",
LC."DocEntry" AS "فتح اخر تكاليف استيراد",
LC."DocDate" AS "تاريخ اخر تكاليف استيراد",
ROUND(X."LineTotal",3) AS "قيمة المنشأ بالدينار",
ROUND(X."Frt",3) AS "مصاريف الفاتورة المحملة بالدينار",
ROUND(IFNULL(X."LCAmt",0),3) AS "تكاليف مستند الاستيراد بالدينار",
ROUND(X."Frt"+IFNULL(X."LCAmt",0),3) AS "اجمالي تكاليف الاستيراد بالدينار",
ROUND((X."Frt"*X."RQ"/NULLIF(X."Quantity",0)+IFNULL(X."LCAmt",0))*100/NULLIF(X."LineTotal"*X."RQ"/NULLIF(X."Quantity",0),0),2) AS "نسبة تكاليف الاستيراد",
ROUND((X."LineTotal"+X."Frt")/NULLIF(X."BQ",0)+IFNULL(X."LCAmt",0)/NULLIF(X."RQ"*X."F",0),3) AS "الكلفة الواصلة للوحدة بالدينار",
DAYS_BETWEEN(X."DocDate",CURRENT_DATE) AS "ايام منذ الفاتورة",
X."F1"+X."F2"+X."F3"+X."F4"+X."F5"+X."F7"+X."F8"+X."F9" AS "درجة الخطورة",
RTRIM(
CASE WHEN X."F5"=1 THEN '✖ رقم فاتورة المورد مكرر / ' ELSE '' END||
CASE WHEN X."F7"=1 THEN '✖ المستلم اكثر من المفوتر / ' ELSE '' END||
CASE WHEN X."F9"=1 THEN '✖ لم يستلم بعد 120 يوم / ' ELSE '' END||
CASE WHEN X."F8"=1 THEN '✖ استلام بدون تكاليف استيراد بعد 30 يوم / ' ELSE '' END||
CASE WHEN X."F2"=1 THEN '✖ سعر اعلى من امر الشراء / ' ELSE '' END||
CASE WHEN X."F3"=1 THEN '✖ كمية اكبر من امر الشراء / ' ELSE '' END||
CASE WHEN X."F4"=1 THEN '✖ فاتورة بدون امر شراء / ' ELSE '' END||
CASE WHEN X."F1"=1 THEN '✖ ارتفاع سعر المنشأ اكثر من 5% / ' ELSE '' END||
CASE WHEN X."F9"=0 AND IFNULL(X."RQ",0)<X."Quantity" THEN 'بانتظار الاستلام / ' ELSE '' END
,' /') AS "التنبيه",
U."U_NAME" AS "المستخدم"
FROM (
SELECT Y.*,LP."LUP" AS "LastUPF",
CASE WHEN LP."LUP">0 AND Y."UPF">LP."LUP"*1.05 THEN 1 ELSE 0 END AS "F1",
CASE WHEN Y."BaseP">0 AND Y."PriceBefDi">Y."BaseP"*1.005 THEN 1 ELSE 0 END AS "F2",
CASE WHEN Y."BaseQ" IS NOT NULL AND Y."Quantity">Y."BaseQ"+0.0001 THEN 1 ELSE 0 END AS "F3",
CASE WHEN Y."BaseType"<>22 THEN 1 ELSE 0 END AS "F4",
CASE WHEN Y."DupN">0 AND IFNULL(TRIM(Y."NumAtCard"),'')<>'' THEN 1 ELSE 0 END AS "F5",
CASE WHEN IFNULL(Y."RQ",0)>Y."Quantity"+0.0001 THEN 1 ELSE 0 END AS "F7",
CASE WHEN Y."RQ">0 AND Y."LE" IS NULL AND DAYS_BETWEEN(Y."GD",CURRENT_DATE)>30 THEN 1 ELSE 0 END AS "F8",
CASE WHEN IFNULL(Y."RQ",0)<Y."Quantity" AND DAYS_BETWEEN(Y."DocDate",CURRENT_DATE)>120 THEN 1 ELSE 0 END AS "F9"
FROM (
SELECT T0."DocEntry",T0."DocNum",T0."DocDate",T0."CreateDate",T0."isIns",T0."NumAtCard",T0."CardCode",T0."CardName",T0."DocCur" AS "Cur",IFNULL(NULLIF(T0."DocRate",0),1) AS "Rate",T0."UserSign",T1."ItemCode",T1."Dscription",T1."Quantity",T1."unitMsr",T1."PriceBefDi",T1."BaseType",T1."BaseEntry",T1."LineTotal",
IFNULL(NULLIF(T1."NumPerMsr",0),1) AS "F",
T1."Quantity"*IFNULL(NULLIF(T1."NumPerMsr",0),1) AS "BQ",
COALESCE(NULLIF(T1."TotalFrgn",0),T1."LineTotal")/NULLIF(T1."Quantity"*IFNULL(NULLIF(T1."NumPerMsr",0),1),0) AS "UPF",
IFNULL(HF."HF",0)*T1."LineTotal"/NULLIF(SUM(T1."LineTotal") OVER (PARTITION BY T0."DocEntry"),0)+IFNULL(LF."LF",0) AS "Frt",
PL."PriceBefDi" AS "BaseP",PL."Quantity" AS "BaseQ",
G."RQ",G."GE",G."GD",G."LE",G."LCAmt",
(SELECT MAX(H."DocEntry") FROM OPCH H INNER JOIN PCH1 D ON D."DocEntry"=H."DocEntry" WHERE D."ItemCode"=T1."ItemCode" AND H."DocCur"=T0."DocCur" AND H."CANCELED"='N' AND H."DocDate"<T0."DocDate" AND D."LineTotal">0) AS "LastE",
(SELECT COUNT(*) FROM OPCH Z WHERE Z."CardCode"=T0."CardCode" AND Z."NumAtCard"=T0."NumAtCard" AND Z."DocEntry"<>T0."DocEntry" AND Z."CANCELED"='N') AS "DupN"
FROM OPCH T0
INNER JOIN PCH1 T1 ON T1."DocEntry"=T0."DocEntry"
LEFT JOIN (SELECT "DocEntry",SUM("LineTotal") AS "HF" FROM PCH3 GROUP BY "DocEntry") HF ON HF."DocEntry"=T0."DocEntry"
LEFT JOIN (SELECT "DocEntry","LineNum",SUM("LineTotal") AS "LF" FROM PCH2 GROUP BY "DocEntry","LineNum") LF ON LF."DocEntry"=T1."DocEntry" AND LF."LineNum"=T1."LineNum"
LEFT JOIN POR1 PL ON T1."BaseType"=22 AND PL."DocEntry"=T1."BaseEntry" AND PL."LineNum"=T1."BaseLine"
LEFT JOIN (SELECT D."BaseEntry",D."BaseLine",SUM(D."Quantity") AS "RQ",MAX(D."DocEntry") AS "GE",MIN(H."DocDate") AS "GD",MAX(F."LE") AS "LE",SUM(F."LCE") AS "LCAmt" FROM PDN1 D INNER JOIN OPDN H ON H."DocEntry"=D."DocEntry"
LEFT JOIN (SELECT K."BaseEntry",K."OrigLine",SUM(IFNULL(Z."TtlExpndLC",0)+IFNULL(Z."TtlCustLC",0)) AS "LCE",MAX(K."FD") AS "LE" FROM (
SELECT A."BaseEntry",A."OrigLine",A."LineNum",COALESCE(E4."C",E3."C",E2."C",E1."C",A."DocEntry") AS "FD" FROM IPF1 A
LEFT JOIN (SELECT "BaseEntry" AS "P",MAX("DocEntry") AS "C" FROM IPF1 WHERE "BaseType"=69 GROUP BY "BaseEntry") E1 ON E1."P"=A."DocEntry"
LEFT JOIN (SELECT "BaseEntry" AS "P",MAX("DocEntry") AS "C" FROM IPF1 WHERE "BaseType"=69 GROUP BY "BaseEntry") E2 ON E2."P"=E1."C"
LEFT JOIN (SELECT "BaseEntry" AS "P",MAX("DocEntry") AS "C" FROM IPF1 WHERE "BaseType"=69 GROUP BY "BaseEntry") E3 ON E3."P"=E2."C"
LEFT JOIN (SELECT "BaseEntry" AS "P",MAX("DocEntry") AS "C" FROM IPF1 WHERE "BaseType"=69 GROUP BY "BaseEntry") E4 ON E4."P"=E3."C"
WHERE A."BaseType"=20) K
INNER JOIN IPF1 Z ON Z."DocEntry"=K."FD" AND Z."LineNum"=K."LineNum"
GROUP BY K."BaseEntry",K."OrigLine") F ON F."BaseEntry"=D."DocEntry" AND F."OrigLine"=D."LineNum"
WHERE D."BaseType"=18 AND H."CANCELED"='N' GROUP BY D."BaseEntry",D."BaseLine") G ON G."BaseEntry"=T1."DocEntry" AND G."BaseLine"=T1."LineNum"
WHERE T0."CreateDate" BETWEEN [%0] AND [%1]
AND T0."CANCELED"='N'
AND T0."DocType"='I'
) Y
LEFT JOIN (SELECT D."DocEntry",D."ItemCode",MAX(COALESCE(NULLIF(D."TotalFrgn",0),D."LineTotal")/NULLIF(D."Quantity"*IFNULL(NULLIF(D."NumPerMsr",0),1),0)) AS "LUP" FROM PCH1 D INNER JOIN OPCH H ON H."DocEntry"=D."DocEntry" WHERE H."DocDate">=ADD_DAYS(CURRENT_DATE,-1100) AND D."LineTotal">0 GROUP BY D."DocEntry",D."ItemCode") LP ON LP."DocEntry"=Y."LastE" AND LP."ItemCode"=Y."ItemCode"
) X
LEFT JOIN OPCH P0 ON P0."DocEntry"=X."DocEntry"
LEFT JOIN OCRD B0 ON B0."CardCode"=X."CardCode"
LEFT JOIN OITM M0 ON M0."ItemCode"=X."ItemCode"
LEFT JOIN OPCH LI ON LI."DocEntry"=X."LastE"
LEFT JOIN OPOR PO ON X."BaseType"=22 AND PO."DocEntry"=X."BaseEntry"
LEFT JOIN OPDN GR ON GR."DocEntry"=X."GE"
LEFT JOIN OIPF LC ON LC."DocEntry"=X."LE"
LEFT JOIN OUSR U ON U."USERID"=X."UserSign"
WHERE X."F1"+X."F2"+X."F3"+X."F4"+X."F5"+X."F7"+X."F8"+X."F9">0 OR IFNULL(X."RQ",0)<X."Quantity"
ORDER BY X."F1"+X."F2"+X."F3"+X."F4"+X."F5"+X."F7"+X."F8"+X."F9" DESC,IFNULL((X."UPF"-X."LastUPF")*X."BQ"*X."Rate",0) DESC
</script>
<script type="text/plain" id="sql_q14">
/* SELECT T0."DocDate" FROM OINV T0 WHERE T0."DocDate" BETWEEN [%0] AND [%1] */
SELECT I0."DocEntry" AS "فتح الفاتورة",
X."DocNum" AS "رقم الفاتورة",
X."DocDate" AS "التاريخ",
X."CreateDate" AS "تاريخ الادخال",
DAYS_BETWEEN(X."DocDate",X."CreateDate") AS "ايام التأخير",
B0."CardCode" AS "فتح العميل",
X."CardName" AS "اسم العميل",
X."SlpName" AS "المندوب",
M0."ItemCode" AS "فتح الصنف",
X."Dscription" AS "اسم الصنف",
X."Quantity" AS "الكمية",
X."unitMsr" AS "الوحدة",
X."PriceBefDi" AS "سعر البيع",
X."Batch" AS "الباتش",
ROUND(X."Cost",3) AS "الكلفة",
X."CSrc" AS "مصدر الكلفة",
ROUND(X."Cost"*1.1,3) AS "الحد الادنى المسموح",
ROUND(X."Net",3) AS "صافي البيع",
ROUND(X."Net"-X."Cost",3) AS "الربح",
ROUND((X."Net"-X."Cost")*100/NULLIF(X."Cost",0),2) AS "نسبة الزيادة على الكلفة",
ROUND(CASE WHEN X."Net"<X."Cost"*1.1 THEN X."Cost"*1.1-X."Net" ELSE 0 END,3) AS "قيمة التنازل",
SUM(CASE WHEN X."RN"=1 THEN 1 ELSE 0 END) OVER (PARTITION BY X."CardCode") AS "فواتير العميل بالفترة",
ROUND(SUM(X."Net") OVER (PARTITION BY X."CardCode"),3) AS "مشتريات العميل بالفترة",
ROUND(SUM(CASE WHEN X."Net"<X."Cost"*1.1 THEN X."Cost"*1.1-X."Net" ELSE 0 END) OVER (PARTITION BY X."CardCode"),3) AS "اجمالي التنازل للعميل بالفترة",
RTRIM(
CASE WHEN X."Cost">0 AND X."Net"<X."Cost" THEN '✖ بيع تحت الكلفة / ' WHEN X."Cost">0 AND X."Net"<X."Cost"*1.1 THEN '✖ اقل من الكلفة + 10% / ' ELSE '' END||
CASE WHEN X."CardCode" NOT LIKE 'E%' AND X."ListNum"<>5 THEN '✖ بيع موظفين على حساب غير مسمى / ' ELSE '' END||
CASE WHEN IFNULL(X."Cost",0)=0 THEN 'لا توجد كلفة / ' ELSE '' END
,' /') AS "التنبيه",
X."U_NAME" AS "المستخدم"
FROM (
SELECT Y.*,COALESCE(Y."CurC",Y."ActC",Y."EstC") AS "Cost",
CASE WHEN Y."CurC" IS NOT NULL THEN 'كلفة الباتش الحالية' WHEN Y."ActC" IS NOT NULL THEN 'كلفة مرحلة - رصيد الباتش صفر' WHEN Y."EstC" IS NOT NULL THEN 'تقديرية - غير مدلفرة' END AS "CSrc"
FROM (
SELECT T0."DocEntry",T0."DocNum",T0."DocDate",T0."CreateDate",T0."CardCode",T0."CardName",C."ListNum",S."SlpName",U."U_NAME",T1."ItemCode",T1."Dscription",T1."Quantity",T1."unitMsr",T1."PriceBefDi",
ROW_NUMBER() OVER (PARTITION BY T0."DocEntry" ORDER BY T1."LineNum") AS "RN",
T1."LineTotal"*(1-IFNULL(T0."DiscPrcnt",0)/100) AS "Net",
CASE WHEN T1."BaseType"=15 THEN BD."Batch" WHEN T0."isIns"='Y' THEN RB."Batch" ELSE BI."Batch" END AS "Batch",
CASE WHEN T1."BaseType"=15 THEN BD."BC"*T1."Quantity"/NULLIF(DB."Quantity",0) WHEN T0."isIns"='Y' THEN RB."BC"*T1."Quantity"/NULLIF(RQ."Q",0) ELSE BI."BC" END AS "CurC",
CASE WHEN T1."BaseType"=15 THEN NULL WHEN T0."isIns"='Y' THEN NULL ELSE CI."C" END AS "ActC",
EC."U"*IFNULL(NULLIF(T1."NumPerMsr",0),1)*T1."Quantity" AS "EstC"
FROM OINV T0
INNER JOIN INV1 T1 ON T1."DocEntry"=T0."DocEntry"
INNER JOIN OCRD C ON C."CardCode"=T0."CardCode"
LEFT JOIN OSLP S ON S."SlpCode"=T0."SlpCode"
LEFT JOIN OUSR U ON U."USERID"=T0."UserSign"
LEFT JOIN (SELECT O."DocEntry",O."DocLine",CASE WHEN SUM(CASE WHEN B."Quantity"=0 THEN 1 ELSE 0 END)=0 THEN SUM(ABS(L."Quantity")*B."CostTotal"/NULLIF(B."Quantity",0)) END AS "BC",STRING_AGG(B."DistNumber",' | ') AS "Batch" FROM OITL O INNER JOIN ITL1 L ON O."LogEntry"=L."LogEntry" INNER JOIN OBTN B ON L."ItemCode"=B."ItemCode" AND L."SysNumber"=B."SysNumber" WHERE O."DocType"=13 AND O."StockEff"=1 AND O."DocDate">=ADD_DAYS(CURRENT_DATE,-400) GROUP BY O."DocEntry",O."DocLine") BI ON BI."DocEntry"=T1."DocEntry" AND BI."DocLine"=T1."LineNum"
LEFT JOIN (SELECT O."DocEntry",O."DocLine",CASE WHEN SUM(CASE WHEN B."Quantity"=0 THEN 1 ELSE 0 END)=0 THEN SUM(ABS(L."Quantity")*B."CostTotal"/NULLIF(B."Quantity",0)) END AS "BC",STRING_AGG(B."DistNumber",' | ') AS "Batch" FROM OITL O INNER JOIN ITL1 L ON O."LogEntry"=L."LogEntry" INNER JOIN OBTN B ON L."ItemCode"=B."ItemCode" AND L."SysNumber"=B."SysNumber" WHERE O."DocType"=15 AND O."StockEff"=1 AND O."DocDate">=ADD_DAYS(CURRENT_DATE,-400) GROUP BY O."DocEntry",O."DocLine") BD ON T1."BaseType"=15 AND BD."DocEntry"=T1."BaseEntry" AND BD."DocLine"=T1."BaseLine"
LEFT JOIN (SELECT D."BaseEntry",D."BaseLine",CASE WHEN SUM(CASE WHEN B."Quantity"=0 THEN 1 ELSE 0 END)=0 THEN SUM(ABS(L."Quantity")*B."CostTotal"/NULLIF(B."Quantity",0)) END AS "BC",STRING_AGG(B."DistNumber",' | ') AS "Batch" FROM DLN1 D INNER JOIN OITL O ON O."DocType"=15 AND O."DocEntry"=D."DocEntry" AND O."DocLine"=D."LineNum" AND O."StockEff"=1 INNER JOIN ITL1 L ON O."LogEntry"=L."LogEntry" INNER JOIN OBTN B ON L."ItemCode"=B."ItemCode" AND L."SysNumber"=B."SysNumber" WHERE D."BaseType"=13 GROUP BY D."BaseEntry",D."BaseLine") RB ON RB."BaseEntry"=T1."DocEntry" AND RB."BaseLine"=T1."LineNum"
LEFT JOIN DLN1 DB ON T1."BaseType"=15 AND DB."DocEntry"=T1."BaseEntry" AND DB."LineNum"=T1."BaseLine"
LEFT JOIN (SELECT D."BaseEntry",D."BaseLine",SUM(D."Quantity") AS "Q" FROM DLN1 D WHERE D."BaseType"=13 GROUP BY D."BaseEntry",D."BaseLine") RQ ON RQ."BaseEntry"=T1."DocEntry" AND RQ."BaseLine"=T1."LineNum"
LEFT JOIN (SELECT V."CreatedBy",V."DocLineNum",ABS(SUM(V."TransValue")) AS "C" FROM OINM V WHERE V."TransType"=13 AND V."DocDate">=ADD_DAYS(CURRENT_DATE,-400) GROUP BY V."CreatedBy",V."DocLineNum") CI ON CI."CreatedBy"=T1."DocEntry" AND CI."DocLineNum"=T1."LineNum"
LEFT JOIN (SELECT Q."ItemCode",Q."WhsCode",SUM(Q."Quantity"*(BN."CostTotal"/NULLIF(BN."Quantity",0)))/NULLIF(SUM(Q."Quantity"),0) AS "U" FROM OBTQ Q INNER JOIN OBTN BN ON Q."ItemCode"=BN."ItemCode" AND Q."SysNumber"=BN."SysNumber" WHERE Q."Quantity">0 GROUP BY Q."ItemCode",Q."WhsCode") EC ON EC."ItemCode"=T1."ItemCode" AND EC."WhsCode"=T1."WhsCode"
WHERE T0."CreateDate" BETWEEN [%0] AND [%1]
AND T0."CANCELED"='N'
AND (T0."CardCode" LIKE 'E%' OR C."ListNum"=5 OR S."SlpName" LIKE '%موظف%')
) Y
) X
LEFT JOIN OINV I0 ON I0."DocEntry"=X."DocEntry"
LEFT JOIN OCRD B0 ON B0."CardCode"=X."CardCode"
LEFT JOIN OITM M0 ON M0."ItemCode"=X."ItemCode"
ORDER BY SUM(CASE WHEN X."Net"<X."Cost"*1.1 THEN X."Cost"*1.1-X."Net" ELSE 0 END) OVER (PARTITION BY X."CardCode") DESC,X."CardCode",X."DocDate"
</script>
<script type="text/plain" id="sql_q15">
/* SELECT T0."DocDate" FROM OINV T0 WHERE T0."DocDate" BETWEEN [%0] AND [%1] */
SELECT U0."USERID" AS "فتح المستخدم",
U0."USER_CODE" AS "رمز المستخدم",
U0."U_NAME" AS "اسم المستخدم",
CASE WHEN U0."SUPERUSER"='Y' THEN 'نعم' ELSE 'لا' END AS "مدير نظام",
CASE WHEN U0."Locked"='Y' THEN 'موقوف' ELSE 'فعال' END AS "الحالة",
X."INV" AS "فواتير مبيعات",
X."CM" AS "اشعارات دائنة",
X."RC" AS "سندات قبض",
X."PO" AS "اوامر شراء",
X."PI" AS "فواتير شراء",
X."VP" AS "سندات صرف",
X."JE" AS "قيود يدوية",
X."IA" AS "تسويات مخزون",
X."BP" AS "تعديلات بطاقات",
X."F1"+X."F2"+X."F3"+X."F4"+X."F5"+X."F6"+X."F7" AS "عدد التعارضات",
RTRIM(
CASE WHEN X."F6"=1 THEN '✖ حساب عام او تقني يدخل حركات / ' ELSE '' END||
CASE WHEN X."F7"=1 THEN '✖ مستخدم موقوف له حركات / ' ELSE '' END||
CASE WHEN X."F1"=1 THEN '✖ دورة شراء كاملة بيد مستخدم واحد / ' ELSE '' END||
CASE WHEN X."F2"=1 THEN '✖ يعدل بطاقات ويصرف / ' ELSE '' END||
CASE WHEN X."F3"=1 THEN '✖ يقبض ويقيد يدويا / ' ELSE '' END||
CASE WHEN X."F4"=1 THEN '✖ يبيع ويسوي المخزون / ' ELSE '' END||
CASE WHEN X."F5"=1 THEN '✖ يصدر فواتير ومرتجعات / ' ELSE '' END
,' /') AS "التعارضات"
FROM (
SELECT Y.*,
CASE WHEN Y."PO">0 AND Y."PI">0 AND Y."VP">0 THEN 1 ELSE 0 END AS "F1",
CASE WHEN Y."BP">0 AND Y."VP">0 THEN 1 ELSE 0 END AS "F2",
CASE WHEN Y."RC">0 AND Y."JE">0 THEN 1 ELSE 0 END AS "F3",
CASE WHEN Y."INV">0 AND Y."IA">0 THEN 1 ELSE 0 END AS "F4",
CASE WHEN Y."INV">0 AND Y."CM">0 THEN 1 ELSE 0 END AS "F5",
CASE WHEN UU."USER_CODE" IN ('manager','admin','Support','AlertSvc','B1i','B1i1','Workflow','addon1','addon2','addon3','mang','fin','oLD') OR IFNULL(TRIM(UU."U_NAME"),'')='' THEN 1 ELSE 0 END AS "F6",
CASE WHEN UU."Locked"='Y' THEN 1 ELSE 0 END AS "F7"
FROM (
SELECT A."U",
SUM(CASE WHEN A."T"='INV' THEN 1 ELSE 0 END) AS "INV",
SUM(CASE WHEN A."T"='CM' THEN 1 ELSE 0 END) AS "CM",
SUM(CASE WHEN A."T"='RC' THEN 1 ELSE 0 END) AS "RC",
SUM(CASE WHEN A."T"='PO' THEN 1 ELSE 0 END) AS "PO",
SUM(CASE WHEN A."T"='PI' THEN 1 ELSE 0 END) AS "PI",
SUM(CASE WHEN A."T"='VP' THEN 1 ELSE 0 END) AS "VP",
SUM(CASE WHEN A."T"='JE' THEN 1 ELSE 0 END) AS "JE",
SUM(CASE WHEN A."T"='IA' THEN 1 ELSE 0 END) AS "IA",
SUM(CASE WHEN A."T"='BP' THEN 1 ELSE 0 END) AS "BP"
FROM (
SELECT 'INV' AS "T","UserSign" AS "U","CreateDate" AS "D" FROM OINV WHERE "CANCELED"='N' AND "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'CM',"UserSign","CreateDate" FROM ORIN WHERE "CANCELED"='N' AND "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'RC',"UserSign","CreateDate" FROM ORCT WHERE "Canceled"='N' AND "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'PO',"UserSign","CreateDate" FROM OPOR WHERE "CANCELED"='N' AND "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'PI',"UserSign","CreateDate" FROM OPCH WHERE "CANCELED"='N' AND "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'VP',"UserSign","CreateDate" FROM OVPM WHERE "Canceled"='N' AND "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'JE',"UserSign","CreateDate" FROM OJDT WHERE "TransType"='30' AND "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'IA',"UserSign","CreateDate" FROM OIGN WHERE "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'IA',"UserSign","CreateDate" FROM OIGE WHERE "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'BP',BB."UserSign2",BB."UpdateDate" FROM (SELECT "CardCode","LogInstanc","UserSign2","UpdateDate" FROM ACRD UNION SELECT "CardCode","LogInstanc","UserSign2","UpdateDate" FROM OCRD) BB WHERE BB."UpdateDate">=ADD_DAYS(CURRENT_DATE,-400)
) A
WHERE A."D" BETWEEN [%0] AND [%1]
GROUP BY A."U"
) Y
INNER JOIN OUSR UU ON UU."USERID"=Y."U"
) X
INNER JOIN OUSR U0 ON U0."USERID"=X."U"
ORDER BY X."F1"+X."F2"+X."F3"+X."F4"+X."F5"+X."F6"+X."F7" DESC,X."INV"+X."RC"+X."VP"+X."JE" DESC
</script>
<script type="text/plain" id="sql_q16">
/* SELECT T0."DocDate" FROM OINV T0 WHERE T0."DocDate" BETWEEN [%0] AND [%1] */
SELECT U0."USERID" AS "فتح المستخدم",
U0."USER_CODE" AS "رمز المستخدم",
U0."U_NAME" AS "اسم المستخدم",
W."OT" AS "نوع الحركة",
W."N" AS "رقم المستند",
I0."DocEntry" AS "فتح فاتورة",
R0."DocEntry" AS "فتح اشعار دائن",
RC."DocEntry" AS "فتح سند قبض",
PO."DocEntry" AS "فتح امر شراء",
PI."DocEntry" AS "فتح فاتورة شراء",
VP."DocEntry" AS "فتح سند صرف",
JE."TransId" AS "فتح القيد",
GN."DocEntry" AS "فتح ادخال مخزون",
GE."DocEntry" AS "فتح اخراج مخزون",
B0."CardCode" AS "فتح الطرف",
B0."CardName" AS "اسم الطرف",
W."D" AS "تاريخ المستند",
W."C" AS "تاريخ الادخال",
DAYS_BETWEEN(W."D",W."C") AS "ايام التأخير",
W."Amt" AS "المبلغ",
W."F1"+W."F2"+W."F3"+W."F4"+W."F5" AS "درجة الخطورة",
RTRIM(
CASE WHEN W."F1"=1 THEN '✖ عدل بطاقة الطرف وصرف له / ' ELSE '' END||
CASE WHEN W."F2"=1 THEN '✖ فاتورة واشعار دائن لنفس العميل / ' ELSE '' END||
CASE WHEN W."F3"=1 THEN '✖ قبض وقيد يدوي على نفس العميل / ' ELSE '' END||
CASE WHEN W."F4"=1 THEN '✖ ادخال بتاريخ سابق / ' ELSE '' END||
CASE WHEN W."F5"=1 THEN '✖ ادخال يوم جمعة / ' ELSE '' END||
CASE WHEN W."F6"=1 THEN 'ℹ حساب عام او تقني / ' ELSE '' END
,' /') AS "الملاحظات"
FROM (
SELECT V.*,
CASE WHEN V."T" IN ('BP','VP') AND V."nBP">0 AND V."nVP">0 THEN 1 ELSE 0 END AS "F1",
CASE WHEN V."T" IN ('INV','CM') AND V."nINV">0 AND V."nCM">0 THEN 1 ELSE 0 END AS "F2",
CASE WHEN V."T" IN ('RC','JE') AND V."nRC">0 AND V."nJE">0 THEN 1 ELSE 0 END AS "F3",
CASE WHEN V."T"<>'BP' AND DAYS_BETWEEN(V."D",V."C")>2 THEN 1 ELSE 0 END AS "F4",
CASE WHEN WEEKDAY(V."C")=4 THEN 1 ELSE 0 END AS "F5",
CASE WHEN UU."USER_CODE" IN ('manager','admin','Support','AlertSvc','B1i','B1i1','Workflow','addon1','addon2','addon3','mang','fin','oLD') OR IFNULL(TRIM(UU."U_NAME"),'')='' THEN 1 ELSE 0 END AS "F6"
FROM (
SELECT A.*,
SUM(CASE WHEN A."T"='BP' THEN 1 ELSE 0 END) OVER (PARTITION BY A."U",A."Card") AS "nBP",
SUM(CASE WHEN A."T"='VP' THEN 1 ELSE 0 END) OVER (PARTITION BY A."U",A."Card") AS "nVP",
SUM(CASE WHEN A."T"='INV' THEN 1 ELSE 0 END) OVER (PARTITION BY A."U",A."Card") AS "nINV",
SUM(CASE WHEN A."T"='CM' THEN 1 ELSE 0 END) OVER (PARTITION BY A."U",A."Card") AS "nCM",
SUM(CASE WHEN A."T"='RC' THEN 1 ELSE 0 END) OVER (PARTITION BY A."U",A."Card") AS "nRC",
SUM(CASE WHEN A."T"='JE' THEN 1 ELSE 0 END) OVER (PARTITION BY A."U",A."Card") AS "nJE"
FROM (
SELECT 'INV' AS "T",'فاتورة مبيعات' AS "OT","DocEntry" AS "E","DocNum" AS "N","DocDate" AS "D","CreateDate" AS "C","UserSign" AS "U","CardCode" AS "Card","DocTotal" AS "Amt" FROM OINV WHERE "CANCELED"='N' AND "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'CM','اشعار دائن',"DocEntry","DocNum","DocDate","CreateDate","UserSign","CardCode","DocTotal" FROM ORIN WHERE "CANCELED"='N' AND "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'RC','سند قبض',"DocEntry","DocNum","DocDate","CreateDate","UserSign","CardCode","DocTotal" FROM ORCT WHERE "Canceled"='N' AND "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'PO','امر شراء',"DocEntry","DocNum","DocDate","CreateDate","UserSign","CardCode","DocTotal" FROM OPOR WHERE "CANCELED"='N' AND "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'PI','فاتورة شراء',"DocEntry","DocNum","DocDate","CreateDate","UserSign","CardCode","DocTotal" FROM OPCH WHERE "CANCELED"='N' AND "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'VP','سند صرف',"DocEntry","DocNum","DocDate","CreateDate","UserSign","CardCode","DocTotal" FROM OVPM WHERE "Canceled"='N' AND "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'JE','قيد يدوي',O."TransId",O."Number",O."RefDate",O."CreateDate",O."UserSign",(SELECT MAX(J."ShortName") FROM JDT1 J WHERE J."TransId"=O."TransId" AND J."ShortName"<>J."Account"),O."LocTotal" FROM OJDT O WHERE O."TransType"='30' AND O."CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'GN','ادخال مخزون',"DocEntry","DocNum","DocDate","CreateDate","UserSign",NULL,"DocTotal" FROM OIGN WHERE "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'GE','اخراج مخزون',"DocEntry","DocNum","DocDate","CreateDate","UserSign",NULL,"DocTotal" FROM OIGE WHERE "CreateDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL SELECT 'BP','تعديل بطاقة',NULL,BB."LogInstanc",BB."UpdateDate",BB."UpdateDate",BB."UserSign2",BB."CardCode",NULL FROM (SELECT "CardCode","LogInstanc","UserSign2","UpdateDate" FROM ACRD UNION SELECT "CardCode","LogInstanc","UserSign2","UpdateDate" FROM OCRD) BB WHERE BB."UpdateDate">=ADD_DAYS(CURRENT_DATE,-400)
) A
WHERE A."C" BETWEEN [%0] AND [%1]
) V
INNER JOIN OUSR UU ON UU."USERID"=V."U"
) W
INNER JOIN OUSR U0 ON U0."USERID"=W."U"
LEFT JOIN OINV I0 ON W."T"='INV' AND I0."DocEntry"=W."E"
LEFT JOIN ORIN R0 ON W."T"='CM' AND R0."DocEntry"=W."E"
LEFT JOIN ORCT RC ON W."T"='RC' AND RC."DocEntry"=W."E"
LEFT JOIN OPOR PO ON W."T"='PO' AND PO."DocEntry"=W."E"
LEFT JOIN OPCH PI ON W."T"='PI' AND PI."DocEntry"=W."E"
LEFT JOIN OVPM VP ON W."T"='VP' AND VP."DocEntry"=W."E"
LEFT JOIN OJDT JE ON W."T"='JE' AND JE."TransId"=W."E"
LEFT JOIN OIGN GN ON W."T"='GN' AND GN."DocEntry"=W."E"
LEFT JOIN OIGE GE ON W."T"='GE' AND GE."DocEntry"=W."E"
LEFT JOIN OCRD B0 ON B0."CardCode"=W."Card"
WHERE W."F1"+W."F2"+W."F3"+W."F4"+W."F5">0
ORDER BY U0."U_NAME",W."F1"+W."F2"+W."F3"+W."F4"+W."F5" DESC,W."C"
</script>
<script type="text/plain" id="sql_q17">
/* SELECT FROM OINV T0 */
/* WHERE T0."DocDate" BETWEEN [%0] AND [%1] */

WITH Combined AS (
    -- ============ الفواتير ============
    SELECT
        T0."DocEntry",
        T0."CardCode",
        T0."CardName",
        T0."DocDate",
        YEAR(T0."DocDate")   AS "Yr",
        MONTH(T0."DocDate")  AS "Mo",
        T0."DiscSum"         AS "DocDiscount",
        T1."LineNum",
        T1."ItemCode",
        T1."Dscription",
        T1."Quantity"        AS "Quantity",
        T1."Price",
        T1."LineTotal"       AS "LineTotal",
        'Invoice'            AS "Type",
        T0."SlpCode",

        COALESCE(
            (SELECT MAX(B."DistNumber")
             FROM OITL O INNER JOIN ITL1 L ON O."LogEntry" = L."LogEntry"
             INNER JOIN OBTN B ON L."ItemCode" = B."ItemCode" AND L."SysNumber" = B."SysNumber"
             WHERE O."DocType" = 13 AND O."DocEntry" = T0."DocEntry" AND O."DocLine" = T1."LineNum"
               AND O."StockEff" = 1),
            (SELECT MAX(B."DistNumber")
             FROM DLN1 DL
             INNER JOIN OITL O ON O."DocType" = 15 AND O."DocEntry" = DL."DocEntry" AND O."DocLine" = DL."LineNum"
             INNER JOIN ITL1 L ON O."LogEntry" = L."LogEntry"
             INNER JOIN OBTN B ON L."ItemCode" = B."ItemCode" AND L."SysNumber" = B."SysNumber"
             WHERE DL."BaseEntry" = T0."DocEntry" AND DL."BaseLine" = T1."LineNum" AND DL."BaseType" = 13
               AND O."StockEff" = 1),
            (SELECT MAX(B."DistNumber")
             FROM OITL O INNER JOIN ITL1 L ON O."LogEntry" = L."LogEntry"
             INNER JOIN OBTN B ON L."ItemCode" = B."ItemCode" AND L."SysNumber" = B."SysNumber"
             WHERE O."DocType" = 15 AND O."DocEntry" = T1."BaseEntry" AND O."DocLine" = T1."BaseLine"
               AND T1."BaseType" = 15 AND O."StockEff" = 1)
        ) AS "BatchNum",

        (COALESCE(
            (SELECT MAX(B."CostTotal" / NULLIF(B."Quantity",0))
             FROM OITL O INNER JOIN ITL1 L ON O."LogEntry" = L."LogEntry"
             INNER JOIN OBTN B ON L."ItemCode" = B."ItemCode" AND L."SysNumber" = B."SysNumber"
             WHERE O."DocType" = 13 AND O."DocEntry" = T0."DocEntry" AND O."DocLine" = T1."LineNum"
               AND O."StockEff" = 1),
            (SELECT MAX(B."CostTotal" / NULLIF(B."Quantity",0))
             FROM DLN1 DL
             INNER JOIN OITL O ON O."DocType" = 15 AND O."DocEntry" = DL."DocEntry" AND O."DocLine" = DL."LineNum"
             INNER JOIN ITL1 L ON O."LogEntry" = L."LogEntry"
             INNER JOIN OBTN B ON L."ItemCode" = B."ItemCode" AND L."SysNumber" = B."SysNumber"
             WHERE DL."BaseEntry" = T0."DocEntry" AND DL."BaseLine" = T1."LineNum" AND DL."BaseType" = 13
               AND O."StockEff" = 1),
            (SELECT MAX(B."CostTotal" / NULLIF(B."Quantity",0))
             FROM OITL O INNER JOIN ITL1 L ON O."LogEntry" = L."LogEntry"
             INNER JOIN OBTN B ON L."ItemCode" = B."ItemCode" AND L."SysNumber" = B."SysNumber"
             WHERE O."DocType" = 15 AND O."DocEntry" = T1."BaseEntry" AND O."DocLine" = T1."BaseLine"
               AND T1."BaseType" = 15 AND O."StockEff" = 1)
        ) * IFNULL(NULLIF(T1."NumPerMsr",0), 1)) AS "UnitCost",

        ((SELECT SUM(Q."Quantity" * (BN."CostTotal" / NULLIF(BN."Quantity",0)))
                / NULLIF(SUM(Q."Quantity"),0)
         FROM OBTQ Q
         INNER JOIN OBTN BN ON Q."ItemCode" = BN."ItemCode" AND Q."SysNumber" = BN."SysNumber"
         WHERE Q."ItemCode" = T1."ItemCode" AND Q."WhsCode" = T1."WhsCode" AND Q."Quantity" > 0
        ) * IFNULL(NULLIF(T1."NumPerMsr",0), 1)) AS "EstCost"

    FROM "OINV" T0
    INNER JOIN "INV1" T1 ON T0."DocEntry" = T1."DocEntry"
    WHERE
        T0."CANCELED" = 'N'
        AND T0."DocDate" BETWEEN [%0] AND [%1]

    UNION ALL

    -- ============ المرتجعات ============
    SELECT
        T0."DocEntry",
        T0."CardCode",
        T0."CardName",
        T0."DocDate",
        YEAR(T0."DocDate")   AS "Yr",
        MONTH(T0."DocDate")  AS "Mo",
        T0."DiscSum"         AS "DocDiscount",
        T1."LineNum",
        T1."ItemCode",
        T1."Dscription",
        -T1."Quantity"       AS "Quantity",
        T1."Price",
        -T1."LineTotal"      AS "LineTotal",
        'Return'             AS "Type",
        T0."SlpCode",

        (SELECT MAX(B."DistNumber")
         FROM OITL O INNER JOIN ITL1 L ON O."LogEntry" = L."LogEntry"
         INNER JOIN OBTN B ON L."ItemCode" = B."ItemCode" AND L."SysNumber" = B."SysNumber"
         WHERE O."DocType" = 14 AND O."DocEntry" = T0."DocEntry" AND O."DocLine" = T1."LineNum"
           AND O."StockEff" = 1) AS "BatchNum",

        ((SELECT MAX(B."CostTotal" / NULLIF(B."Quantity",0))
          FROM OITL O INNER JOIN ITL1 L ON O."LogEntry" = L."LogEntry"
          INNER JOIN OBTN B ON L."ItemCode" = B."ItemCode" AND L."SysNumber" = B."SysNumber"
          WHERE O."DocType" = 14 AND O."DocEntry" = T0."DocEntry" AND O."DocLine" = T1."LineNum"
            AND O."StockEff" = 1) * IFNULL(NULLIF(T1."NumPerMsr",0), 1)) AS "UnitCost",

        NULL AS "EstCost"

    FROM "ORIN" T0
    INNER JOIN "RIN1" T1 ON T0."DocEntry" = T1."DocEntry"
    WHERE
        T0."CANCELED" = 'N'
        AND T0."DocDate" BETWEEN [%0] AND [%1]
),
LineWithDocDisc AS (
    SELECT
        C.*,
        D."DocTotalLines",
        CASE
            WHEN D."DocTotalLines" = 0 THEN 0
            ELSE C."LineTotal" / D."DocTotalLines"
        END AS "LineRatio"
    FROM Combined C
    INNER JOIN (
        SELECT "Type", "DocEntry", SUM("LineTotal") AS "DocTotalLines"
        FROM Combined
        GROUP BY "Type", "DocEntry"
    ) D ON C."Type" = D."Type" AND C."DocEntry" = D."DocEntry"
),
Lines AS (
    SELECT
        L.*,
        L."LineTotal" - CASE WHEN L."Type" = 'Return' THEN - (L."LineRatio" * L."DocDiscount")
                              ELSE (L."LineRatio" * L."DocDiscount")
                         END AS "NetLine"
    FROM LineWithDocDisc L
)
SELECT
    L."Yr"                 AS "السنة",
    L."Mo"                 AS "الشهر",
    L."DocDate"            AS "التاريخ",

    CASE WHEN L."Type" = 'Return' THEN 'مرتجع' ELSE 'فاتورة' END AS "نوع المستند",

    /* روابط المستندات - تنسحب مباشرة من OINV / ORIN حتى يطلع السهم */
    OI."DocNum"            AS "رقم الفاتورة",
    RN."DocNum"            AS "رقم المرتجع",

    L."CardCode"           AS "Customer/Vendor Code",
    L."CardName"           AS "Customer/Vendor Name",
    C."GroupCode"          AS "Customer Category",
    G."GroupName"          AS "Customer Category Name",
    S."SlpName"            AS "Sales Rep",
    L."ItemCode"           AS "Item No.",
    MAX(L."Dscription")    AS "Item/Service Description",

    L."BatchNum"           AS "رقم الباتش",
    CASE WHEN L."BatchNum" IS NULL THEN 'غير مدلفرة' ELSE 'مدلفرة' END AS "حالة التسليم",

    MAX(IT."CardCode")     AS "رمز مورد الصنف",
    MAX(VEN."CardName")    AS "اسم مورد الصنف",

    MAX(IT."SalUnitMsr")   AS "وحدة البيع",
    MAX(IT."NumInSale")    AS "معامل التحويل",

    MAX(IT."SWeight1")     AS "وزن الوحدة",
    MAX(IT."SWght1Unit")   AS "وحدة الوزن",

    SUM(L."Quantity")                                              AS "الكمية",
    SUM(L."Quantity" * COALESCE(IT."NumInSale", 1))                AS "الكمية (موحّدة بالوحدة الرئيسية)",
    SUM(L."Quantity" * COALESCE(IT."NumInSale", 1) * COALESCE(IT."SWeight1", 0)) AS "إجمالي الوزن",

    SUM(L."Quantity" * L."Price")                                  AS "المبيعات قبل الخصم",

    SUM(
        CASE WHEN L."Type" = 'Return' THEN - ((L."Quantity" * L."Price") - L."LineTotal")
             ELSE ((L."Quantity" * L."Price") - L."LineTotal")
        END
    ) AS "خصم السطر",

    SUM(
        CASE WHEN L."Type" = 'Return' THEN - (L."LineRatio" * L."DocDiscount")
             ELSE (L."LineRatio" * L."DocDiscount")
        END
    ) AS "خصم المستند",

    SUM(L."NetLine")                                               AS "صافي المبيعات",

    MAX(L."UnitCost")                                              AS "كلفة الوحدة الحالية للباتش",
    SUM(L."Quantity" * L."UnitCost")                               AS "إجمالي الكلفة",
    SUM(L."NetLine") - SUM(L."Quantity" * L."UnitCost")            AS "مجمل الربح",

    CASE
        WHEN SUM(L."NetLine") = 0 OR SUM(L."Quantity" * L."UnitCost") IS NULL THEN NULL
        ELSE ROUND((SUM(L."NetLine") - SUM(L."Quantity" * L."UnitCost")) / SUM(L."NetLine") * 100, 2)
    END                                                            AS "نسبة الربح %",

    SUM(CASE WHEN L."BatchNum" IS NULL THEN L."Quantity" * L."EstCost" END) AS "كلفة تقديرية (غير مدلفرة)",

    CASE
        WHEN L."BatchNum" IS NULL
        THEN SUM(L."NetLine") - SUM(L."Quantity" * L."EstCost")
        ELSE NULL
    END                                                            AS "مجمل الربح التقديري",

    CASE
        WHEN L."BatchNum" IS NOT NULL THEN NULL
        WHEN SUM(L."NetLine") = 0 OR SUM(L."Quantity" * L."EstCost") IS NULL THEN NULL
        ELSE ROUND((SUM(L."NetLine") - SUM(L."Quantity" * L."EstCost")) / SUM(L."NetLine") * 100, 2)
    END                                                            AS "نسبة الربح التقديرية %"

FROM Lines L
LEFT JOIN OINV OI  ON L."Type" = 'Invoice' AND OI."DocEntry" = L."DocEntry"
LEFT JOIN ORIN RN  ON L."Type" = 'Return'  AND RN."DocEntry" = L."DocEntry"
LEFT JOIN OCRD C   ON L."CardCode" = C."CardCode"
LEFT JOIN OCRG G   ON C."GroupCode" = G."GroupCode"
LEFT JOIN OSLP S   ON L."SlpCode" = S."SlpCode"
LEFT JOIN OITM IT  ON L."ItemCode" = IT."ItemCode"
LEFT JOIN OCRD VEN ON IT."CardCode" = VEN."CardCode"

GROUP BY
    L."Yr", L."Mo", L."DocDate", L."Type", L."DocEntry", OI."DocNum", RN."DocNum",
    L."CardCode", L."CardName", L."ItemCode", L."BatchNum",
    C."GroupCode", G."GroupName", S."SlpName"

HAVING
    SUM(L."Quantity") <> 0
    OR SUM(L."NetLine") <> 0

ORDER BY
    L."DocDate", L."Type", OI."DocNum", RN."DocNum", L."ItemCode", L."BatchNum";
</script>
<script type="text/plain" id="sql_aging1">
/* SELECT C."CardCode" FROM OCRD C WHERE C."CreateDate" < [%0] */
SELECT
    C."CardCode"                       AS "رمز العميل",

    IFNULL(TG."ExtraDays", 0)          AS "أيام السماح",

    IFNULL((
        SELECT SUM(J1."Debit" - J1."Credit")
        FROM JDT1 J1
        WHERE J1."ShortName" = C."CardCode" AND J1."ShortName" <> J1."Account"
          AND J1."RefDate" <= '[%0]'
    ), 0)                               AS "الرصيد حتى تاريخ اللقطة",

    IFNULL((
        SELECT SUM(K."CheckSum")
        FROM RCT1 K INNER JOIN ORCT R ON K."DocNum" = R."DocEntry"
        WHERE R."Canceled" = 'N' AND R."CardCode" = C."CardCode"
          AND R."DocDate" <= '[%0]' AND K."DueDate" > '[%0]'
    ), 0)                               AS "الشيكات المؤجلة",

    IFNULL((SELECT SUM(CASE WHEN X."Kind"='I' THEN X."Amt" ELSE -X."Amt" END)
        FROM (SELECT "CardCode","DocTotal" AS "Amt",'I' AS "Kind","DocDate" FROM OINV WHERE "CANCELED"='N'
              UNION ALL SELECT "CardCode","DocTotal",'R',"DocDate" FROM ORIN WHERE "CANCELED"='N') X
        WHERE X."CardCode"=C."CardCode" AND X."DocDate" <= '[%0]'
          AND YEAR(X."DocDate")*12+MONTH(X."DocDate") = YEAR('[%0]')*12+MONTH('[%0]')-0
    ), 0)                                AS "M0 الشهر الحالي (حتى تاريخ اللقطة)",
    IFNULL((SELECT SUM(CASE WHEN X."Kind"='I' THEN X."Amt" ELSE -X."Amt" END)
        FROM (SELECT "CardCode","DocTotal" AS "Amt",'I' AS "Kind","DocDate" FROM OINV WHERE "CANCELED"='N'
              UNION ALL SELECT "CardCode","DocTotal",'R',"DocDate" FROM ORIN WHERE "CANCELED"='N') X
        WHERE X."CardCode"=C."CardCode" AND X."DocDate" <= '[%0]'
          AND YEAR(X."DocDate")*12+MONTH(X."DocDate") = YEAR('[%0]')*12+MONTH('[%0]')-1
    ), 0)                                AS "M1 شهر قبل",
    IFNULL((SELECT SUM(CASE WHEN X."Kind"='I' THEN X."Amt" ELSE -X."Amt" END)
        FROM (SELECT "CardCode","DocTotal" AS "Amt",'I' AS "Kind","DocDate" FROM OINV WHERE "CANCELED"='N'
              UNION ALL SELECT "CardCode","DocTotal",'R',"DocDate" FROM ORIN WHERE "CANCELED"='N') X
        WHERE X."CardCode"=C."CardCode" AND X."DocDate" <= '[%0]'
          AND YEAR(X."DocDate")*12+MONTH(X."DocDate") = YEAR('[%0]')*12+MONTH('[%0]')-2
    ), 0)                                AS "M2 شهرين قبل",
    IFNULL((SELECT SUM(CASE WHEN X."Kind"='I' THEN X."Amt" ELSE -X."Amt" END)
        FROM (SELECT "CardCode","DocTotal" AS "Amt",'I' AS "Kind","DocDate" FROM OINV WHERE "CANCELED"='N'
              UNION ALL SELECT "CardCode","DocTotal",'R',"DocDate" FROM ORIN WHERE "CANCELED"='N') X
        WHERE X."CardCode"=C."CardCode" AND X."DocDate" <= '[%0]'
          AND YEAR(X."DocDate")*12+MONTH(X."DocDate") = YEAR('[%0]')*12+MONTH('[%0]')-3
    ), 0)                                AS "M3 3 أشهر قبل",
    IFNULL((SELECT SUM(CASE WHEN X."Kind"='I' THEN X."Amt" ELSE -X."Amt" END)
        FROM (SELECT "CardCode","DocTotal" AS "Amt",'I' AS "Kind","DocDate" FROM OINV WHERE "CANCELED"='N'
              UNION ALL SELECT "CardCode","DocTotal",'R',"DocDate" FROM ORIN WHERE "CANCELED"='N') X
        WHERE X."CardCode"=C."CardCode" AND X."DocDate" <= '[%0]'
          AND YEAR(X."DocDate")*12+MONTH(X."DocDate") = YEAR('[%0]')*12+MONTH('[%0]')-4
    ), 0)                                AS "M4 4 أشهر قبل",
    IFNULL((SELECT SUM(CASE WHEN X."Kind"='I' THEN X."Amt" ELSE -X."Amt" END)
        FROM (SELECT "CardCode","DocTotal" AS "Amt",'I' AS "Kind","DocDate" FROM OINV WHERE "CANCELED"='N'
              UNION ALL SELECT "CardCode","DocTotal",'R',"DocDate" FROM ORIN WHERE "CANCELED"='N') X
        WHERE X."CardCode"=C."CardCode" AND X."DocDate" <= '[%0]'
          AND YEAR(X."DocDate")*12+MONTH(X."DocDate") = YEAR('[%0]')*12+MONTH('[%0]')-5
    ), 0)                                AS "M5 5 أشهر قبل",
    IFNULL((SELECT SUM(CASE WHEN X."Kind"='I' THEN X."Amt" ELSE -X."Amt" END)
        FROM (SELECT "CardCode","DocTotal" AS "Amt",'I' AS "Kind","DocDate" FROM OINV WHERE "CANCELED"='N'
              UNION ALL SELECT "CardCode","DocTotal",'R',"DocDate" FROM ORIN WHERE "CANCELED"='N') X
        WHERE X."CardCode"=C."CardCode" AND X."DocDate" <= '[%0]'
          AND YEAR(X."DocDate")*12+MONTH(X."DocDate") = YEAR('[%0]')*12+MONTH('[%0]')-6
    ), 0)                                AS "M6 6 أشهر قبل",
    IFNULL((SELECT SUM(CASE WHEN X."Kind"='I' THEN X."Amt" ELSE -X."Amt" END)
        FROM (SELECT "CardCode","DocTotal" AS "Amt",'I' AS "Kind","DocDate" FROM OINV WHERE "CANCELED"='N'
              UNION ALL SELECT "CardCode","DocTotal",'R',"DocDate" FROM ORIN WHERE "CANCELED"='N') X
        WHERE X."CardCode"=C."CardCode" AND X."DocDate" <= '[%0]'
          AND YEAR(X."DocDate")*12+MONTH(X."DocDate") = YEAR('[%0]')*12+MONTH('[%0]')-7
    ), 0)                                AS "M7 7 أشهر قبل",
    IFNULL((SELECT SUM(CASE WHEN X."Kind"='I' THEN X."Amt" ELSE -X."Amt" END)
        FROM (SELECT "CardCode","DocTotal" AS "Amt",'I' AS "Kind","DocDate" FROM OINV WHERE "CANCELED"='N'
              UNION ALL SELECT "CardCode","DocTotal",'R',"DocDate" FROM ORIN WHERE "CANCELED"='N') X
        WHERE X."CardCode"=C."CardCode" AND X."DocDate" <= '[%0]'
          AND YEAR(X."DocDate")*12+MONTH(X."DocDate") = YEAR('[%0]')*12+MONTH('[%0]')-8
    ), 0)                                AS "M8 8 أشهر قبل",
    IFNULL((SELECT SUM(CASE WHEN X."Kind"='I' THEN X."Amt" ELSE -X."Amt" END)
        FROM (SELECT "CardCode","DocTotal" AS "Amt",'I' AS "Kind","DocDate" FROM OINV WHERE "CANCELED"='N'
              UNION ALL SELECT "CardCode","DocTotal",'R',"DocDate" FROM ORIN WHERE "CANCELED"='N') X
        WHERE X."CardCode"=C."CardCode" AND X."DocDate" <= '[%0]'
          AND YEAR(X."DocDate")*12+MONTH(X."DocDate") = YEAR('[%0]')*12+MONTH('[%0]')-9
    ), 0)                                AS "M9 9 أشهر قبل",
    IFNULL((SELECT SUM(CASE WHEN X."Kind"='I' THEN X."Amt" ELSE -X."Amt" END)
        FROM (SELECT "CardCode","DocTotal" AS "Amt",'I' AS "Kind","DocDate" FROM OINV WHERE "CANCELED"='N'
              UNION ALL SELECT "CardCode","DocTotal",'R',"DocDate" FROM ORIN WHERE "CANCELED"='N') X
        WHERE X."CardCode"=C."CardCode" AND X."DocDate" <= '[%0]'
          AND YEAR(X."DocDate")*12+MONTH(X."DocDate") = YEAR('[%0]')*12+MONTH('[%0]')-10
    ), 0)                                AS "M10 10 أشهر قبل",
    IFNULL((SELECT SUM(CASE WHEN X."Kind"='I' THEN X."Amt" ELSE -X."Amt" END)
        FROM (SELECT "CardCode","DocTotal" AS "Amt",'I' AS "Kind","DocDate" FROM OINV WHERE "CANCELED"='N'
              UNION ALL SELECT "CardCode","DocTotal",'R',"DocDate" FROM ORIN WHERE "CANCELED"='N') X
        WHERE X."CardCode"=C."CardCode" AND X."DocDate" <= '[%0]'
          AND YEAR(X."DocDate")*12+MONTH(X."DocDate") = YEAR('[%0]')*12+MONTH('[%0]')-11
    ), 0)                                AS "M11 11 أشهر قبل",
    IFNULL((SELECT SUM(CASE WHEN X."Kind"='I' THEN X."Amt" ELSE -X."Amt" END)
        FROM (SELECT "CardCode","DocTotal" AS "Amt",'I' AS "Kind","DocDate" FROM OINV WHERE "CANCELED"='N'
              UNION ALL SELECT "CardCode","DocTotal",'R',"DocDate" FROM ORIN WHERE "CANCELED"='N') X
        WHERE X."CardCode"=C."CardCode" AND X."DocDate" <= '[%0]'
          AND YEAR(X."DocDate")*12+MONTH(X."DocDate") <= YEAR('[%0]')*12+MONTH('[%0]')-12
    ), 0)                                AS "M12plus أقدم من 12 شهر"

FROM "OCRD" C
LEFT JOIN "OSLP" S  ON C."SlpCode" = S."SlpCode"
LEFT JOIN "OCTG" TG ON C."GroupNum" = TG."GroupNum"
WHERE C."CardType" = 'C'
ORDER BY C."CardName"
</script>

function decodeBuf(buf){
  const u=new Uint8Array(buf);
  if(u[0]===0xFF&&u[1]===0xFE)return new TextDecoder('utf-16le').decode(u.subarray(2));
  if(u[0]===0xFE&&u[1]===0xFF)return new TextDecoder('utf-16be').decode(u.subarray(2));
  if(u[0]===0xEF&&u[1]===0xBB&&u[2]===0xBF)return new TextDecoder('utf-8').decode(u.subarray(3));
  let z=0;const n=Math.min(u.length,4000);for(let i=1;i<n;i+=2)if(u[i]===0)z++;
  if(z>n/6)return new TextDecoder('utf-16le').decode(u);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(u);}catch(e){return new TextDecoder('windows-1256').decode(u);}
}
function splitCSV(line,d){
  if(d==='\t'||line.indexOf('"')<0)return line.split(d);
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;else if(ch===d){out.push(cur);cur='';}else cur+=ch;}
  out.push(cur);return out;
}
/* returns {src,loaded,head,rows} — raw strings, header matched against the tab's expected columns */
function parseText(text,src,def){
  const lines=text.split(/\r?\n/);
  const want=new Set(def.cols.map(hnorm));
  let best=null;
  for(let i=0;i<Math.min(lines.length,60);i++){const L=lines[i];if(!L.trim())continue;
    for(const d of ['\t',',',';']){const parts=splitCSV(L,d);if(parts.length<3)continue;
      let hit=0;for(const p of parts)if(want.has(hnorm(p)))hit++;
      if(!best||hit>best.hit)best={i,d,hit,parts};}}
  if(!best||best.hit<Math.max(3,Math.ceil(def.cols.length*0.4)))
    throw new Error('لم يتم التعرّف على سطر العناوين — تأكد أن الملف هو ناتج كويري «'+def.n+'» مع العناوين'+(best?' (تطابق '+best.hit+' من '+def.cols.length+' عموداً)':''));
  let head=best.parts.map(h=>h.replace(/^﻿/,'').replace(/^"|"$/g,'').trim());
  while(head.length&&!head[head.length-1])head.pop();
  const W=head.length,rows=[];
  for(let li=best.i+1;li<lines.length;li++){const L=lines[li];if(!L||!L.trim())continue;
    const r=splitCSV(L,best.d);let any=false;const row=new Array(W);
    for(let j=0;j<W;j++){const v=(r[j]==null?'':String(r[j])).trim();row[j]=v;if(v)any=true;}
    if(!any)continue;
    if(def.doc){const di=head.indexOf(def.doc);if(di>=0&&!row[di]&&r.length<W/2)continue;}
    rows.push(row);}
  if(!rows.length)throw new Error('لا توجد أسطر بيانات تحت سطر العناوين');
  return {src,loaded:new Date().toISOString(),head,rows};
}

  const find=name=>{if(!name)return null;const k=hnorm(name);return cols.find(c=>c.k===k)||cols.find(c=>c.k.includes(k))||null;};
  const P={cols,V,n};
  P.cDoc=find(def.doc);P.cDate=find(def.date);if(P.cDate&&P.cDate.f!=='d')P.cDate=null;
  P.cRisk=find(RISK_COL);if(P.cRisk&&!(P.cRisk.f==='n'||P.cRisk.f==='i'))P.cRisk=null;

      for(let p of s.split(/\s+\/\s+|\s+\|\s+|\s+·\s+/)){p=p.trim();if(!p)continue;const q=flagLabel(p);if(q&&arr.indexOf(q)<0)arr.push(q);}}
    FL[i]=arr;for(const f of arr)cnt.set(f,(cnt.get(f)||0)+1);}
  P.FL=FL;P.flags=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  P.anyX=P.flags.some(f=>/[✖✗×]/.test(f));

  const tc=cols.filter(c=>c.f==='t'||c.f==='link'||c.f==='i');
  P.SS=new Array(n);for(let i=0;i<n;i++){let s='';for(const c of tc){const v=V[c.i][i];if(v!=null&&v!=='')s+=' '+v;}P.SS[i]=norm(s);}

  P.dimVals={};for(const c of P.dims){const m=new Map();for(let i=0;i<n;i++){const v=V[c.i][i];if(v==null||v==='')continue;m.set(String(v),(m.get(String(v))||0)+1);}P.dimVals[c.i]=[...m.keys()].sort((a,b)=>a.localeCompare(b,'ar'));}
  /* date range */
  if(P.cDate){let mn=Infinity,mx=-Infinity;const a=V[P.cDate.i];for(let i=0;i<n;i++){const v=a[i];if(v==null)continue;if(v<mn)mn=v;if(v>mx)mx=v;}P.dMin=isFinite(mn)?mn:null;P.dMax=isFinite(mx)?mx:null;}
  P.missing=def.cols.filter(t=>!cols.some(c=>c.k===hnorm(t)));
  T.P=P;
}

/* ================= filtering ================= */
function filtered(T){if(T.flt)return T.flt;const P=T.P,S=T.S,V=P.V,n=P.n,out=[];
  const qn=S.q?norm(S.q):'';const dimE=Object.entries(S.dim).filter(e=>e[1]!=='').map(e=>[+e[0],e[1]]);
  const dr=S.drill;const dA=V[P.cDate?P.cDate.i:-1],rA=P.cRisk?V[P.cRisk.i]:null,lA=P.cDelay?V[P.cDelay.i]:null;
  for(let i=0;i<n;i++){
    if(dA&&(S.d1!=null||S.d2!=null)){const d=dA[i];if(S.d1!=null&&(d==null||d<S.d1))continue;if(S.d2!=null&&(d==null||d>S.d2))continue;}
    let ok=true;
    for(const [ci,val] of dimE){if(String(V[ci][i]==null?'':V[ci][i])!==val){ok=false;break;}}if(!ok)continue;
    for(const d of dr){
      if(d.col==='__flag'){if(P.FL[i].indexOf(d.val)<0){ok=false;break;}}
      else if(d.col==='__period'){const v=dA?dA[i]:null;if(v==null||perKey(T,v)!==d.val){ok=false;break;}}
      else if(d.col==='__risk'){const v=rA?rA[i]:null;if((v==null?0:v)!==d.val){ok=false;break;}}
      else{const v=V[d.col][i];if(String(v==null?'':(P.cols[d.col].f==='d'?fmtDay(v):v))!==d.val){ok=false;break;}}}
    if(!ok)continue;
    if(S.flag){const f=P.FL[i];if(S.flag==='*'){if(!f.length)continue;}else if(S.flag==='x'){if(!f.some(x=>/[✖✗×]/.test(x)))continue;}else if(f.indexOf(S.flag)<0)continue;}
    if(S.risk>0){const v=rA?rA[i]:null;if(v==null||v<S.risk)continue;}
    if(S.delay>0){const v=lA?lA[i]:null;if(v==null||v<S.delay)continue;}
    if(qn&&P.SS[i].indexOf(qn)<0)continue;
    out.push(i);}
  T.flt=out;return out;}
function perMode(T){const S=T.S,P=T.P;if(S.per!=='auto')return S.per;const idx=filtered(T);const a=P.V[P.cDate.i];let mn=Infinity,mx=-Infinity;for(const i of idx){const v=a[i];if(v==null)continue;if(v<mn)mn=v;if(v>mx)mx=v;}
  const span=isFinite(mx)?mx-mn:0;return span<=45?'day':span<=200?'week':'month';}
function perKey(T,v){const m=perMode(T);return m==='day'?v:m==='week'?weekKey(v):monthKey(v);}
function perLabel(T,k){const m=perMode(T);return m==='day'?fmtDay(k)+' '+AR_D[dowOf(k)]:m==='week'?weekLabel(k):monthLabel(k);}

/* ================= aggregation ================= */
/* group rows (indices) by key function; returns array of {key,label,n,nd,m:[...sums],fl,fx,risk,rows:[idx]} */
function groupBy(T,idx,keyFn,labelFn){const P=T.P,V=P.V,m=new Map();const dA=P.cDoc?V[P.cDoc.i]:null,rA=P.cRisk?V[P.cRisk.i]:null;
  for(const i of idx){const k=keyFn(i);if(k==null)continue;let g=m.get(k);
    if(!g){g={key:k,label:labelFn?labelFn(k):String(k),n:0,docs:new Set(),m:P.ms.map(()=>0),fl:0,fx:0,risk:0,rows:[]};m.set(k,g);}
    g.n++;g.rows.push(i);if(dA){const d=dA[i];if(d!=null&&d!=='')g.docs.add(d);}
    for(let j=0;j<P.ms.length;j++){const v=V[P.ms[j].i][i];if(v!=null)g.m[j]+=v;}
    const f=P.FL[i];if(f.length){g.fl++;if(f.some(x=>/[✖✗×]/.test(x)))g.fx++;}
    if(rA){const r=rA[i];if(r!=null&&r>g.risk)g.risk=r;}}
  const out=[...m.values()];for(const g of out){g.nd=g.docs.size;delete g.docs;}return out;}
function totals(T,idx){const P=T.P,V=P.V;const t={n:idx.length,nd:0,m:P.ms.map(()=>0),fl:0,fx:0,r2:0,dl:0,dlc:0,dlMax:0};const ds=new Set();
  const dA=P.cDoc?V[P.cDoc.i]:null,rA=P.cRisk?V[P.cRisk.i]:null,lA=P.cDelay?V[P.cDelay.i]:null;
  for(const i of idx){if(dA){const d=dA[i];if(d!=null&&d!=='')ds.add(d);}
    for(let j=0;j<P.ms.length;j++){const v=V[P.ms[j].i][i];if(v!=null)t.m[j]+=v;}
    const f=P.FL[i];if(f.length){t.fl++;if(f.some(x=>/[✖✗×]/.test(x)))t.fx++;}
    if(rA){const r=rA[i];if(r!=null&&r>=2)t.r2++;}
    if(lA){const v=lA[i];if(v!=null){t.dl+=v;t.dlc++;if(v>t.dlMax)t.dlMax=v;}}}
  t.nd=ds.size;return t;}

    case 'n':return (v<0?'<span class="dn">':'')+(c.dec===0?F0(v):c.dec===3?F3(v):F2(v))+(v<0?'</span>':'');
    case 'i':return FI(v);
    case 'p':return (v<0?'<span class="dn">':'')+P2(v)+(v<0?'</span>':'');
    case 'd':return fmtDay(v);
    case 'pc':return PC(v);
    case 'fl':return v.map(f=>'<span class="fx'+(/[✖✗×]/.test(f)?'':' i')+'">'+esc(f)+'</span>').join('');
    default:return esc(v);}
}

const HEATR=['#fff7f5','#fde9e4','#fbd5cb','#f6b8a8','#ef9a86','#e57c65'];
function heatStyle(v,max,red){if(!(v>0)||!(max>0))return '';const p=red?HEATR:HEAT;const i=Math.min(p.length-1,Math.floor(v/max*p.length));return ' style="background:'+p[i]+'"';}
const isTx=c=>c.f==='t'||c.f==='fl'||c.f==='d'||c.tx;
function table(T,el,id,cfg){

      if(typeof x==='string'||typeof y==='string')return d*String(x==null?'':x).localeCompare(String(y==null?'':y),'ar');
      x=(x==null||!isFinite(x))?-1e18:x;y=(y==null||!isFinite(y))?-1e18:y;return d*(x-y);});}}
  cfg._sorted=rows;

function groupTotal(T,rows){const P=T.P,t={n:0,nd:'',fl:0,fx:0,risk:0};const m=P.ms.map(()=>0);for(const g of rows){t.n+=g.n;t.fl+=g.fl;t.fx+=g.fx;if(g.risk>t.risk)t.risk=g.risk;for(let j=0;j<m.length;j++)m[j]+=g.m[j];}
  m.forEach((v,j)=>t['m'+j]=v);t.pct=1;t.first='الإجمالي';return t;}
function withPct(rows){const s=rows.reduce((a,g)=>a+Math.abs(g.m[0]||0),0);for(const g of rows)g.pct=s?Math.abs(g.m[0]||0)/s:null;return rows;}

const V={};

  if(P.flags.length)K.push([P.anyX?'أسطر عليها ✖':'أسطر عليها تنبيه',FI(P.anyX?t.fx:t.fl),PC(sdiv(P.anyX?t.fx:t.fl,t.n))+' من الأسطر','red']);

  if(P.dims[0]){const g=groupBy(T,idx,i=>P.V[P.dims[0].i][i]||null);K.push(['عدد '+dimLabel(P.dims[0]),FI(g.length),'']);}

  h+='</div>';

    $('ovR').onclick=e=>{const i=e.target.dataset.hb;if(i!=null)drillTo(T,'__risk',g[+i].key,'درجة الخطورة');};}

function flagTable(T,el,id,idx,short){const P=T.P;const m=new Map();const dA=P.cDoc?P.V[P.cDoc.i]:null;
  for(const i of idx)for(const f of P.FL[i]){let g=m.get(f);if(!g){g={label:f,n:0,docs:new Set(),m:P.ms.map(()=>0)};m.set(f,g);}g.n++;if(dA&&dA[i]!=null&&dA[i]!=='')g.docs.add(dA[i]);for(let j=0;j<P.ms.length;j++){const v=P.V[P.ms[j].i][i];if(v!=null)g.m[j]+=v;}}
  const rows=[...m.values()].map(g=>{g.nd=g.docs.size;delete g.docs;g.pct=sdiv(g.n,idx.length);return g;}).sort((a,b)=>b.n-a.n);
  const cols=[{k:'#',t:'#',nos:1},{k:'label',t:'التنبيه',f:'t',h:r=>'<span class="lnk">'+esc(r.label)+'</span>',cls:'lg'},{k:'n',t:'الأسطر',f:'i',heat:true,red:true},{k:'pct',t:'% من الأسطر',f:'pc'},...(P.cDoc?[{k:'nd',t:'المستندات',f:'i'}]:[]),...msCols(T,{max:4})];
  table(T,el,id,{name:'التنبيهات',cols,rows,short,onRow:r=>drillTo(T,'__flag',r.label,'تنبيه')});}

    if(!g){g={label:k,code:str(cCode,i),n:0,docs:new Set(),net:0,cost:0,profit:0,min:0,con:0,below:0,under:0,anon:0,users:new Map(),reps:new Set(),fi:0,fp:0,fc:0,rows:[]};M.set(k,g);}

function explainView(T){const v=T.view;let e=EXPL_VIEWS[v];if(!e&&v.startsWith('g')&&v!=='guide'){const c=T.P.cols[+v.slice(1)];e={t:'حسب '+dimLabel(c),d:'تجميع كل أسطر الكويري حسب قيم «'+c.t+'»: لكل قيمة عدد الأسطر والمستندات ومجاميع المبالغ ونسبتها من الإجمالي وعدد الأسطر التي عليها تنبيه مؤكد وأعلى درجة خطورة. الجدول الثاني تفصيل ثنائي مع بُعد آخر.',cols:[]};}
  if(!e)e={t:v,d:'',cols:[]};return e;}
function printExplain(T){const g=T.def.g;if(T.def.kind==='aging')return agExplain(T);if(T.def.kind==='mil')return milExplain(T);const e=explainView(T);
  let h='<h2>شرح التقرير — '+esc(T.def.n)+' — '+esc(e.t)+'</h2>';
  h+='<h3>الهدف من هذا الكويري</h3><p>'+esc(g.goal)+'</p>';
  h+='<h3>مصدر البيانات</h3><p>ناتج الكويري المعتمد «'+esc(g.t)+'» من نظام SAP Business One عبر Query Manager ('+esc(g.m)+'). الفلترة الأصلية للكويري على تاريخ إدخال الحركة في النظام وليس تاريخ المستند، لذلك قد تظهر حركة أُدخلت اليوم بتاريخ سابق، ويبيّنها عمود «أيام التأخير».</p>';

  const cols=[...e.cols,...EXPL_COMMON];h+='<h3>معنى الأعمدة</h3><table><thead><tr><th style="width:26%">العمود</th><th>المعنى</th></tr></thead><tbody>'+cols.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>').join('')+'</tbody></table>';

  h+='<h3>كيف تقرأ النتيجة</h3><p>'+esc(g.read)+'</p><h3>ماذا تفعل</h3><ol>'+g.act.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ol>';

  return h;}

function printFilters(){const out=[];const bar=document.querySelector('#fbar .bar, #agbar');if(bar){bar.querySelectorAll('.fld').forEach(f=>{const lab=((f.querySelector('label')||{}).textContent||'').trim();const inp=f.querySelector('select,input');if(!inp||PRINT_SKIP.has(lab))return;
    if(inp.tagName==='SELECT'){if(inp.selectedIndex>0)out.push(lab+': '+inp.options[inp.selectedIndex].textContent.trim());}
    else if(inp.type==='checkbox'){if(inp.checked)out.push(lab);}else if(inp.type==='date'){if(inp.value)out.push(lab+': '+fmtDay(fromISO(inp.value)));}else if(inp.value&&inp.value!=='0')out.push(lab+': '+inp.value);});
  bar.querySelectorAll('label.chk').forEach(l=>{const c=l.querySelector('input');const t=l.textContent.trim();if(c&&c.checked&&!PRINT_SKIP.has(t))out.push(t);});}
  document.querySelectorAll('.chips .chip').forEach(c=>out.push(c.textContent.replace(/×$/,'').trim()));return out;}

function prepPrint(){const T=TABS[ACTIVE];if(!T)return false;const modal=$('ov').classList.contains('on');
  if(!modal){window.PRINT_ALL=true;try{renderTab(T);}catch(e){console.error(e);}}
  const view=((document.querySelector('#subtabs .stab.on')||{}).textContent||'').trim();const fl=printFilters();

  else if(T.P&&T.P.cDate&&T.P.dMin!=null){const d1=T.S.d1!=null?T.S.d1:T.P.dMin,d2=T.S.d2!=null?T.S.d2:T.P.dMax;basis='الفترة: '+fmtDay(d1)+(d2>d1?' إلى '+fmtDay(d2):'');}

  try{$('printExplain').innerHTML=modal?'':printExplain(T);}catch(e){console.error(e);$('printExplain').innerHTML='';}

async function migrateLegacy(){try{if(localStorage.getItem('kap_migrated_'+UID))return;
  const keys=[...QDEF.map(d=>d.id),'aging','aging_chk'];
  for(const k of keys){const old=await IDB.getRaw(k);if(old&&!(await IDB.get(k))){await IDB.put(k,old);}if(old)await IDB.delRaw(k);}
  for(const k of ['kap_active','kap_aging','kap_aging_bands','kap_aging_merge','kap_aging_mgr','kap_aging_grp']){const v=localStorage.getItem(k);if(v!=null){if(LS.get(k)==null)LS.set(k,v);localStorage.removeItem(k);}}
  localStorage.setItem('kap_migrated_'+UID,'1');}catch(e){console.error(e);}}
function renderGate(err){$('qtabs').style.display='none';$('printBtn').style.display='none';$('ubox').style.display='none';
  $('main').innerHTML='<div class="gate"><h2>تسجيل الدخول</h2><div class="sub">مركز الكيلاني للأغذية — شاشة تحليل الحزمة اليومية للتدقيق<br>نفس حساب بوابة الكيلاني. بيانات كل مستخدم (الكشوف والإعدادات) منفصلة عن غيره.</div><div class="fld"><label>البريد الإلكتروني</label><input type="email" id="lgEmail" autocomplete="username"></div><div class="fld"><label>كلمة المرور</label><input type="password" id="lgPass" autocomplete="current-password"></div><button class="btn pri" style="width:100%" id="lgBtn">دخول</button>'+(err?'<div class="err">'+esc(err)+'</div>':'')+'<div class="note">الكشوف التي ترفعها تُحفظ على هذا الجهاز باسم حسابك فقط، ولا تظهر لمستخدم آخر يسجّل دخوله على نفس الجهاز.</div></div>';
  $('lgBtn').onclick=doLogin;$('lgPass').onkeydown=e=>{if(e.key==='Enter')doLogin();};$('lgEmail').onkeydown=e=>{if(e.key==='Enter')doLogin();};}
function renderDenied(title,msg){$('main').innerHTML='<div class="gate"><h2>'+esc(title)+'</h2><div class="sub">'+esc(msg)+'</div><button class="btn" style="width:100%" onclick="doLogout()">تسجيل خروج</button></div>';}
async function doLogin(){const email=($('lgEmail').value||'').trim(),password=$('lgPass').value;if(!email||!password){renderGate('أدخل البريد الإلكتروني وكلمة المرور');return;}
  $('lgBtn').disabled=true;$('lgBtn').textContent='جارٍ الدخول...';
  try{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){renderGate('فشل الدخول: '+error.message);return;}await afterLogin(data.session);}
  catch(e){renderGate('تعذر الاتصال: '+(e.message||e));}}
async function doLogout(){try{await sb.auth.signOut();}catch(e){}location.reload();}
async function afterLogin(session){
  $('main').innerHTML='<div class="gate"><h2>جارٍ التحقق من صلاحيتك...</h2></div>';
  const {data:row,error}=await sb.from('user_screen_permissions').select('permission').eq('user_id',session.user.id).eq('screen_id',SCREEN_ID).maybeSingle();
  if(error){renderDenied('تعذّر التحقق من صلاحيتك','حصل خطأ أثناء التحقق من صلاحيتك على هذه الشاشة. حدّث الصفحة وحاول مجدداً، وإذا تكرر راجع مدير الصلاحيات.');return;}
  if(!row||!row.permission){renderDenied('لا تملك صلاحية الدخول','حسابك غير مخوَّل بالدخول على شاشة تحليل الحزمة اليومية للتدقيق. راجع مدير الصلاحيات لمنحك صلاحية من شاشة إدارة المستخدمين والصلاحيات.');return;}
  UID=session.user.id;UEMAIL=session.user.email||'';UPERM=row.permission;
  $('uEmail').textContent=UEMAIL;$('ubox').style.display='';
  await migrateLegacy();
  SYNC.on=true;SYNC.status();
  $('main').innerHTML='<div class="gate"><h2>جارٍ تحميل بياناتك من السحابة...</h2><div class="sub">الكشوف والإعدادات المحفوظة باسم حسابك</div></div>';
  try{await syncPull();}catch(e){console.error(e);SYNC.err=e.message||String(e);}
  await appBoot();SYNC.status();
}
(async()=>{
  $('ver').textContent='شاشة تحليل الحزمة اليومية للتدقيق — '+VERSION+' — مركز الكيلاني للأغذية';
  if(typeof supabase==='undefined'){$('main').innerHTML='<div class="gate"><h2>تعذّر تحميل مكتبة الدخول</h2><div class="sub">تأكد من الاتصال بالإنترنت ثم حدّث الصفحة.</div></div>';return;}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  try{const {data:{session},error}=await sb.auth.getSession();if(error){renderGate('تعذّر التحقق من الجلسة: '+error.message);return;}if(!session){renderGate();return;}await afterLogin(session);}
  catch(e){console.error(e);renderGate('تعذر الاتصال بخادم الدخول: '+(e.message||e));}
})();
</script>
</body>
</html>
