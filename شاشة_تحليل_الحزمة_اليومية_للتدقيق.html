<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة تحليل الحزمة اليومية للتدقيق</title>
<style>
:root{
  --bg:#f4f6f9;--surface:#fff;--surface2:#f8fafc;--ink:#14213d;--ink2:#475569;--muted:#8a94a6;
  --line:#e3e8ef;--line2:#cfd7e3;--accent:#1c5cab;--accent2:#0d366b;--accentSoft:#e8f0fb;
  --gold:#b8862b;--goldSoft:#fff8e8;--good:#1f7a4d;--bad:#b42318;--goodSoft:#e7f5ee;--badSoft:#fdecea;--warn:#a15c07;--warnSoft:#fff4e0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:13px}
button,input,select,textarea{font-family:inherit;font-size:13px}
header.top{background:linear-gradient(135deg,#0d366b,#1c5cab);color:#fff;padding:12px 20px 0}
header.top .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{margin:0;font-size:19px;font-weight:700}
header.top .sub{opacity:.85;font-size:12px;margin-top:3px}
.hbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
.hbtn:hover{background:rgba(255,255,255,.25)}
.tabs{display:flex;gap:3px;margin-top:10px;overflow-x:auto;scrollbar-width:thin;padding-bottom:0}
.tab{background:rgba(255,255,255,.1);color:#fff;border:0;padding:7px 11px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:600;white-space:nowrap;font-size:12.5px;display:flex;align-items:center;gap:6px}
.tab:hover{background:rgba(255,255,255,.2)}
.tab.on{background:var(--bg);color:var(--accent2)}
.tab .n{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:rgba(255,255,255,.2);font-size:11px;text-align:center}
.tab.on .n{background:var(--accentSoft);color:var(--accent2)}
.tab .cnt{font-size:10.5px;opacity:.8;font-weight:400}
.tab.has{box-shadow:inset 0 -3px 0 #f2c14e}
.tab.on.has{box-shadow:none}
main{padding:12px 16px 40px}
.thead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.thead h2{margin:0;font-size:16px;color:var(--accent2)}
.thead .m{color:var(--ink2);font-size:12px}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.stab{border:1px solid var(--line2);background:#fff;color:var(--ink2);border-radius:16px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:12px}
.stab:hover{border-color:var(--accent);color:var(--accent)}
.stab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11px;color:var(--ink2);font-weight:600}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select{border:1px solid var(--line2);border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink)}
.fld input[type=text]{width:190px}
.fld select{max-width:200px}
.btn{border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent2);color:#fff}
.btn.warn:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accentSoft);color:var(--accent2);border:1px solid #c6d9f3;border-radius:14px;padding:3px 10px;font-weight:600;font-size:12px}
.chip b{cursor:pointer;color:var(--bad);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-top:3px solid var(--accent)}
.kpi .t{font-size:11.5px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:19px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.gold{border-top-color:var(--gold)}.kpi.red{border-top-color:var(--bad)}.kpi.green{border-top-color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--accent2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .hint{font-weight:400;color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>.card{margin-bottom:0}
.grid2{margin-bottom:12px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}.fld input[type=text]{width:150px}}
.tw{overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--line);border-radius:8px;background:#fff}
.tw.short{max-height:420px}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
table.t th{position:sticky;top:0;background:#eef2f7;font-size:12px;z-index:3;border-bottom:1px solid var(--line2);user-select:none}
table.t th.s{cursor:pointer}
table.t th.s:hover{color:var(--accent)}

table.t tr.tot td{position:sticky;top:30px;background:var(--goldSoft);font-weight:700;z-index:2;border-bottom:2px solid var(--gold)}
table.t th .ar{color:var(--gold);font-size:10px;margin-inline-start:3px}
table.t tr.r:hover td{background:#f3f7fd}

td.nm{max-width:300px;overflow:hidden;text-overflow:ellipsis;text-align:right!important}
td.lg{max-width:360px;overflow:hidden;text-overflow:ellipsis;text-align:right!important}
.lnk{color:var(--accent2);font-weight:600;cursor:pointer}
.lnk:hover{text-decoration:underline}
.badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:10px;background:var(--accentSoft);color:var(--accent2);font-weight:700;margin-inline-start:6px}
.code{color:var(--muted);font-size:11px;margin-inline-end:6px}

.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:700;margin:0 2px}
.pill.r{background:var(--badSoft);color:var(--bad)}.pill.w{background:var(--warnSoft);color:var(--warn)}.pill.g{background:var(--goodSoft);color:var(--good)}.pill.b{background:var(--accentSoft);color:var(--accent2)}.pill.n{background:#f1f3f6;color:#64748b}
.fx{display:inline-block;padding:1px 6px;border-radius:6px;font-size:11px;background:var(--badSoft);color:var(--bad);margin:1px 2px;white-space:nowrap}
.fx.i{background:#f1f3f6;color:#64748b}
.drop{border:2px dashed var(--line2);border-radius:14px;background:var(--surface);padding:36px 20px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.ov{border-color:var(--accent);background:var(--accentSoft)}
.drop .big{font-size:16px;font-weight:700;margin:10px 0 4px}
.drop .ic{width:52px;height:52px;border-radius:50%;background:var(--accentSoft);display:inline-flex;align-items:center;justify-content:center}
.prog{display:none;height:6px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
textarea.paste{width:100%;min-height:90px;border:1px solid var(--line2);border-radius:8px;padding:8px;font-family:Consolas,monospace;font-size:12px;direction:ltr}
.cols{display:flex;flex-wrap:wrap;gap:6px}
.cols span{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px}
.cols span b{color:var(--accent)}
.cols span.miss{border-color:var(--bad);color:var(--bad);background:var(--badSoft)}
.more{margin-top:8px}
.foot{color:var(--muted);font-size:11px;margin-top:6px}
.guide h4{margin:12px 0 4px;font-size:13px;color:var(--accent2)}
.guide ul{margin:0;padding-right:20px}
.guide table{border-collapse:collapse;width:100%;font-size:12.5px}
.guide td,.guide th{border:1px solid var(--line);padding:5px 8px;text-align:right;vertical-align:top}
.guide th{background:var(--surface2)}
pre.sql{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:12px;font-size:11.5px;direction:ltr;text-align:left;overflow:auto;max-height:520px;white-space:pre-wrap;word-break:break-all;margin:0}
.hb{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}
.hb .l{width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.hb .b{flex:1;height:14px;background:var(--surface2);border-radius:3px;overflow:hidden}
.hb .b i{display:block;height:100%;background:#2a78d6;border-radius:3px}
.hb .b i.neg{background:var(--bad)}
.hb .v{width:110px;text-align:left;font-variant-numeric:tabular-nums;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(10,20,40,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.ov.on{display:flex}
.md{background:#fff;border-radius:12px;width:min(1100px,100%);padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md h2{margin:0 0 10px;font-size:16px;color:var(--accent2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 14px}
.rec div{border-bottom:1px solid var(--line);padding:4px 0;display:flex;justify-content:space-between;gap:10px}
.rec div span:first-child{color:var(--ink2);font-size:12px}
.rec div span:last-child{font-weight:600;text-align:left;word-break:break-word}
.tip{position:fixed;display:none;background:#14213d;color:#fff;padding:6px 10px;border-radius:7px;font-size:12px;pointer-events:none;z-index:99;max-width:320px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
.msg{color:var(--ink2);margin-top:10px}
.msg.err{color:var(--bad);font-weight:700}
.colpick{display:flex;flex-wrap:wrap;gap:4px 10px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);margin-bottom:8px}
.colpick label{display:inline-flex;align-items:center;gap:4px;font-size:12px;cursor:pointer}
.empty{padding:30px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:11px;text-align:center;padding:10px}
.rpt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.rpt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px double var(--accent2);padding-bottom:10px;margin-bottom:10px;flex-wrap:wrap}
.rpt-co1{font-size:18px;font-weight:800;color:var(--accent2)}.rpt-co2{font-size:11px;color:var(--muted);letter-spacing:1px;direction:ltr;text-align:right}
.rpt-title{text-align:center}.rpt-t1{font-size:20px;font-weight:800;color:var(--ink)}.rpt-t2{font-size:13px;color:var(--ink2);margin-top:2px}
.rpt-meta{display:grid;grid-template-columns:auto auto;gap:3px 14px;font-size:12px}.rpt-meta span{color:var(--muted);margin-inline-end:6px}.rpt-meta b{font-weight:700}
.rpt-kpis{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}.rpt-kpis>div{flex:1;min-width:140px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}.rpt-kpis span{display:block;color:var(--ink2);font-size:11px}.rpt-kpis b{font-size:15px}.rpt-kpis b.bad{color:var(--bad)}.rpt-kpis b.warn{color:var(--warn)}.rpt-kpis b.good{color:var(--good)}
.rpt .tw{max-height:none;border-radius:6px}.rpt table.t th{background:var(--accent2);color:#fff}.rpt table.t tr.tot td{top:auto}
.rpt-notes{margin-top:10px;font-size:12px;color:var(--ink2)}.rpt-small{font-size:10.5px;color:var(--muted)}
.rpt-sign{display:flex;justify-content:space-between;gap:24px;margin-top:26px;font-size:12px}.rpt-sign>div{flex:1;text-align:center}.rpt-sign span{display:block;color:var(--ink2);margin-bottom:26px}.rpt-sign i{display:block;border-top:1px solid #333;margin:0 10px}.rpt-sign small{display:block;color:var(--muted);margin-top:3px;font-size:10px}
@media print{.rpt-kpis,.noprint{display:none!important}.rpt{border:0;padding:0 2mm;max-width:100%;overflow:hidden}.rpt table.t th{background:#0d366b!important;color:#fff!important}.rpt .tw{overflow:visible;border:0}
.rpt table.t{font-size:8.5px;width:100%!important;table-layout:fixed}.rpt table.t th,.rpt table.t td{padding:5px 3px;line-height:1.35;white-space:normal;overflow-wrap:break-word;vertical-align:middle;max-width:none}.rpt table.t td.nm{font-size:7.5px;line-height:1.25}.rpt table.t td:not(.tx){white-space:nowrap;overflow:hidden;text-overflow:clip}.rpt table.t td.nm{text-align:right!important}
.rpt table.t .code,.rpt table.t small{font-size:7.5px}.rpt table.t .pill{padding:0 3px;font-size:8px}.rpt-sign{margin-top:14px}}
#printHead,#printExplain{display:none}
@page{size:landscape;margin:6mm 7mm}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff;font-size:10px}
  body{padding:6mm 8mm!important;box-sizing:border-box;width:100%!important;min-width:0!important;max-width:none!important;overflow:visible!important} /* هامش أمان داخل الصفحة لا يتأثر باختيار «الهوامش: بدون» في نافذة الطباعة */
  header.top{background:#fff!important;color:#000;padding:0 0 4px;border-bottom:2px solid #0d366b}
  header.top h1{color:#0d366b;font-size:15px}
  header.top .sub,.tabs,.hbtn,.bar,.subtabs,.btn,.chips,.colpick,.more,footer,.tip,.toast{display:none!important}
  #printHead{display:block!important;font-size:10px;color:#333;border-bottom:1px solid #ccc;padding:4px 0;margin-bottom:6px}
  #printHead b{color:#000}
  header.top h1{display:none}header.top{border-bottom:0;padding:0}
  .thead,.card h3 .hint,.foot,.card .foot,.card h3 select{display:none!important}
  #printExplain{display:block!important;page-break-before:always;font-size:10px;line-height:1.6}
  #printExplain h2{font-size:14px;color:#0d366b;margin:0 0 6px;border-bottom:2px solid #0d366b;padding-bottom:3px}
  #printExplain h3{font-size:11.5px;color:#0d366b;margin:8px 0 3px}
  #printExplain table{border-collapse:collapse;width:100%;font-size:9.5px}#printExplain td,#printExplain th{border:1px solid #ccc;padding:2px 5px;text-align:right;vertical-align:top}#printExplain th{background:#e9eef5}
  #printExplain ul,#printExplain ol{margin:2px 0;padding-right:18px}
  #printHead .ph1{font-size:13px;color:#0d366b}#printHead .ph2{font-size:10.5px;margin-top:2px}#printHead .ph3{font-size:9px;color:#666;margin-top:2px}
  main{padding:0}
  .tw{max-height:none!important;overflow:visible!important;border:0;border-radius:0}
  table.t{font-size:8.5px;width:100%}
  table.t th,table.t td{padding:2px 4px;white-space:normal;border:1px solid #d0d0d0;max-width:none}
  table.t th{position:static;background:#e9eef5!important}
  table.t tr.tot td{position:static;background:#fff4d6!important}
  thead{display:table-header-group}tr{page-break-inside:avoid}
  td.nm,td.lg{max-width:none;white-space:normal}
  .card{break-inside:auto;border:1px solid #ccc;box-shadow:none;padding:6px;margin-bottom:6px;page-break-inside:auto}
  .card h3{font-size:11px;margin-bottom:4px}
  .kpis{grid-template-columns:repeat(6,1fr);gap:4px}.kpi{padding:4px 6px}.kpi .v{font-size:12px}.kpi .t,.kpi .s{font-size:8.5px}
  .grid2{grid-template-columns:1fr 1fr;gap:6px}
  .hb{font-size:9px}.hb .l{width:160px}
  .guide pre.sql{white-space:pre-wrap;font-size:7.5px;max-height:none;background:#f3f3f3;color:#000;word-break:break-all}
  .drop,textarea.paste{display:none}
  .ov{display:none}
  body.print-modal header.top,body.print-modal main,body.print-modal #printHead{display:none!important}
  body.print-rpt #printHead,body.print-rpt header.top,body:has(#view .rpt) #printHead,body:has(#view .rpt) header.top,body:has(#view .rpt) #printExplain{display:none!important}
  body.print-modal .ov{display:block!important;position:static;background:none;padding:0;overflow:visible}
  body.print-modal .md{box-shadow:none;width:100%;padding:0;border-radius:0}
  .md h2{font-size:13px}.rec div{padding:2px 0;font-size:9.5px}
}

.gate{max-width:420px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}

<body>
<header class="top">
  <div class="row">
    <div><h1>شاشة تحليل الحزمة اليومية للتدقيق</h1><div class="sub" id="hsub">16 كويري معتمد + ربحية الأصناف + عمر الذمة + عروض المؤسسة العسكرية · مركز الكيلاني للأغذية · كل تبويب مستقل ببياناته وفلاتره وتقاريره</div></div>
    <span class="sp"></span>
    <span class="ubox" id="ubox" style="display:none"><b id="uEmail"></b><span id="syncSt" style="font-size:11px;opacity:.9"></span><button class="hbtn" onclick="doLogout()">خروج</button></span>
    <button class="hbtn" id="printBtn" onclick="doPrint()" style="display:none">طباعة A4</button>
  </div>
  <div class="tabs" id="qtabs"></div>
</header>

<script type="text/plain" id="sql_q1">
/* SELECT T0."DocDate" FROM OINV T0 WHERE T0."DocDate" BETWEEN [%0] AND [%1] */
SELECT X."DocNum" AS "رقم الفاتورة", X."DocDate" AS "التاريخ", X."CreateDate" AS "تاريخ الادخال", DAYS_BETWEEN(X."DocDate",X."CreateDate") AS "ايام التأخير", X."CardCode" AS "رمز العميل", X."CardName" AS "اسم العميل", X."SlpName" AS "المندوب", X."ItemCode" AS "كود الصنف", X."Dscription" AS "اسم الصنف", X."Quantity" AS "الكمية", X."PriceBefDi" AS "السعر قبل الخصم", X."LineDisc" AS "خصم السطر", X."HdrDisc" AS "خصم الفاتورة",
ROUND(X."Net", 3) AS "صافي البيع",
X."Deliv" AS "حالة التسليم",
X."Batch" AS "الباتش",
ROUND(X."Cost", 3) AS "الكلفة",
X."CostSrc" AS "مصدر الكلفة",
ROUND(X."Net" - X."Cost", 3) AS "الربح",
ROUND((X."Net" - X."Cost") * 100 / NULLIF(X."Net", 0), 2) AS "نسبة الهامش",
RTRIM(
CASE WHEN X."Net" = 0 AND X."Cost" > 0 THEN 'بونص او مجاني / ' ELSE '' END ||
CASE WHEN X."IsEmp" = 1 AND X."Net" - X."Cost" < 0 THEN 'بيع موظف تحت الكلفة / ' ELSE '' END ||
CASE WHEN X."IsEmp" = 0 AND X."Net" > 0 AND (X."Net" - X."Cost" <= -1 OR (X."Net" - X."Cost") * 100 / X."Net" < -5) THEN 'هامش سالب / ' ELSE '' END ||
CASE WHEN X."LineDisc" > 0 THEN 'خصم سطر / ' ELSE '' END ||
CASE WHEN X."HdrDisc" > 0 THEN 'خصم فاتورة / ' ELSE '' END ||
CASE WHEN X."Deliv" <> 'مدلفرة' THEN X."Deliv" || ' / ' ELSE '' END
, ' /') AS "السبب",
X."U_NAME" AS "المستخدم"
FROM (
SELECT Y.*, COALESCE(Y."CurCost", Y."ActCost", Y."EstCost") AS "Cost",
CASE WHEN Y."CurCost" IS NOT NULL THEN 'كلفة الباتش الحالية' WHEN Y."ActCost" IS NOT NULL THEN 'كلفة مرحلة - رصيد الباتش صفر' WHEN Y."EstCost" IS NOT NULL THEN 'تقديرية - غير مدلفرة' END AS "CostSrc",
CASE WHEN Y."isIns" = 'Y' AND IFNULL(Y."DelQ", 0) = 0 THEN 'غير مدلفرة' WHEN Y."isIns" = 'Y' AND Y."DelQ" < Y."Quantity" THEN 'مدلفرة جزئيا' ELSE 'مدلفرة' END AS "Deliv",
CASE WHEN Y."CardCode" LIKE 'E%' OR Y."SlpName" LIKE '%موظف%' THEN 1 ELSE 0 END AS "IsEmp"
FROM (
SELECT T0."DocNum", T0."DocDate", T0."CreateDate", T0."CardCode", T0."CardName", T0."isIns", T2."SlpName", T3."U_NAME", T1."ItemCode", T1."Dscription", T1."Quantity", T1."PriceBefDi", T1."DiscPrcnt" AS "LineDisc", T0."DiscPrcnt" AS "HdrDisc", RQ."Q" AS "DelQ",
T1."LineTotal" * (1 - IFNULL(T0."DiscPrcnt", 0) / 100) AS "Net",
CASE WHEN T1."BaseType" = 15 THEN BD."Batch" WHEN T0."isIns" = 'Y' THEN RB."Batch" ELSE BI."Batch" END AS "Batch",
CASE WHEN T1."BaseType" = 15 THEN BD."BC" * T1."Quantity" / NULLIF(DB."Quantity", 0) WHEN T0."isIns" = 'Y' THEN RB."BC" * T1."Quantity" / NULLIF(RQ."Q", 0) ELSE BI."BC" END AS "CurCost",
CASE WHEN T1."BaseType" = 15 THEN CD."C" * T1."Quantity" / NULLIF(DB."Quantity", 0) WHEN T0."isIns" = 'Y' THEN RC."C" * T1."Quantity" / NULLIF(RQ."Q", 0) ELSE CI."C" END AS "ActCost",
EC."U" * IFNULL(NULLIF(T1."NumPerMsr", 0), 1) * T1."Quantity" AS "EstCost"
FROM OINV T0
INNER JOIN INV1 T1 ON T0."DocEntry" = T1."DocEntry"
LEFT JOIN OSLP T2 ON T0."SlpCode" = T2."SlpCode"
LEFT JOIN OUSR T3 ON T0."UserSign" = T3."USERID"
LEFT JOIN (SELECT O."DocEntry", O."DocLine", CASE WHEN SUM(CASE WHEN B."Quantity" = 0 THEN 1 ELSE 0 END) = 0 THEN SUM(ABS(L."Quantity") * B."CostTotal" / NULLIF(B."Quantity", 0)) END AS "BC", STRING_AGG(B."DistNumber", ' | ') AS "Batch" FROM OITL O INNER JOIN ITL1 L ON O."LogEntry" = L."LogEntry" INNER JOIN OBTN B ON L."ItemCode" = B."ItemCode" AND L."SysNumber" = B."SysNumber" WHERE O."DocType" = 13 AND O."StockEff" = 1 AND O."DocDate" >= ADD_DAYS(CURRENT_DATE, -400) GROUP BY O."DocEntry", O."DocLine") BI ON BI."DocEntry" = T1."DocEntry" AND BI."DocLine" = T1."LineNum"
LEFT JOIN (SELECT O."DocEntry", O."DocLine", CASE WHEN SUM(CASE WHEN B."Quantity" = 0 THEN 1 ELSE 0 END) = 0 THEN SUM(ABS(L."Quantity") * B."CostTotal" / NULLIF(B."Quantity", 0)) END AS "BC", STRING_AGG(B."DistNumber", ' | ') AS "Batch" FROM OITL O INNER JOIN ITL1 L ON O."LogEntry" = L."LogEntry" INNER JOIN OBTN B ON L."ItemCode" = B."ItemCode" AND L."SysNumber" = B."SysNumber" WHERE O."DocType" = 15 AND O."StockEff" = 1 AND O."DocDate" >= ADD_DAYS(CURRENT_DATE, -400) GROUP BY O."DocEntry", O."DocLine") BD ON T1."BaseType" = 15 AND BD."DocEntry" = T1."BaseEntry" AND BD."DocLine" = T1."BaseLine"
LEFT JOIN (SELECT D."BaseEntry", D."BaseLine", CASE WHEN SUM(CASE WHEN B."Quantity" = 0 THEN 1 ELSE 0 END) = 0 THEN SUM(ABS(L."Quantity") * B."CostTotal" / NULLIF(B."Quantity", 0)) END AS "BC", STRING_AGG(B."DistNumber", ' | ') AS "Batch" FROM DLN1 D INNER JOIN OITL O ON O."DocType" = 15 AND O."DocEntry" = D."DocEntry" AND O."DocLine" = D."LineNum" AND O."StockEff" = 1 INNER JOIN ITL1 L ON O."LogEntry" = L."LogEntry" INNER JOIN OBTN B ON L."ItemCode" = B."ItemCode" AND L."SysNumber" = B."SysNumber" WHERE D."BaseType" = 13 GROUP BY D."BaseEntry", D."BaseLine") RB ON RB."BaseEntry" = T1."DocEntry" AND RB."BaseLine" = T1."LineNum"
LEFT JOIN DLN1 DB ON T1."BaseType" = 15 AND DB."DocEntry" = T1."BaseEntry" AND DB."LineNum" = T1."BaseLine"
LEFT JOIN (SELECT D."BaseEntry", D."BaseLine", SUM(D."Quantity") AS "Q" FROM DLN1 D WHERE D."BaseType" = 13 GROUP BY D."BaseEntry", D."BaseLine") RQ ON RQ."BaseEntry" = T1."DocEntry" AND RQ."BaseLine" = T1."LineNum"
LEFT JOIN (SELECT V."CreatedBy", V."DocLineNum", ABS(SUM(V."TransValue")) AS "C" FROM OINM V WHERE V."TransType" = 13 AND V."DocDate" >= ADD_DAYS(CURRENT_DATE, -400) GROUP BY V."CreatedBy", V."DocLineNum") CI ON CI."CreatedBy" = T1."DocEntry" AND CI."DocLineNum" = T1."LineNum"
LEFT JOIN (SELECT V."CreatedBy", V."DocLineNum", ABS(SUM(V."TransValue")) AS "C" FROM OINM V WHERE V."TransType" = 15 AND V."DocDate" >= ADD_DAYS(CURRENT_DATE, -400) GROUP BY V."CreatedBy", V."DocLineNum") CD ON T1."BaseType" = 15 AND CD."CreatedBy" = T1."BaseEntry" AND CD."DocLineNum" = T1."BaseLine"
LEFT JOIN (SELECT D."BaseEntry", D."BaseLine", ABS(SUM(V."TransValue")) AS "C" FROM DLN1 D INNER JOIN OINM V ON V."TransType" = 15 AND V."CreatedBy" = D."DocEntry" AND V."DocLineNum" = D."LineNum" WHERE D."BaseType" = 13 GROUP BY D."BaseEntry", D."BaseLine") RC ON RC."BaseEntry" = T1."DocEntry" AND RC."BaseLine" = T1."LineNum"
LEFT JOIN (SELECT Q."ItemCode", Q."WhsCode", SUM(Q."Quantity" * (BN."CostTotal" / NULLIF(BN."Quantity", 0))) / NULLIF(SUM(Q."Quantity"), 0) AS "U" FROM OBTQ Q INNER JOIN OBTN BN ON Q."ItemCode" = BN."ItemCode" AND Q."SysNumber" = BN."SysNumber" WHERE Q."Quantity" > 0 GROUP BY Q."ItemCode", Q."WhsCode") EC ON EC."ItemCode" = T1."ItemCode" AND EC."WhsCode" = T1."WhsCode"
WHERE T0."CreateDate" BETWEEN [%0] AND [%1]
AND T0."CANCELED" = 'N'
) Y
) X
WHERE X."Net" - X."Cost" <= -1
OR (X."Net" - X."Cost") * 100 / NULLIF(X."Net", 0) < -5
OR (X."Net" = 0 AND X."Cost" > 0)
OR (X."IsEmp" = 1 AND X."Net" - X."Cost" < 0)
OR X."LineDisc" > 0
OR X."HdrDisc" > 0
OR X."Deliv" <> 'مدلفرة'
ORDER BY IFNULL(X."Net" - X."Cost", 0)
</script>
<script type="text/plain" id="sql_q2">
/* SELECT T0."DocDate" FROM ORIN T0 WHERE T0."DocDate" BETWEEN [%0] AND [%1] */
SELECT Z."DocNum" AS "رقم الإشعار",
R0."DocEntry" AS "فتح الإشعار",
Z."DocDate" AS "التاريخ", Z."CreateDate" AS "تاريخ الادخال", DAYS_BETWEEN(Z."DocDate",Z."CreateDate") AS "ايام التأخير", Z."CardCode" AS "رمز العميل", Z."CardName" AS "اسم العميل", Z."SlpName" AS "المندوب",
Z."ItemCode" AS "كود الصنف", Z."Dscription" AS "اسم الصنف", Z."Quantity" AS "الكمية المرتجعة",
ROUND(Z."RP", 3) AS "سعر المرتجع",
ROUND(Z."IP", 3) AS "سعر الفاتورة",
ROUND(Z."RP" - Z."IP", 3) AS "الفرق للوحدة",
ROUND((Z."RP" - Z."IP") * Z."Quantity", 3) AS "قيمة الفرق",
CASE WHEN Z."InvE" IS NULL THEN '✖ لا توجد فاتورة للمقارنة' WHEN Z."IAItem" IS NULL THEN '✖ الصنف غير موجود في الفاتورة' WHEN ABS(Z."RP" - Z."IP") <= 0.005 THEN 'مساوي' WHEN Z."RP" > Z."IP" THEN '✖ سعر المرتجع أعلى' ELSE 'سعر المرتجع أقل' END AS "مقارنة السعر",
Z."InvNo" AS "رقم الفاتورة",
I0."DocEntry" AS "فتح الفاتورة",
Z."LinkSrc" AS "مصدر الربط",
Z."InvDate" AS "تاريخ الفاتورة",
DAYS_BETWEEN(Z."InvDate", Z."DocDate") AS "أيام منذ الفاتورة",
ROUND(Z."InvQ" / Z."F", 3) AS "الكمية المفوترة",
ROUND(Z."RetQ" / Z."F", 3) AS "إجمالي المرتجع على الفاتورة",
CASE WHEN Z."IAItem" IS NULL THEN '' WHEN Z."RetQ" > Z."InvQ" + 0.0001 THEN '✖ المرتجع أكبر من المفوتر' WHEN ABS(Z."RetQ" - Z."InvQ") <= 0.0001 THEN 'مرتجع كامل' ELSE 'مرتجع جزئي' END AS "مقارنة الكمية",
Z."ReqRef" AS "طلب المرتجع",
Z."Comments" AS "الملاحظات",
Z."U_NAME" AS "المستخدم"
FROM (
SELECT Y.*, IV."DocNum" AS "InvNo", IV."DocDate" AS "InvDate", IA."ItemCode" AS "IAItem", IA."InvQ", RT."RetQ",
Y."RetNet" / NULLIF(Y."Quantity", 0) AS "RP",
IA."InvNet" / NULLIF(IA."InvQ", 0) * Y."F" AS "IP"
FROM (
SELECT T0."DocEntry", T0."DocNum", T0."DocDate", T0."CreateDate", T0."CardCode", T0."CardName", T2."SlpName", T3."U_NAME", T0."Comments",
T1."ItemCode", T1."Dscription", T1."Quantity", IFNULL(NULLIF(T1."NumPerMsr", 0), 1) AS "F",
T1."LineTotal" * (1 - IFNULL(T0."DiscPrcnt", 0) / 100) AS "RetNet",
CASE WHEN T1."BaseType" = 234000031 THEN T1."BaseRef" END AS "ReqRef",
COALESCE(CASE WHEN T1."BaseType" = 13 THEN T1."BaseEntry" WHEN T1."BaseType" = 16 THEN RD."BaseEntry" WHEN T1."BaseType" = 234000031 THEN RR."BaseEntry" END, MS."E") AS "InvE",
CASE WHEN T1."BaseType" = 13 THEN 'مرتبط بالفاتورة' WHEN RD."BaseEntry" IS NOT NULL THEN 'عبر مستند مرتجع' WHEN RR."BaseEntry" IS NOT NULL THEN 'عبر طلب مرتجع' WHEN MS."E" IS NOT NULL THEN 'يدوي من الملاحظات ✔' WHEN IFNULL(TRIM(T0."U_ST_Remarks"), '') <> '' THEN 'يدوي - رقم غير صحيح ✖' ELSE 'بدون مستند أصل ✖' END AS "LinkSrc"
FROM ORIN T0
INNER JOIN RIN1 T1 ON T0."DocEntry" = T1."DocEntry"
LEFT JOIN OSLP T2 ON T0."SlpCode" = T2."SlpCode"
LEFT JOIN OUSR T3 ON T0."UserSign" = T3."USERID"
LEFT JOIN RDN1 RD ON T1."BaseType" = 16 AND RD."DocEntry" = T1."BaseEntry" AND RD."LineNum" = T1."BaseLine" AND RD."BaseType" = 13
LEFT JOIN RRR1 RR ON T1."BaseType" = 234000031 AND RR."DocEntry" = T1."BaseEntry" AND RR."LineNum" = T1."BaseLine" AND RR."BaseType" = 13
LEFT JOIN (SELECT CAST(V."DocNum" AS NVARCHAR(20)) AS "DN", V."CardCode", MAX(V."DocEntry") AS "E" FROM OINV V WHERE V."CANCELED" = 'N' AND V."DocDate" >= ADD_DAYS(CURRENT_DATE, -400) GROUP BY V."DocNum", V."CardCode") MS ON MS."DN" = TRIM(T0."U_ST_Remarks") AND MS."CardCode" = T0."CardCode"
WHERE T0."CreateDate" BETWEEN [%0] AND [%1]
AND T0."CANCELED" = 'N'
) Y
LEFT JOIN OINV IV ON IV."DocEntry" = Y."InvE"
LEFT JOIN (SELECT IL."DocEntry", IL."ItemCode", SUM(IL."Quantity" * IFNULL(NULLIF(IL."NumPerMsr", 0), 1)) AS "InvQ", SUM(IL."LineTotal" * (1 - IFNULL(IH."DiscPrcnt", 0) / 100)) AS "InvNet" FROM INV1 IL INNER JOIN OINV IH ON IH."DocEntry" = IL."DocEntry" WHERE IH."DocDate" >= ADD_DAYS(CURRENT_DATE, -400) GROUP BY IL."DocEntry", IL."ItemCode") IA ON IA."DocEntry" = Y."InvE" AND IA."ItemCode" = Y."ItemCode"
LEFT JOIN (SELECT W."InvE", W."ItemCode", SUM(W."Q") AS "RetQ" FROM (SELECT COALESCE(CASE WHEN L."BaseType" = 13 THEN L."BaseEntry" WHEN L."BaseType" = 16 THEN RD2."BaseEntry" WHEN L."BaseType" = 234000031 THEN RR2."BaseEntry" END, M2."E") AS "InvE", L."ItemCode", L."Quantity" * IFNULL(NULLIF(L."NumPerMsr", 0), 1) AS "Q" FROM ORIN H INNER JOIN RIN1 L ON H."DocEntry" = L."DocEntry" LEFT JOIN RDN1 RD2 ON L."BaseType" = 16 AND RD2."DocEntry" = L."BaseEntry" AND RD2."LineNum" = L."BaseLine" AND RD2."BaseType" = 13 LEFT JOIN RRR1 RR2 ON L."BaseType" = 234000031 AND RR2."DocEntry" = L."BaseEntry" AND RR2."LineNum" = L."BaseLine" AND RR2."BaseType" = 13 LEFT JOIN (SELECT CAST(V."DocNum" AS NVARCHAR(20)) AS "DN", V."CardCode", MAX(V."DocEntry") AS "E" FROM OINV V WHERE V."CANCELED" = 'N' AND V."DocDate" >= ADD_DAYS(CURRENT_DATE, -400) GROUP BY V."DocNum", V."CardCode") M2 ON M2."DN" = TRIM(H."U_ST_Remarks") AND M2."CardCode" = H."CardCode" WHERE H."CANCELED" = 'N' AND H."DocDate" >= ADD_DAYS(CURRENT_DATE, -400)) W GROUP BY W."InvE", W."ItemCode") RT ON RT."InvE" = Y."InvE" AND RT."ItemCode" = Y."ItemCode"
) Z
LEFT JOIN ORIN R0 ON R0."DocEntry" = Z."DocEntry"
LEFT JOIN OINV I0 ON I0."DocEntry" = Z."InvE"
ORDER BY IFNULL((Z."RP" - Z."IP") * Z."Quantity", 999999) DESC
</script>
<script type="text/plain" id="sql_q3">
/* SELECT T0."DocDate" FROM OINV T0 WHERE T0."DocDate" BETWEEN [%0] AND [%1] */
SELECT T0."DocNum" AS "رقم مستند الإلغاء",
T0."DocEntry" AS "فتح مستند الإلغاء",
T0."DocDate" AS "تاريخ الإلغاء",
T0."CreateDate" AS "تاريخ ادخال الالغاء",
DAYS_BETWEEN(T0."DocDate",T0."CreateDate") AS "ايام التأخير",
O."DocNum" AS "الفاتورة الملغاة",
O."DocEntry" AS "فتح الفاتورة الملغاة",
O."DocDate" AS "تاريخ الفاتورة",
DAYS_BETWEEN(O."DocDate", T0."DocDate") AS "أيام حتى الإلغاء",
T0."CardCode" AS "رمز العميل", T0."CardName" AS "اسم العميل", T2."SlpName" AS "المندوب",
O."DocTotal" AS "قيمة الفاتورة",
CASE WHEN O."isIns" = 'Y' THEN 'فاتورة حجز' ELSE 'فاتورة عادية' END AS "نوع الفاتورة",
CASE WHEN O."isIns" <> 'Y' THEN '' WHEN (SELECT COUNT(*) FROM DLN1 D INNER JOIN ODLN DH ON DH."DocEntry" = D."DocEntry" WHERE D."BaseType" = 13 AND D."BaseEntry" = O."DocEntry" AND DH."CANCELED" = 'N') > 0 THEN '✖ سلمت البضاعة' ELSE 'لم تسلم' END AS "حالة التسليم",
IFNULL((SELECT SUM(R2."SumApplied") FROM RCT2 R2 INNER JOIN ORCT R ON R."DocEntry" = R2."DocNum" WHERE R2."InvType" = '13' AND R2."DocEntry" = O."DocEntry" AND R."Canceled" = 'N'), 0) AS "تحصيلات على الفاتورة",
CASE WHEN (SELECT COUNT(*) FROM OINV N WHERE N."CardCode" = O."CardCode" AND N."CANCELED" = 'N' AND N."DocEntry" <> O."DocEntry" AND N."DocDate" BETWEEN O."DocDate" AND ADD_DAYS(T0."DocDate", 3) AND ABS(N."DocTotal" - O."DocTotal") < 0.01) > 0 THEN 'يوجد بديل بنفس المبلغ' WHEN (SELECT COUNT(*) FROM OINV N WHERE N."CardCode" = O."CardCode" AND N."CANCELED" = 'N' AND N."DocEntry" <> O."DocEntry" AND N."DocDate" BETWEEN O."DocDate" AND ADD_DAYS(T0."DocDate", 3)) > 0 THEN 'فاتورة لاحقة بمبلغ مختلف' ELSE '✖ لا يوجد بديل' END AS "الفاتورة البديلة",
(SELECT MIN(N."DocNum") FROM OINV N WHERE N."CardCode" = O."CardCode" AND N."CANCELED" = 'N' AND N."DocEntry" <> O."DocEntry" AND N."DocDate" BETWEEN O."DocDate" AND ADD_DAYS(T0."DocDate", 3) AND ABS(N."DocTotal" - O."DocTotal") < 0.01) AS "رقم البديل",
U1."U_NAME" AS "أنشأ الفاتورة",
U2."U_NAME" AS "ألغى الفاتورة",
T0."Comments" AS "ملاحظات الإلغاء"
FROM OINV T0
LEFT JOIN (SELECT L."DocEntry", MAX(L."BaseEntry") AS "OE" FROM INV1 L WHERE L."BaseType" = 13 GROUP BY L."DocEntry") B ON B."DocEntry" = T0."DocEntry"
LEFT JOIN OINV O ON O."DocEntry" = B."OE"
LEFT JOIN OSLP T2 ON T0."SlpCode" = T2."SlpCode"
LEFT JOIN OUSR U1 ON O."UserSign" = U1."USERID"
LEFT JOIN OUSR U2 ON T0."UserSign" = U2."USERID"
WHERE T0."CreateDate" BETWEEN [%0] AND [%1]
AND T0."CANCELED" = 'C'
ORDER BY O."DocTotal" DESC
</script>
<script type="text/plain" id="sql_q4">
/* SELECT T0."DocDate" FROM OINV T0 WHERE T0."DocDate" BETWEEN [%0] AND [%1] */
SELECT X."DocNum" AS "رقم الفاتورة",
I0."DocEntry" AS "فتح الفاتورة",
X."DocDate" AS "التاريخ",
X."CreateDate" AS "تاريخ الادخال",
DAYS_BETWEEN(X."DocDate",X."CreateDate") AS "ايام التأخير",
X."CardCode" AS "رمز العميل", X."CardName" AS "اسم العميل", X."SlpName" AS "المندوب",
X."DocTotal" AS "قيمة الفاتورة",
ROUND(X."DayBal", 3) AS "الرصيد بنهاية يوم الفاتورة",
X."CreditLine" AS "حد الائتمان",
ROUND(X."DayBal" - X."CreditLine", 3) AS "التجاوز",
ROUND((X."DayBal" - X."CreditLine") * 100 / X."CreditLine", 1) AS "نسبة التجاوز",
ROUND(X."CurBal", 3) AS "الرصيد الحالي",
CASE WHEN X."CurBal" > X."CreditLine" THEN '✖ ما زال متجاوزا' ELSE 'ضمن الحد الآن' END AS "الوضع الحالي",
X."PymntGroup" AS "شروط الدفع",
X."U_NAME" AS "المستخدم"
FROM (
SELECT T0."DocEntry", T0."DocNum", T0."DocDate", T0."CreateDate", T0."CardCode", T0."CardName", T2."SlpName", T3."U_NAME", T0."DocTotal", C."CreditLine", C."Balance" AS "CurBal", G."PymntGroup",
(SELECT SUM(J."Debit" - J."Credit") FROM JDT1 J WHERE J."ShortName" = T0."CardCode" AND J."RefDate" <= T0."DocDate") AS "DayBal"
FROM OINV T0
INNER JOIN OCRD C ON C."CardCode" = T0."CardCode"
LEFT JOIN OCTG G ON G."GroupNum" = C."GroupNum"
LEFT JOIN OSLP T2 ON T0."SlpCode" = T2."SlpCode"
LEFT JOIN OUSR T3 ON T0."UserSign" = T3."USERID"
WHERE T0."CreateDate" BETWEEN [%0] AND [%1]
AND T0."CANCELED" = 'N'
AND C."CreditLine" > 0
) X
LEFT JOIN OINV I0 ON I0."DocEntry" = X."DocEntry"
WHERE X."DayBal" > X."CreditLine"
ORDER BY X."DayBal" - X."CreditLine" DESC
</script>
<script type="text/plain" id="sql_q5">
/* SELECT T0."DocDate" FROM OINM T0 WHERE T0."DocDate" BETWEEN [%0] AND [%1] */
SELECT CASE T0."TransType" WHEN 59 THEN 'إدخال بضاعة' WHEN 60 THEN 'إخراج بضاعة' WHEN 67 THEN 'تحويل مخزني' WHEN 162 THEN 'إعادة تقييم' WHEN 10000071 THEN 'ترحيل جرد' END AS "نوع الحركة",
T0."BASE_REF" AS "رقم المستند",
D59."DocEntry" AS "فتح إدخال بضاعة",
D60."DocEntry" AS "فتح إخراج بضاعة",
D67."DocEntry" AS "فتح التحويل",
DIQ."DocEntry" AS "فتح ترحيل الجرد",
D162."DocEntry" AS "فتح إعادة التقييم",
T0."DocDate" AS "التاريخ",
COALESCE(D59."CreateDate", D60."CreateDate", D67."CreateDate", DIQ."CreateDate", D162."CreateDate") AS "تاريخ الإدخال",
DAYS_BETWEEN(T0."DocDate",COALESCE(D59."CreateDate", D60."CreateDate", D67."CreateDate", DIQ."CreateDate", D162."CreateDate")) AS "ايام التأخير",
T0."ItemCode" AS "كود الصنف",
T0."Dscription" AS "اسم الصنف",
T0."Warehouse" AS "المستودع",
W."WhsName" AS "اسم المستودع",
T0."InQty" AS "الكمية الداخلة",
T0."OutQty" AS "الكمية الخارجة",
ROUND(CASE WHEN ABS(T0."TransValue") > 0 THEN ABS(T0."TransValue") ELSE ABS(T0."InQty" - T0."OutQty") * T0."CalcPrice" END, 3) AS "القيمة",
BT."Batch" AS "الباتش",
BT."BN" AS "عدد الباتشات",
BT."Exp" AS "تاريخ انتهاء الباتش",
COUNT(*) OVER (PARTITION BY T0."ItemCode") AS "عدد حركات الصنف بالفترة",
RTRIM(
CASE WHEN T0."TransType" = 67 AND T0."InQty" > 0 THEN 'نقل إلى ' || W."WhsName" || ' / ' ELSE '' END ||
CASE WHEN T0."TransType" = 67 AND T0."OutQty" > 0 THEN '✖ إخراج من ' || W."WhsName" || ' / ' ELSE '' END ||
CASE WHEN T0."TransType" = 67 AND T0."OutQty" > 0 AND BT."Exp" < T0."DocDate" THEN '✖ باتش منتهي خرج من التوالف / ' ELSE '' END ||
CASE WHEN T0."TransType" = 67 AND T0."InQty" > 0 AND T0."Warehouse" IN ('006', '100') AND BT."Exp" > ADD_DAYS(T0."DocDate", 30) THEN '✖ إتلاف قبل الانتهاء / ' ELSE '' END ||
CASE WHEN T0."TransType" IN (59, 60) AND IFNULL(TRIM(T0."Comments"), '') = '' THEN '✖ بدون ملاحظة / ' ELSE '' END ||
CASE WHEN DAYS_BETWEEN(T0."DocDate", COALESCE(D59."CreateDate", D60."CreateDate", D67."CreateDate", DIQ."CreateDate", D162."CreateDate")) > 2 THEN '✖ مسجل بتاريخ سابق / ' ELSE '' END
, ' /') AS "التنبيه",
T0."Comments" AS "الملاحظات",
T0."JrnlMemo" AS "البيان",
U."U_NAME" AS "المستخدم"
FROM OINM T0
LEFT JOIN OWHS W ON W."WhsCode" = T0."Warehouse"
LEFT JOIN OUSR U ON U."USERID" = T0."UserSign"
LEFT JOIN OIGN D59 ON T0."TransType" = 59 AND D59."DocEntry" = T0."CreatedBy"
LEFT JOIN OIGE D60 ON T0."TransType" = 60 AND D60."DocEntry" = T0."CreatedBy"
LEFT JOIN OWTR D67 ON T0."TransType" = 67 AND D67."DocEntry" = T0."CreatedBy"
LEFT JOIN OIQR DIQ ON T0."TransType" = 10000071 AND DIQ."DocEntry" = T0."CreatedBy"
LEFT JOIN OMRV D162 ON T0."TransType" = 162 AND D162."DocEntry" = T0."CreatedBy"
LEFT JOIN (SELECT O."DocType", O."DocEntry", O."DocLine", O."LocCode", MAX(B."DistNumber") AS "Batch", COUNT(DISTINCT B."DistNumber") AS "BN", MAX(B."ExpDate") AS "Exp" FROM OITL O INNER JOIN ITL1 L ON O."LogEntry" = L."LogEntry" INNER JOIN OBTN B ON L."ItemCode" = B."ItemCode" AND L."SysNumber" = B."SysNumber" WHERE O."DocType" IN (59, 60, 67, 10000071) AND O."StockEff" = 1 AND O."DocDate" >= ADD_DAYS(CURRENT_DATE, -400) GROUP BY O."DocType", O."DocEntry", O."DocLine", O."LocCode") BT ON BT."DocType" = T0."TransType" AND BT."DocEntry" = T0."CreatedBy" AND BT."DocLine" = T0."DocLineNum" AND BT."LocCode" = T0."Warehouse"
WHERE T0."DocDate">=ADD_DAYS(CURRENT_DATE,-400) AND COALESCE(D59."CreateDate", D60."CreateDate", D67."CreateDate", DIQ."CreateDate", D162."CreateDate") BETWEEN [%0] AND [%1]
AND (T0."TransType" IN (59, 60, 162, 10000071) OR (T0."TransType" = 67 AND T0."Warehouse" IN ('005', '006', '008', '100')))
ORDER BY CASE WHEN ABS(T0."TransValue") > 0 THEN ABS(T0."TransValue") ELSE ABS(T0."InQty" - T0."OutQty") * T0."CalcPrice" END DESC
</script>
<script type="text/plain" id="sql_q6">
/* SELECT T0."CreateDate" FROM OJDT T0 WHERE T0."CreateDate" BETWEEN [%0] AND [%1] */
SELECT J0."TransId" AS "فتح القيد",
X."Number" AS "رقم القيد",
X."RefDate" AS "تاريخ القيد",
X."CreateDate" AS "تاريخ الإدخال",
DAYS_BETWEEN(X."RefDate", X."CreateDate") AS "أيام التأخير",
X."LocTotal" AS "المبلغ",
X."Score" AS "درجة الخطورة",
RTRIM(
CASE WHEN X."F3" = 1 THEN '✖ نقل رصيد بين عملاء / ' ELSE '' END ||
CASE WHEN X."F1" = 1 THEN '✖ شطب أو خصم على ذمة عميل / ' ELSE '' END ||
CASE WHEN X."F2" = 1 THEN '✖ إيراد يدوي على عميل / ' ELSE '' END ||
CASE WHEN X."F4" = 1 THEN '✖ تحصيل بقيد بدل سند قبض / ' ELSE '' END ||
CASE WHEN X."F5" = 1 THEN '✖ دفع لمورد بقيد بدل سند صرف / ' ELSE '' END ||
CASE WHEN X."F6" = 1 THEN '✖ تخفيض ذمة مورد بدون دفع / ' ELSE '' END ||
CASE WHEN X."F7" = 1 THEN '✖ يمس حساب المخزون يدويا / ' ELSE '' END ||
CASE WHEN X."F10" = 1 THEN '✖ عكس في الشهر التالي / ' ELSE '' END ||
CASE WHEN X."F8" = 1 THEN '✖ مرحل على شهر سابق / ' ELSE '' END ||
CASE WHEN X."F9" = 1 THEN '✖ مسجل بتاريخ سابق / ' ELSE '' END ||
CASE WHEN X."F12" = 1 THEN '✖ ادخل يوم جمعة / ' ELSE '' END ||
CASE WHEN X."F11" = 1 THEN '✖ بدون بيان / ' ELSE '' END ||
CASE WHEN X."IsClose" = 1 THEN 'قيد اقفال شهر / ' ELSE '' END ||
CASE WHEN X."CashCr" > 0 AND X."ExpDr" > 0 THEN 'صرف نقدي لمصروف بقيد يدوي / ' ELSE '' END ||
CASE WHEN X."LocTotal" >= 100 AND MOD(X."LocTotal", 100) = 0 THEN 'مبلغ مدور / ' ELSE '' END
, ' /') AS "طبيعة القيد والتنبيهات",
X."Memo" AS "البيان",
X."DrN" AS "عدد الحسابات المدينة",
X."DrAcc" AS "الحسابات المدينة",
X."CrN" AS "عدد الحسابات الدائنة",
X."CrAcc" AS "الحسابات الدائنة",
RJ."TransId" AS "فتح القيد العاكس",
X."RevDate" AS "تاريخ العكس",
X."U_NAME" AS "المستخدم"
FROM (
SELECT Y.*, Y."F1" + Y."F2" + Y."F3" + Y."F4" + Y."F5" + Y."F6" + Y."F7" + Y."F8" + Y."F9" + Y."F10" + Y."F11" + Y."F12" AS "Score"
FROM (
SELECT T0."TransId", T0."Number", T0."RefDate", T0."CreateDate", T0."LocTotal", T0."Memo", U."U_NAME",
S."DrN", S."DrAcc", S."CrN", S."CrAcc", A."CashCr", A."ExpDr", RV."RevId", RV."RevDate",
CASE WHEN T0."RefDate" = LAST_DAY(T0."RefDate") AND DAYS_BETWEEN(T0."RefDate", T0."CreateDate") BETWEEN 1 AND 10 THEN 1 ELSE 0 END AS "IsClose",
CASE WHEN A."CustCr" > 0 AND A."ExpDr" > 0 THEN 1 ELSE 0 END AS "F1",
CASE WHEN A."CustDr" > 0 AND A."RevCr" > 0 THEN 1 ELSE 0 END AS "F2",
CASE WHEN A."CustN" > 1 AND A."CustDr" > 0 AND A."CustCr" > 0 THEN 1 ELSE 0 END AS "F3",
CASE WHEN A."CustCr" > 0 AND A."CashDr" > 0 THEN 1 ELSE 0 END AS "F4",
CASE WHEN A."VendDr" > 0 AND A."CashCr" > 0 THEN 1 ELSE 0 END AS "F5",
CASE WHEN A."VendDr" > 0 AND A."CashCr" = 0 THEN 1 ELSE 0 END AS "F6",
CASE WHEN A."InvCnt" > 0 THEN 1 ELSE 0 END AS "F7",
CASE WHEN TO_VARCHAR(T0."RefDate", 'YYYYMM') < TO_VARCHAR(T0."CreateDate", 'YYYYMM') AND NOT (T0."RefDate" = LAST_DAY(T0."RefDate") AND DAYS_BETWEEN(T0."RefDate", T0."CreateDate") BETWEEN 1 AND 10) THEN 1 ELSE 0 END AS "F8",
CASE WHEN DAYS_BETWEEN(T0."RefDate", T0."CreateDate") > 2 AND NOT (T0."RefDate" = LAST_DAY(T0."RefDate") AND DAYS_BETWEEN(T0."RefDate", T0."CreateDate") BETWEEN 1 AND 10) THEN 1 ELSE 0 END AS "F9",
CASE WHEN RV."RevDate" IS NOT NULL AND TO_VARCHAR(RV."RevDate", 'YYYYMM') > TO_VARCHAR(T0."RefDate", 'YYYYMM') THEN 1 ELSE 0 END AS "F10",
CASE WHEN IFNULL(TRIM(T0."Memo"), '') = '' THEN 1 ELSE 0 END AS "F11",
CASE WHEN WEEKDAY(T0."CreateDate") = 4 THEN 1 ELSE 0 END AS "F12"
FROM OJDT T0
LEFT JOIN OUSR U ON U."USERID" = T0."UserSign"
LEFT JOIN (SELECT J."TransId",
SUM(CASE WHEN BP."CardType" = 'C' AND J."Debit" > 0 THEN 1 ELSE 0 END) AS "CustDr",
SUM(CASE WHEN BP."CardType" = 'C' AND J."Credit" > 0 THEN 1 ELSE 0 END) AS "CustCr",
COUNT(DISTINCT CASE WHEN BP."CardType" = 'C' THEN J."ShortName" END) AS "CustN",
SUM(CASE WHEN BP."CardType" = 'S' AND J."Debit" > 0 THEN 1 ELSE 0 END) AS "VendDr",
SUM(CASE WHEN (LEFT(J."Account", 4) IN ('1111', '1112', '2111') OR AC."Finanse" = 'Y') AND J."Debit" > 0 THEN 1 ELSE 0 END) AS "CashDr",
SUM(CASE WHEN (LEFT(J."Account", 4) IN ('1111', '1112', '2111') OR AC."Finanse" = 'Y') AND J."Credit" > 0 THEN 1 ELSE 0 END) AS "CashCr",
SUM(CASE WHEN AC."GroupMask" IN (5, 6, 7, 8) AND J."Debit" > 0 THEN 1 ELSE 0 END) AS "ExpDr",
SUM(CASE WHEN AC."GroupMask" = 4 AND J."Credit" > 0 THEN 1 ELSE 0 END) AS "RevCr",
SUM(CASE WHEN IV."Acc" IS NOT NULL THEN 1 ELSE 0 END) AS "InvCnt"
FROM JDT1 J
INNER JOIN OACT AC ON AC."AcctCode" = J."Account"
LEFT JOIN OCRD BP ON BP."CardCode" = J."ShortName" AND J."ShortName" <> J."Account"
LEFT JOIN (SELECT DISTINCT "BalInvntAc" AS "Acc" FROM OITB WHERE "BalInvntAc" IS NOT NULL UNION SELECT DISTINCT "BalInvntAc" FROM OWHS WHERE "BalInvntAc" IS NOT NULL) IV ON IV."Acc" = J."Account"
WHERE J."TransType" = '30' AND J."RefDate" >= ADD_DAYS(CURRENT_DATE, -400)
GROUP BY J."TransId") A ON A."TransId" = T0."TransId"
LEFT JOIN (SELECT P."TransId",
COUNT(CASE WHEN P."Side" = 'D' THEN 1 END) AS "DrN",
COUNT(CASE WHEN P."Side" = 'C' THEN 1 END) AS "CrN",
STRING_AGG(CASE WHEN P."Side" = 'D' THEN P."Nm" || ' (' || TO_VARCHAR(P."Amt") || ')' END, ' | ' ORDER BY P."Amt" DESC) AS "DrAcc",
STRING_AGG(CASE WHEN P."Side" = 'C' THEN P."Nm" || ' (' || TO_VARCHAR(P."Amt") || ')' END, ' | ' ORDER BY P."Amt" DESC) AS "CrAcc"
FROM (SELECT J."TransId", CASE WHEN J."Debit" > 0 THEN 'D' ELSE 'C' END AS "Side", CASE WHEN J."ShortName" <> J."Account" THEN IFNULL(BP."CardName", J."ShortName") ELSE AC."AcctName" END AS "Nm", TO_DECIMAL(SUM(J."Debit" + J."Credit"), 18, 3) AS "Amt" FROM JDT1 J INNER JOIN OACT AC ON AC."AcctCode" = J."Account" LEFT JOIN OCRD BP ON BP."CardCode" = J."ShortName" AND J."ShortName" <> J."Account" WHERE J."TransType" = '30' AND J."RefDate" >= ADD_DAYS(CURRENT_DATE, -400) GROUP BY J."TransId", CASE WHEN J."Debit" > 0 THEN 'D' ELSE 'C' END, CASE WHEN J."ShortName" <> J."Account" THEN IFNULL(BP."CardName", J."ShortName") ELSE AC."AcctName" END) P
GROUP BY P."TransId") S ON S."TransId" = T0."TransId"
LEFT JOIN (SELECT R."StornoToTr" AS "Orig", MIN(R."TransId") AS "RevId", MIN(R."RefDate") AS "RevDate" FROM OJDT R WHERE R."StornoToTr" IS NOT NULL GROUP BY R."StornoToTr") RV ON RV."Orig" = T0."TransId"
WHERE T0."CreateDate" BETWEEN [%0] AND [%1]
AND T0."TransType" = '30'
) Y
) X
LEFT JOIN OJDT J0 ON J0."TransId" = X."TransId"
LEFT JOIN OJDT RJ ON RJ."TransId" = X."RevId"
ORDER BY X."Score" DESC, X."LocTotal" DESC
</script>
<script type="text/plain" id="sql_q7">
/* SELECT T0."UpdateDate" FROM OCRD T0 WHERE T0."UpdateDate" BETWEEN [%0] AND [%1] */
SELECT B0."CardCode" AS "فتح البطاقة",
X."CardName" AS "الاسم",
CASE X."CardType" WHEN 'C' THEN 'عميل' WHEN 'S' THEN 'مورد' ELSE 'محتمل' END AS "النوع",
X."ChgDate" AS "تاريخ التعديل",
X."U_NAME" AS "عدل بواسطة",
X."Score" AS "درجة الخطورة",
RTRIM(
CASE WHEN X."IsNew" = 1 THEN 'بطاقة جديدة / ' ELSE '' END ||
CASE WHEN X."F2" = 1 THEN '✖ تغيير الحساب البنكي من [' || TRIM(X."OldBank") || '] الى [' || TRIM(X."NewBank") || '] / ' ELSE '' END ||
CASE WHEN X."F8" = 1 THEN '✖ تغيير اسم مورد من ' || IFNULL(X."OldName", '-') || ' / ' ELSE '' END ||
CASE WHEN X."F1" = 1 THEN '✖ رفع حد الائتمان من ' || TO_VARCHAR(TO_DECIMAL(IFNULL(X."OldCL", 0),18,2)) || ' الى ' || TO_VARCHAR(TO_DECIMAL(IFNULL(X."NewCL", 0),18,2)) || ' / ' ELSE '' END ||
CASE WHEN X."IsNew" = 0 AND IFNULL(X."NewCL", 0) < IFNULL(X."OldCL", 0) THEN 'تخفيض حد الائتمان من ' || TO_VARCHAR(TO_DECIMAL(IFNULL(X."OldCL", 0),18,2)) || ' الى ' || TO_VARCHAR(TO_DECIMAL(IFNULL(X."NewCL", 0),18,2)) || ' / ' ELSE '' END ||
CASE WHEN X."F4" = 1 THEN '✖ تمديد شروط الدفع من ' || IFNULL(X."OldPT", '-') || ' الى ' || IFNULL(X."NewPT", '-') || ' / ' WHEN X."IsNew" = 0 AND IFNULL(X."OldPT", '') <> IFNULL(X."NewPT", '') THEN 'تغيير شروط الدفع من ' || IFNULL(X."OldPT", '-') || ' الى ' || IFNULL(X."NewPT", '-') || ' / ' ELSE '' END ||
CASE WHEN X."F5" = 1 THEN '✖ رفع الخصم من ' || TO_VARCHAR(TO_DECIMAL(IFNULL(X."OldDisc", 0),18,2)) || ' الى ' || TO_VARCHAR(TO_DECIMAL(IFNULL(X."NewDisc", 0),18,2)) || ' / ' WHEN X."IsNew" = 0 AND IFNULL(X."NewDisc", 0) < IFNULL(X."OldDisc", 0) THEN 'تخفيض الخصم من ' || TO_VARCHAR(TO_DECIMAL(IFNULL(X."OldDisc", 0),18,2)) || ' الى ' || TO_VARCHAR(TO_DECIMAL(IFNULL(X."NewDisc", 0),18,2)) || ' / ' ELSE '' END ||
CASE WHEN X."F6" = 1 THEN '✖ تغيير قائمة الاسعار من ' || IFNULL(X."OldPL", '-') || ' الى ' || IFNULL(X."NewPL", '-') || ' / ' ELSE '' END ||
CASE WHEN X."F3" = 1 THEN '✖ فك تجميد او تفعيل / ' WHEN X."IsNew" = 0 AND ((IFNULL(X."OldFz", 'N') = 'N' AND X."NewFz" = 'Y') OR (IFNULL(X."OldAc", 'Y') = 'Y' AND X."NewAc" = 'N')) THEN 'تجميد او ايقاف / ' ELSE '' END ||
CASE WHEN X."F7" = 1 THEN '✖ تغيير حساب التحكم من ' || IFNULL(X."OldCtl", '-') || ' الى ' || IFNULL(X."NewCtl", '-') || ' / ' ELSE '' END ||
CASE WHEN X."IsNew" = 0 AND IFNULL(X."OldSlp", '') <> IFNULL(X."NewSlp", '') THEN 'تغيير المندوب من ' || IFNULL(X."OldSlp", '-') || ' الى ' || IFNULL(X."NewSlp", '-') || ' / ' ELSE '' END ||
CASE WHEN X."IsNew" = 0 AND X."CardType" <> 'S' AND IFNULL(X."OldName", '') <> IFNULL(X."CardName", '') THEN 'تغيير الاسم من ' || IFNULL(X."OldName", '-') || ' / ' ELSE '' END
, ' /') AS "التغييرات",
X."OldUpd" AS "التعديل السابق بتاريخ",
UP."U_NAME" AS "التعديل السابق بواسطة",
DAYS_BETWEEN(X."OldUpd", X."ChgDate") AS "أيام منذ التعديل السابق",
COUNT(*) OVER (PARTITION BY X."CardCode") AS "عدد تعديلات البطاقة بالفترة",
B0."CreateDate" AS "تاريخ انشاء البطاقة",
UC."U_NAME" AS "انشأها",
X."NewCL" AS "حد الائتمان الحالي",
X."NewPT" AS "شروط الدفع الحالية",
X."LogInstanc" AS "رقم النسخة"
FROM (
SELECT Y.*, Y."F1" + Y."F2" + Y."F3" + Y."F4" + Y."F5" + Y."F6" + Y."F7" + Y."F8" AS "Score"
FROM (
SELECT C."CardCode", C."CardName", C."CardType", C."LogInstanc", COALESCE(C."UpdateDate", C."CreateDate") AS "ChgDate", U."U_NAME",
CASE WHEN P."CardCode" IS NULL AND DAYS_BETWEEN(C."CreateDate",COALESCE(C."UpdateDate",C."CreateDate"))<=0 THEN 1 ELSE 0 END AS "IsNew",
P."UpdateDate" AS "OldUpd", P."UserSign2" AS "OldUser",
P."CardName" AS "OldName",
P."CreditLine" AS "OldCL", C."CreditLine" AS "NewCL",
G1."PymntGroup" AS "OldPT", G2."PymntGroup" AS "NewPT",
L1."ListName" AS "OldPL", L2."ListName" AS "NewPL",
P."Discount" AS "OldDisc", C."Discount" AS "NewDisc",
P."frozenFor" AS "OldFz", C."frozenFor" AS "NewFz", P."validFor" AS "OldAc", C."validFor" AS "NewAc",
IFNULL(P."BankCode", '') || ' ' || IFNULL(P."DflAccount", '') || ' ' || IFNULL(P."DflIBAN", '') AS "OldBank",
IFNULL(C."BankCode", '') || ' ' || IFNULL(C."DflAccount", '') || ' ' || IFNULL(C."DflIBAN", '') AS "NewBank",
S1."SlpName" AS "OldSlp", S2."SlpName" AS "NewSlp",
P."DebPayAcct" AS "OldCtl", C."DebPayAcct" AS "NewCtl",
CASE WHEN P."CardCode" IS NOT NULL AND IFNULL(C."CreditLine", 0) > IFNULL(P."CreditLine", 0) THEN 1 ELSE 0 END AS "F1",
CASE WHEN P."CardCode" IS NOT NULL AND IFNULL(P."BankCode", '') || IFNULL(P."DflAccount", '') || IFNULL(P."DflIBAN", '') <> IFNULL(C."BankCode", '') || IFNULL(C."DflAccount", '') || IFNULL(C."DflIBAN", '') THEN 1 ELSE 0 END AS "F2",
CASE WHEN P."CardCode" IS NOT NULL AND ((P."frozenFor" = 'Y' AND C."frozenFor" = 'N') OR (P."validFor" = 'N' AND C."validFor" = 'Y')) THEN 1 ELSE 0 END AS "F3",
CASE WHEN P."CardCode" IS NOT NULL AND IFNULL(G2."ExtraDays", 0) + IFNULL(G2."ExtraMonth", 0) * 30 > IFNULL(G1."ExtraDays", 0) + IFNULL(G1."ExtraMonth", 0) * 30 THEN 1 ELSE 0 END AS "F4",
CASE WHEN P."CardCode" IS NOT NULL AND IFNULL(C."Discount", 0) > IFNULL(P."Discount", 0) THEN 1 ELSE 0 END AS "F5",
CASE WHEN P."CardCode" IS NOT NULL AND IFNULL(P."ListNum", -1) <> IFNULL(C."ListNum", -1) THEN 1 ELSE 0 END AS "F6",
CASE WHEN P."CardCode" IS NOT NULL AND IFNULL(P."DebPayAcct", '') <> IFNULL(C."DebPayAcct", '') THEN 1 ELSE 0 END AS "F7",
CASE WHEN P."CardCode" IS NOT NULL AND C."CardType" = 'S' AND IFNULL(P."CardName", '') <> IFNULL(C."CardName", '') THEN 1 ELSE 0 END AS "F8",
CASE WHEN P."CardCode" IS NOT NULL AND (IFNULL(P."CreditLine", 0) <> IFNULL(C."CreditLine", 0) OR IFNULL(P."GroupNum", -1) <> IFNULL(C."GroupNum", -1) OR IFNULL(P."ListNum", -1) <> IFNULL(C."ListNum", -1) OR IFNULL(P."Discount", 0) <> IFNULL(C."Discount", 0) OR IFNULL(P."frozenFor", '') <> IFNULL(C."frozenFor", '') OR IFNULL(P."validFor", '') <> IFNULL(C."validFor", '') OR IFNULL(P."BankCode", '') || IFNULL(P."DflAccount", '') || IFNULL(P."DflIBAN", '') <> IFNULL(C."BankCode", '') || IFNULL(C."DflAccount", '') || IFNULL(C."DflIBAN", '') OR IFNULL(P."SlpCode", -1) <> IFNULL(C."SlpCode", -1) OR IFNULL(P."DebPayAcct", '') <> IFNULL(C."DebPayAcct", '') OR IFNULL(P."CardName", '') <> IFNULL(C."CardName", '')) THEN 1 ELSE 0 END AS "AnyChg"
FROM (SELECT "CardCode","CardName","CardType","LogInstanc","UpdateDate","CreateDate","UserSign2","CreditLine","GroupNum","ListNum","Discount","frozenFor","validFor","BankCode","DflAccount","DflIBAN","SlpCode","DebPayAcct" FROM ACRD UNION ALL SELECT O."CardCode",O."CardName",O."CardType",IFNULL(MX."M",0)+1 AS "LogInstanc",O."UpdateDate",O."CreateDate",O."UserSign2",O."CreditLine",O."GroupNum",O."ListNum",O."Discount",O."frozenFor",O."validFor",O."BankCode",O."DflAccount",O."DflIBAN",O."SlpCode",O."DebPayAcct" FROM OCRD O LEFT JOIN (SELECT "CardCode" AS "K",MAX("LogInstanc") AS "M" FROM ACRD GROUP BY "CardCode") MX ON MX."K"=O."CardCode") C
LEFT JOIN (SELECT "CardCode","CardName","LogInstanc","UpdateDate","UserSign2","CreditLine","GroupNum","ListNum","Discount","frozenFor","validFor","BankCode","DflAccount","DflIBAN","SlpCode","DebPayAcct" FROM ACRD UNION ALL SELECT O."CardCode",O."CardName",IFNULL(MX."M",0)+1 AS "LogInstanc",O."UpdateDate",O."UserSign2",O."CreditLine",O."GroupNum",O."ListNum",O."Discount",O."frozenFor",O."validFor",O."BankCode",O."DflAccount",O."DflIBAN",O."SlpCode",O."DebPayAcct" FROM OCRD O LEFT JOIN (SELECT "CardCode" AS "K",MAX("LogInstanc") AS "M" FROM ACRD GROUP BY "CardCode") MX ON MX."K"=O."CardCode") P ON P."CardCode" = C."CardCode" AND P."LogInstanc" = C."LogInstanc" - 1
LEFT JOIN OCTG G1 ON G1."GroupNum" = P."GroupNum"
LEFT JOIN OCTG G2 ON G2."GroupNum" = C."GroupNum"
LEFT JOIN OPLN L1 ON L1."ListNum" = P."ListNum"
LEFT JOIN OPLN L2 ON L2."ListNum" = C."ListNum"
LEFT JOIN OSLP S1 ON S1."SlpCode" = P."SlpCode"
LEFT JOIN OSLP S2 ON S2."SlpCode" = C."SlpCode"
LEFT JOIN OUSR U ON U."USERID" = C."UserSign2"
WHERE COALESCE(C."UpdateDate", C."CreateDate") BETWEEN [%0] AND [%1]
) Y
WHERE Y."IsNew" = 1 OR Y."AnyChg" = 1
) X
LEFT JOIN OCRD B0 ON B0."CardCode" = X."CardCode"
LEFT JOIN OUSR UC ON UC."USERID" = B0."UserSign"
LEFT JOIN OUSR UP ON UP."USERID" = X."OldUser"
ORDER BY X."Score" DESC, X."ChgDate" DESC
</script>
<script type="text/plain" id="sql_q8">
/* SELECT T0."DocDate" FROM ORCT T0 WHERE T0."DocDate" BETWEEN [%0] AND [%1] */
SELECT O0."DocEntry" AS "فتح السند",
X."DocNum" AS "رقم السند",
X."DocDate" AS "تاريخ السند",
X."CreateDate" AS "تاريخ الادخال",
DAYS_BETWEEN(X."DocDate",X."CreateDate") AS "تأخير الادخال",
X."CardCode" AS "رمز العميل",
X."CardName" AS "اسم العميل",
X."SlpName" AS "المندوب",
X."PymntGroup" AS "شروط الدفع",
X."CashSum" AS "نقد",
X."CheckSum" AS "شيكات",
X."TrsfrSum" AS "تحويل",
X."CreditSum" AS "بطاقات",
X."DocTotal" AS "الاجمالي",
X."EffDate" AS "تاريخ الدفع الفعلي",
DAYS_BETWEEN(X."DocDate",X."EffDate") AS "أيام تأجيل الشيكات",
X."Invs" AS "الفواتير المسددة",
DAYS_BETWEEN(X."AppDue",X."EffDate") AS "تأخير حسب الفواتير المسددة",
ROUND(X."B",3) AS "الرصيد قبل التحصيل",
X."OldDue" AS "استحقاق اقدم ذمة",
DAYS_BETWEEN(X."OldDue",X."EffDate") AS "تأخير FIFO",
CASE WHEN X."OldDue" IS NULL THEN 'لا يوجد رصيد مستحق' WHEN DAYS_BETWEEN(X."OldDue",X."EffDate")<0 THEN 'قبل الاستحقاق ب '||TO_VARCHAR(-DAYS_BETWEEN(X."OldDue",X."EffDate"))||' يوم' WHEN DAYS_BETWEEN(X."OldDue",X."EffDate")=0 THEN 'يوم الاستحقاق' ELSE 'متأخر '||TO_VARCHAR(DAYS_BETWEEN(X."OldDue",X."EffDate"))||' يوم' END AS "حالة السداد",
RTRIM(
CASE WHEN X."Canceled"='Y' THEN '✖ سند ملغى / ' ELSE '' END||
CASE WHEN DAYS_BETWEEN(X."DocDate",X."CreateDate")>1 THEN '✖ مسجل بتاريخ سابق / ' ELSE '' END||
CASE WHEN IFNULL(X."DupN",0)>0 THEN '✖ شيك مكرر في سند آخر / ' ELSE '' END||
CASE WHEN X."DocType"='A' THEN '✖ قبض على حساب وليس عميل / ' ELSE '' END||
CASE WHEN X."AppDue" IS NOT NULL AND X."OldDue" IS NOT NULL AND DAYS_BETWEEN(X."OldDue",X."EffDate")-DAYS_BETWEEN(X."AppDue",X."EffDate")>30 THEN 'ربط على فاتورة احدث من الاقدم / ' ELSE '' END||
CASE WHEN X."MaxDue">ADD_DAYS(X."DocDate",90) THEN 'شيك مؤجل اكثر من 90 يوم / ' ELSE '' END||
CASE WHEN DAYS_BETWEEN(X."OldDue",X."EffDate")>30 THEN 'ذمة متأخرة اكثر من 30 يوم / ' ELSE '' END
,' /') AS "التنبيه",
X."ChkN" AS "عدد الشيكات",
X."ChkNums" AS "أرقام الشيكات",
X."MaxDue" AS "أبعد تاريخ شيك",
SUM(CASE WHEN X."Canceled"='N' THEN X."CashSum" ELSE 0 END) OVER (PARTITION BY X."DocDate") AS "نقد اليوم",
SUM(CASE WHEN X."Canceled"='N' THEN X."CheckSum" ELSE 0 END) OVER (PARTITION BY X."DocDate") AS "شيكات اليوم",
SUM(CASE WHEN X."Canceled"='N' THEN X."TrsfrSum" ELSE 0 END) OVER (PARTITION BY X."DocDate") AS "تحويلات اليوم",
X."CounterRef" AS "مرجع",
X."Comments" AS "الملاحظات",
X."U_NAME" AS "المستخدم"
FROM (
SELECT Y.*,
CASE WHEN Y."B">Y."Tol" THEN (SELECT MIN(CASE WHEN Q."TD">=30 THEN ADD_DAYS(LAST_DAY(ADD_MONTHS(LAST_DAY(Q."DocDate"),TO_INTEGER(FLOOR(Q."TD"/30)))),MOD(Q."TD",30)) ELSE ADD_DAYS(Q."DocDate",Q."TD") END) FROM (SELECT I."CardCode",I."DocDate",IFNULL(GI."ExtraDays",0) AS "TD",SUM(I."DocTotal") OVER (PARTITION BY I."CardCode" ORDER BY I."DocDate",I."DocEntry") AS "Cum" FROM OINV I LEFT JOIN OCTG GI ON GI."GroupNum"=I."GroupNum" WHERE I."CANCELED"='N') Q WHERE Q."CardCode"=Y."CardCode" AND Q."DocDate"<=Y."DocDate" AND Q."Cum"-Y."CumCut"+Y."B">Y."Tol") END AS "OldDue"
FROM (
SELECT T0."DocEntry",T0."DocNum",T0."DocDate",T0."CreateDate",T0."CardCode",T0."CardName",T0."DocType",T0."Canceled",T0."CashSum",T0."CheckSum",T0."TrsfrSum",T0."CreditSum",T0."DocTotal",T0."CounterRef",T0."Comments",S."SlpName",G."PymntGroup",U."U_NAME",
CK."ChkN",CK."ChkNums",CK."MaxDue",CK."DupN",AP."Invs",
TO_DECIMAL(1,18,3) AS "Tol",
CASE WHEN T0."DocTotal">0 THEN ADD_DAYS(T0."DocDate",TO_INTEGER(ROUND(IFNULL(CK."WDays",0)/T0."DocTotal",0))) ELSE T0."DocDate" END AS "EffDate",
IFNULL((SELECT SUM(J."Debit"-J."Credit") FROM JDT1 J WHERE J."ShortName"=T0."CardCode" AND J."RefDate"<=T0."DocDate" AND J."TransId"<>T0."TransId"),0) AS "B",
IFNULL((SELECT SUM(I."DocTotal") FROM OINV I WHERE I."CardCode"=T0."CardCode" AND I."CANCELED"='N' AND I."DocDate"<=T0."DocDate"),0) AS "CumCut",
(SELECT MIN(CASE WHEN IFNULL(GI."ExtraDays",0)>=30 THEN ADD_DAYS(LAST_DAY(ADD_MONTHS(LAST_DAY(I."DocDate"),TO_INTEGER(FLOOR(IFNULL(GI."ExtraDays",0)/30)))),MOD(IFNULL(GI."ExtraDays",0),30)) ELSE ADD_DAYS(I."DocDate",IFNULL(GI."ExtraDays",0)) END) FROM RCT2 R2 INNER JOIN OINV I ON I."DocEntry"=R2."DocEntry" LEFT JOIN OCTG GI ON GI."GroupNum"=I."GroupNum" WHERE R2."DocNum"=T0."DocEntry" AND R2."InvType"='13') AS "AppDue"
FROM ORCT T0
LEFT JOIN OCRD C ON C."CardCode"=T0."CardCode"
LEFT JOIN OSLP S ON S."SlpCode"=C."SlpCode"
LEFT JOIN OCTG G ON G."GroupNum"=C."GroupNum"
LEFT JOIN OUSR U ON U."USERID"=T0."UserSign"
LEFT JOIN (SELECT R1."DocNum",COUNT(*) AS "ChkN",STRING_AGG(TO_VARCHAR(R1."CheckNum"),', ') AS "ChkNums",MAX(R1."DueDate") AS "MaxDue",SUM(R1."CheckSum"*GREATEST(DAYS_BETWEEN(H."DocDate",R1."DueDate"),0)) AS "WDays",SUM(CASE WHEN DP."CheckNum" IS NOT NULL THEN 1 ELSE 0 END) AS "DupN" FROM RCT1 R1 INNER JOIN ORCT H ON H."DocEntry"=R1."DocNum" LEFT JOIN (SELECT Q1."CheckNum",Q1."BankCode" FROM RCT1 Q1 INNER JOIN ORCT QH ON QH."DocEntry"=Q1."DocNum" WHERE QH."Canceled"='N' AND QH."DocDate">=ADD_DAYS(CURRENT_DATE,-400) GROUP BY Q1."CheckNum",Q1."BankCode" HAVING COUNT(DISTINCT Q1."DocNum")>1) DP ON DP."CheckNum"=R1."CheckNum" AND DP."BankCode"=R1."BankCode" GROUP BY R1."DocNum") CK ON CK."DocNum"=T0."DocEntry"
LEFT JOIN (SELECT R2."DocNum",STRING_AGG(TO_VARCHAR(I."DocNum"),', ') AS "Invs" FROM RCT2 R2 INNER JOIN ORCT RH ON RH."DocEntry"=R2."DocNum" INNER JOIN OINV I ON R2."InvType"='13' AND I."DocEntry"=R2."DocEntry" WHERE RH."DocDate">=ADD_DAYS(CURRENT_DATE,-400) GROUP BY R2."DocNum") AP ON AP."DocNum"=T0."DocEntry"
WHERE T0."CreateDate" BETWEEN [%0] AND [%1]
) Y
) X
LEFT JOIN ORCT O0 ON O0."DocEntry"=X."DocEntry"
ORDER BY X."DocDate",X."U_NAME",X."DocNum"
</script>
<script type="text/plain" id="sql_q9">
/* SELECT T0."DocDate" FROM OVPM T0 WHERE T0."DocDate" BETWEEN [%0] AND [%1] */
SELECT O0."DocEntry" AS "فتح السند",
X."DocNum" AS "رقم السند",
X."DocDate" AS "التاريخ",
X."CreateDate" AS "تاريخ الادخال",
DAYS_BETWEEN(X."DocDate",X."CreateDate") AS "ايام التأخير",
X."CardCode" AS "رمز المستفيد",
X."CardName" AS "المستفيد",
X."CashSum" AS "نقد",
X."CheckSum" AS "شيكات",
X."TrsfrSum" AS "تحويل",
X."DocTotal" AS "الاجمالي",
ROUND(X."B",3) AS "رصيد المورد قبل الدفع",
X."Invs" AS "الفواتير المسددة",
X."BankChg" AS "تاريخ تغيير البنك",
X."F1"+X."F2"+X."F3"+X."F4"+X."F5"+X."F6"+X."F7"+X."F8"+X."F9" AS "درجة الخطورة",
RTRIM(
CASE WHEN X."F6"=1 THEN '✖ تغيير بنك المورد خلال 30 يوم / ' ELSE '' END||
CASE WHEN X."F7"=1 THEN '✖ نفس المستخدم غير البنك ودفع / ' ELSE '' END||
CASE WHEN X."F5"=1 THEN '✖ دفعة اكبر من رصيد المورد / ' ELSE '' END||
CASE WHEN X."F8"=1 THEN '✖ دفعة مكررة محتملة / ' ELSE '' END||
CASE WHEN X."F9"=1 THEN '✖ مورد جديد / ' ELSE '' END||
CASE WHEN X."F4"=1 THEN '✖ صرف لعميل / ' ELSE '' END||
CASE WHEN X."F3"=1 THEN '✖ صرف على حساب وليس مورد / ' ELSE '' END||
CASE WHEN X."F2"=1 THEN '✖ مسجل بتاريخ سابق / ' ELSE '' END||
CASE WHEN X."F1"=1 THEN '✖ سند صرف ملغى / ' ELSE '' END||
CASE WHEN X."NoDocSum">0 THEN 'دفعة غير مطبقة على فواتير / ' ELSE '' END
,' /') AS "التنبيه",
X."Comments" AS "الملاحظات",
X."U_NAME" AS "المستخدم"
FROM (
SELECT Y.*,
CASE WHEN Y."Canceled"='Y' THEN 1 ELSE 0 END AS "F1",
CASE WHEN DAYS_BETWEEN(Y."DocDate",Y."CreateDate")>1 THEN 1 ELSE 0 END AS "F2",
CASE WHEN Y."DocType"='A' THEN 1 ELSE 0 END AS "F3",
CASE WHEN Y."CardType"='C' THEN 1 ELSE 0 END AS "F4",
CASE WHEN Y."CardType"='S' AND Y."Canceled"='N' AND Y."DocTotal">Y."B"+Y."Tol" THEN 1 ELSE 0 END AS "F5",
CASE WHEN Y."BankChg" IS NOT NULL THEN 1 ELSE 0 END AS "F6",
CASE WHEN IFNULL(Y."SameU",0)=1 THEN 1 ELSE 0 END AS "F7",
CASE WHEN IFNULL(Y."DupN",0)>0 THEN 1 ELSE 0 END AS "F8",
CASE WHEN Y."CardType"='S' AND DAYS_BETWEEN(Y."VCreate",Y."DocDate")<=30 THEN 1 ELSE 0 END AS "F9"
FROM (
SELECT T0."DocEntry",T0."DocNum",T0."DocDate",T0."CreateDate",T0."CardCode",T0."CardName",T0."DocType",T0."Canceled",T0."CashSum",T0."CheckSum",T0."TrsfrSum",T0."DocTotal",T0."NoDocSum",T0."Comments",C."CardType",C."CreateDate" AS "VCreate",U."U_NAME",BC."BankChg",BC."SameU",DP."DupN",AP."Invs",
TO_DECIMAL(1,18,3) AS "Tol",
IFNULL((SELECT SUM(J."Credit"-J."Debit") FROM JDT1 J WHERE J."ShortName"=T0."CardCode" AND J."RefDate"<=T0."DocDate" AND J."TransId"<>T0."TransId"),0) AS "B"
FROM OVPM T0
LEFT JOIN OCRD C ON C."CardCode"=T0."CardCode"
LEFT JOIN OUSR U ON U."USERID"=T0."UserSign"
LEFT JOIN (SELECT P0."DocEntry",MAX(V."UpdateDate") AS "BankChg",MAX(CASE WHEN V."UserSign2"=P0."UserSign" THEN 1 ELSE 0 END) AS "SameU" FROM OVPM P0 INNER JOIN (SELECT C1."CardCode",C1."UpdateDate",C1."UserSign2" FROM (SELECT "CardCode","LogInstanc","UpdateDate","UserSign2",IFNULL("BankCode",'')||IFNULL("DflAccount",'')||IFNULL("DflIBAN",'') AS "BK" FROM ACRD UNION SELECT "CardCode","LogInstanc","UpdateDate","UserSign2",IFNULL("BankCode",'')||IFNULL("DflAccount",'')||IFNULL("DflIBAN",'') FROM OCRD) C1 INNER JOIN (SELECT "CardCode","LogInstanc",IFNULL("BankCode",'')||IFNULL("DflAccount",'')||IFNULL("DflIBAN",'') AS "BK" FROM ACRD UNION SELECT "CardCode","LogInstanc",IFNULL("BankCode",'')||IFNULL("DflAccount",'')||IFNULL("DflIBAN",'') FROM OCRD) P1 ON P1."CardCode"=C1."CardCode" AND P1."LogInstanc"=C1."LogInstanc"-1 WHERE C1."BK"<>P1."BK") V ON V."CardCode"=P0."CardCode" AND V."UpdateDate" BETWEEN ADD_DAYS(P0."DocDate",-30) AND P0."DocDate" WHERE P0."DocDate">=ADD_DAYS(CURRENT_DATE,-400) GROUP BY P0."DocEntry") BC ON BC."DocEntry"=T0."DocEntry"
LEFT JOIN (SELECT A."DocEntry",COUNT(*) AS "DupN" FROM OVPM A INNER JOIN OVPM B ON B."CardCode"=A."CardCode" AND B."DocEntry"<>A."DocEntry" AND B."Canceled"='N' AND ABS(B."DocTotal"-A."DocTotal")<0.01 AND ABS(DAYS_BETWEEN(A."DocDate",B."DocDate"))<=7 WHERE A."DocDate">=ADD_DAYS(CURRENT_DATE,-400) GROUP BY A."DocEntry") DP ON DP."DocEntry"=T0."DocEntry"
LEFT JOIN (SELECT V2."DocNum",STRING_AGG(TO_VARCHAR(P."DocNum"),', ') AS "Invs" FROM VPM2 V2 INNER JOIN OVPM VH ON VH."DocEntry"=V2."DocNum" INNER JOIN OPCH P ON V2."InvType"='18' AND P."DocEntry"=V2."DocEntry" WHERE VH."DocDate">=ADD_DAYS(CURRENT_DATE,-400) GROUP BY V2."DocNum") AP ON AP."DocNum"=T0."DocEntry"
WHERE T0."CreateDate" BETWEEN [%0] AND [%1]
) Y
) X
LEFT JOIN OVPM O0 ON O0."DocEntry"=X."DocEntry"
ORDER BY X."F1"+X."F2"+X."F3"+X."F4"+X."F5"+X."F6"+X."F7"+X."F8"+X."F9" DESC,X."DocTotal" DESC
</script>
<script type="text/plain" id="sql_q10">
/* SELECT T0."DocDate" FROM OINV T0 WHERE T0."DocDate" BETWEEN [%0] AND [%1] */
SELECT X."DT" AS "نوع المستند",
I0."DocEntry" AS "فتح الفاتورة",
R0."DocEntry" AS "فتح المرتجع",
X."DocNum" AS "رقم المستند",
X."DocDate" AS "التاريخ",
X."CD" AS "تاريخ الادخال",
DAYS_BETWEEN(X."DocDate",X."CD") AS "ايام التأخير",
X."CardCode" AS "رمز العميل",
X."CardName" AS "اسم العميل",
X."SlpName" AS "المندوب",
M0."ItemCode" AS "فتح الصنف",
X."Dscription" AS "اسم الصنف",
X."Quantity" AS "الكمية",
X."unitMsr" AS "الوحدة",
ROUND(X."Ref"*X."F",3) AS "السعر المرجعي",
X."RSrc" AS "مصدر السعر المرجعي",
LI."DocEntry" AS "فتح اخر فاتورة",
LI."DocNum" AS "اخر فاتورة للعميل",
LI."DocDate" AS "تاريخها",
X."PriceBefDi" AS "السعر في المستند",
ROUND((X."Ref"*X."F"-X."PriceBefDi")*X."Dir"*100/NULLIF(X."Ref"*X."F",0),2) AS "نسبة الفرق",
ROUND((X."Ref"*X."F"-X."PriceBefDi")*X."Quantity"*X."Dir",3) AS "قيمة الفرق",
X."LD" AS "خصم السطر",
X."HD" AS "خصم المستند",
ROUND(X."Net",3) AS "صافي المبلغ",
ROUND(X."Cost",3) AS "الكلفة",
X."CSrc" AS "مصدر الكلفة",
ROUND(X."Net"-X."Cost",3) AS "الربح",
ROUND((X."Net"-X."Cost")*100/NULLIF(X."Net",0),2) AS "نسبة الربح",
ROUND((X."Ref"*X."F"*X."Quantity"-X."Net")*X."Dir",3) AS "اجمالي الفرق مع الخصومات",
SUM(ROUND((IFNULL(X."Ref",0)*X."F"*X."Quantity"-X."Net")*X."Dir",3)) OVER (PARTITION BY X."SlpName") AS "اجمالي المندوب بالفترة",
CASE WHEN IFNULL(X."Ref",0)=0 THEN '✖ لا يوجد سعر مرجعي' WHEN X."Dir"=1 THEN '✖ بيع بسعر اقل من المرجع' ELSE '✖ مرتجع بسعر اعلى من المرجع' END AS "التنبيه",
X."U_NAME" AS "المستخدم"
FROM (
SELECT Y.*,
CASE WHEN Y."IsMil"=1 THEN Y."PMil" ELSE COALESCE(LP."BP",Y."LstP",Y."P01") END AS "Ref",
CASE WHEN Y."IsMil"=1 THEN 'قائمة 33 المؤسسة العسكرية' WHEN LP."BP" IS NOT NULL THEN 'اخر سعر بيع للعميل' WHEN Y."LstP" IS NOT NULL THEN 'قائمة العميل - اول بيع' WHEN Y."P01" IS NOT NULL THEN 'Price List 01 - اول بيع' END AS "RSrc",
COALESCE(Y."CurC",Y."EstC") AS "Cost",
CASE WHEN Y."CurC" IS NOT NULL THEN 'كلفة الباتش الحالية' WHEN Y."EstC" IS NOT NULL THEN 'تقديرية' END AS "CSrc"
FROM (
SELECT B.*,S."SlpName",U."U_NAME",
CASE WHEN B."CardCode" IN ('C0006751','C0006588') THEN 1 ELSE 0 END AS "IsMil",
NULLIF(P."Price",0) AS "LstP",
NULLIF(P1."Price",0) AS "P01",
NULLIF(PM."Price",0) AS "PMil",
(SELECT MAX(H."DocEntry") FROM OINV H INNER JOIN INV1 D ON D."DocEntry"=H."DocEntry" WHERE H."CardCode"=B."CardCode" AND D."ItemCode"=B."ItemCode" AND H."CANCELED"='N' AND D."PriceBefDi">0 AND (H."DocDate"<B."DocDate" OR (B."Dir"=-1 AND H."DocDate"=B."DocDate"))) AS "LastE",
CASE WHEN B."Dir"=1 AND B."BaseType"=15 THEN BD."BC"*B."Quantity"/NULLIF(DB."Quantity",0) WHEN B."isIns"='Y' THEN RB."BC"*B."Quantity"/NULLIF(RB."Q",0) ELSE BO."BC" END AS "CurC",
EC."U"*B."F"*B."Quantity" AS "EstC"
FROM (
SELECT 'فاتورة' AS "DT",1 AS "Dir",13 AS "OT",T0."DocEntry",T0."DocNum",T0."DocDate",T0."CreateDate" AS "CD",T0."CardCode",T0."CardName",T0."SlpCode",T0."UserSign",T0."isIns",T1."LineNum",T1."BaseType",T1."BaseEntry",T1."BaseLine",T1."WhsCode",T1."ItemCode",T1."Dscription",T1."Quantity",T1."unitMsr",T1."PriceBefDi",T1."DiscPrcnt" AS "LD",T0."DiscPrcnt" AS "HD",IFNULL(NULLIF(T1."NumPerMsr",0),1) AS "F",T1."LineTotal"*(1-IFNULL(T0."DiscPrcnt",0)/100) AS "Net"
FROM OINV T0 INNER JOIN INV1 T1 ON T1."DocEntry"=T0."DocEntry"
WHERE T0."CANCELED"='N' AND T1."PriceBefDi">0 AND T0."DocDate">=ADD_DAYS(CURRENT_DATE,-400)
UNION ALL
SELECT 'مرتجع',-1,14,T0."DocEntry",T0."DocNum",T0."DocDate",T0."CreateDate",T0."CardCode",T0."CardName",T0."SlpCode",T0."UserSign",'N',T1."LineNum",T1."BaseType",T1."BaseEntry",T1."BaseLine",T1."WhsCode",T1."ItemCode",T1."Dscription",T1."Quantity",T1."unitMsr",T1."PriceBefDi",T1."DiscPrcnt",T0."DiscPrcnt",IFNULL(NULLIF(T1."NumPerMsr",0),1),T1."LineTotal"*(1-IFNULL(T0."DiscPrcnt",0)/100)
FROM ORIN T0 INNER JOIN RIN1 T1 ON T1."DocEntry"=T0."DocEntry"
WHERE T0."CANCELED"='N' AND T1."PriceBefDi">0 AND T0."DocDate">=ADD_DAYS(CURRENT_DATE,-400)
) B
INNER JOIN OCRD C ON C."CardCode"=B."CardCode"
LEFT JOIN ITM1 P ON P."ItemCode"=B."ItemCode" AND P."PriceList"=C."ListNum"
LEFT JOIN ITM1 P1 ON P1."ItemCode"=B."ItemCode" AND P1."PriceList"=1
LEFT JOIN ITM1 PM ON PM."ItemCode"=B."ItemCode" AND PM."PriceList"=33
LEFT JOIN OSLP S ON S."SlpCode"=B."SlpCode"
LEFT JOIN OUSR U ON U."USERID"=B."UserSign"
LEFT JOIN (SELECT O."DocType",O."DocEntry",O."DocLine",CASE WHEN SUM(CASE WHEN N."Quantity"=0 THEN 1 ELSE 0 END)=0 THEN SUM(ABS(L."Quantity")*N."CostTotal"/NULLIF(N."Quantity",0)) END AS "BC" FROM OITL O INNER JOIN ITL1 L ON L."LogEntry"=O."LogEntry" INNER JOIN OBTN N ON N."ItemCode"=L."ItemCode" AND N."SysNumber"=L."SysNumber" WHERE O."DocType" IN (13,14,15) AND O."StockEff"=1 AND O."DocDate">=ADD_DAYS(CURRENT_DATE,-400) GROUP BY O."DocType",O."DocEntry",O."DocLine") BO ON BO."DocType"=B."OT" AND BO."DocEntry"=B."DocEntry" AND BO."DocLine"=B."LineNum"
LEFT JOIN (SELECT O."DocEntry",O."DocLine",CASE WHEN SUM(CASE WHEN N."Quantity"=0 THEN 1 ELSE 0 END)=0 THEN SUM(ABS(L."Quantity")*N."CostTotal"/NULLIF(N."Quantity",0)) END AS "BC" FROM OITL O INNER JOIN ITL1 L ON L."LogEntry"=O."LogEntry" INNER JOIN OBTN N ON N."ItemCode"=L."ItemCode" AND N."SysNumber"=L."SysNumber" WHERE O."DocType"=15 AND O."StockEff"=1 AND O."DocDate">=ADD_DAYS(CURRENT_DATE,-400) GROUP BY O."DocEntry",O."DocLine") BD ON B."Dir"=1 AND B."BaseType"=15 AND BD."DocEntry"=B."BaseEntry" AND BD."DocLine"=B."BaseLine"
LEFT JOIN DLN1 DB ON B."Dir"=1 AND B."BaseType"=15 AND DB."DocEntry"=B."BaseEntry" AND DB."LineNum"=B."BaseLine"
LEFT JOIN (SELECT D."BaseEntry",D."BaseLine",SUM(D."Quantity") AS "Q",SUM(K."BC") AS "BC" FROM DLN1 D LEFT JOIN (SELECT O."DocEntry",O."DocLine",CASE WHEN SUM(CASE WHEN N."Quantity"=0 THEN 1 ELSE 0 END)=0 THEN SUM(ABS(L."Quantity")*N."CostTotal"/NULLIF(N."Quantity",0)) END AS "BC" FROM OITL O INNER JOIN ITL1 L ON L."LogEntry"=O."LogEntry" INNER JOIN OBTN N ON N."ItemCode"=L."ItemCode" AND N."SysNumber"=L."SysNumber" WHERE O."DocType"=15 AND O."StockEff"=1 AND O."DocDate">=ADD_DAYS(CURRENT_DATE,-400) GROUP BY O."DocEntry",O."DocLine") K ON K."DocEntry"=D."DocEntry" AND K."DocLine"=D."LineNum" WHERE D."BaseType"=13 GROUP BY D."BaseEntry",D."BaseLine") RB ON B."isIns"='Y' AND RB."BaseEntry"=B."DocEntry" AND RB."BaseLine"=B."LineNum"
LEFT JOIN (SELECT Q."ItemCode",Q."WhsCode",SUM(Q."Quantity"*(N."CostTotal"/NULLIF(N."Quantity",0)))/NULLIF(SUM(Q."Quantity"),0) AS "U" FROM OBTQ Q INNER JOIN OBTN N ON N."ItemCode"=Q."ItemCode" AND N."SysNumber"=Q."SysNumber" WHERE Q."Quantity">0 GROUP BY Q."ItemCode",Q."WhsCode") EC ON EC."ItemCode"=B."ItemCode" AND EC."WhsCode"=B."WhsCode"
WHERE B."CD" BETWEEN [%0] AND [%1]
) Y
LEFT JOIN (SELECT D."DocEntry",D."ItemCode",MAX(D."PriceBefDi"/IFNULL(NULLIF(D."NumPerMsr",0),1)) AS "BP" FROM INV1 D INNER JOIN OINV H ON H."DocEntry"=D."DocEntry" WHERE H."DocDate">=ADD_DAYS(CURRENT_DATE,-400) AND D."PriceBefDi">0 GROUP BY D."DocEntry",D."ItemCode") LP ON LP."DocEntry"=Y."LastE" AND LP."ItemCode"=Y."ItemCode"
) X
LEFT JOIN OINV I0 ON X."Dir"=1 AND I0."DocEntry"=X."DocEntry"
LEFT JOIN ORIN R0 ON X."Dir"=-1 AND R0."DocEntry"=X."DocEntry"
LEFT JOIN OINV LI ON LI."DocEntry"=X."LastE"
LEFT JOIN OITM M0 ON M0."ItemCode"=X."ItemCode"
WHERE IFNULL(X."Ref",0)=0 OR (X."Dir"=1 AND X."PriceBefDi"/X."F"<X."Ref"*0.995) OR (X."Dir"=-1 AND X."PriceBefDi"/X."F">X."Ref"*1.005)
ORDER BY (IFNULL(X."Ref",0)*X."F"-X."PriceBefDi")*X."Quantity"*X."Dir" DESC
</script>
<script type="text/plain" id="sql_q11">
/* SELECT T0."DocDate" FROM OITL T0 WHERE T0."DocDate" BETWEEN [%0] AND [%1] */
SELECT I0."DocEntry" AS "فتح الفاتورة",
D0."DocEntry" AS "فتح سند التسليم",
W."DT" AS "نوع المستند",
W."DocNum" AS "رقم المستند",
W."DocDate" AS "تاريخ البيع",
W."CDt" AS "تاريخ الادخال",
DAYS_BETWEEN(W."DocDate",W."CDt") AS "ايام التأخير",
W."CardCode" AS "رمز العميل",
W."CardName" AS "اسم العميل",
S."SlpName" AS "المندوب",
M0."ItemCode" AS "فتح الصنف",
M0."ItemName" AS "اسم الصنف",
W."Whs" AS "المستودع",
W."Batch" AS "الباتش",
W."Mnf" AS "تاريخ الانتاج",
W."Exp" AS "تاريخ الانتهاء",
DAYS_BETWEEN(W."DocDate",W."Exp") AS "أيام متبقية عند البيع",
ROUND(DAYS_BETWEEN(W."DocDate",W."Exp")*100/NULLIF(DAYS_BETWEEN(W."Mnf",W."Exp"),0),1) AS "نسبة العمر المتبقي",
W."Qty" AS "الكمية بوحدة المخزون",
W."SP" AS "سعر البيع",
W."UM" AS "الوحدة",
ROUND(W."NP",3) AS "صافي سعر وحدة المخزون",
ROUND(W."Val"/NULLIF(W."Qty",0),3) AS "كلفة وحدة المخزون",
ROUND(W."NP"*W."Qty",3) AS "صافي البيع للباتش",
ROUND(W."Val",3) AS "قيمة الكلفة",
ROUND(W."NP"*W."Qty"-W."Val",3) AS "الربح",
ROUND((W."NP"*W."Qty"-W."Val")*100/NULLIF(W."NP"*W."Qty",0),2) AS "نسبة الربح",
W."OldAv" AS "اقدم انتهاء متوفر بالمستودع الان",
W."Score" AS "درجة الخطورة",
RTRIM(
CASE WHEN W."Exp" IS NULL THEN '✖ باتش بدون تاريخ انتهاء / ' ELSE '' END||
CASE WHEN W."Exp"<W."DocDate" THEN '✖ بيع باتش منتهي / ' WHEN W."Exp"<=ADD_DAYS(W."DocDate",7) THEN '✖ متبقي 7 ايام او اقل / ' WHEN W."Exp"<=ADD_DAYS(W."DocDate",30) THEN 'متبقي 30 يوم او اقل / ' ELSE '' END||
CASE WHEN W."OldAv"<W."Exp" THEN 'يوجد باتش اقدم انتهاء بالمستودع FEFO / ' ELSE '' END
,' /') AS "التنبيه",
U."U_NAME" AS "المستخدم"
FROM (
SELECT X.*,
COALESCE(IL."PriceBefDi",DL."PriceBefDi") AS "SP",
COALESCE(IL."unitMsr",DL."unitMsr") AS "UM",
COALESCE(IL."LineTotal"*(1-IFNULL(IH."DiscPrcnt",0)/100)/NULLIF(IL."Quantity"*IFNULL(NULLIF(IL."NumPerMsr",0),1),0),DL."LineTotal"*(1-IFNULL(DH."DiscPrcnt",0)/100)/NULLIF(DL."Quantity"*IFNULL(NULLIF(DL."NumPerMsr",0),1),0)) AS "NP"
FROM (
SELECT Y.*,
CASE WHEN Y."Exp" IS NULL THEN 1 WHEN Y."Exp"<Y."DocDate" THEN 3 WHEN Y."Exp"<=ADD_DAYS(Y."DocDate",7) THEN 2 WHEN Y."Exp"<=ADD_DAYS(Y."DocDate",30) THEN 1 ELSE 0 END+CASE WHEN Y."OldAv"<Y."Exp" THEN 1 ELSE 0 END AS "Score"
FROM (
SELECT G.*,
(SELECT MIN(N2."ExpDate") FROM OBTQ Q INNER JOIN OBTN N2 ON N2."ItemCode"=Q."ItemCode" AND N2."SysNumber"=Q."SysNumber" WHERE Q."ItemCode"=G."ItemCode" AND Q."WhsCode"=G."Whs" AND Q."Quantity">0) AS "OldAv"
FROM (
SELECT CASE O."DocType" WHEN 13 THEN 'فاتورة' ELSE 'سند تسليم' END AS "DT",O."DocType",O."DocEntry",O."DocLine",O."DocNum",O."DocDate",O."CardCode",O."CardName",O."ItemCode",O."LocCode" AS "Whs",N."DistNumber" AS "Batch",N."MnfDate" AS "Mnf",N."ExpDate" AS "Exp",
MAX(COALESCE(HI."CreateDate",HD2."CreateDate")) AS "CDt",
SUM(-L."Quantity") AS "Qty",
SUM(-L."Quantity"*N."CostTotal"/NULLIF(N."Quantity",0)) AS "Val"
FROM OITL O
INNER JOIN ITL1 L ON L."LogEntry"=O."LogEntry"
INNER JOIN OBTN N ON N."ItemCode"=L."ItemCode" AND N."SysNumber"=L."SysNumber"
LEFT JOIN OINV HI ON O."DocType"=13 AND HI."DocEntry"=O."DocEntry"
LEFT JOIN ODLN HD2 ON O."DocType"=15 AND HD2."DocEntry"=O."DocEntry"
WHERE O."DocDate">=ADD_DAYS(CURRENT_DATE,-400) AND COALESCE(HI."CreateDate",HD2."CreateDate") BETWEEN [%0] AND [%1]
AND O."DocType" IN (13,15) AND O."StockEff"=1 AND L."Quantity"<0
GROUP BY O."DocType",O."DocEntry",O."DocLine",O."DocNum",O."DocDate",O."CardCode",O."CardName",O."ItemCode",O."LocCode",N."DistNumber",N."MnfDate",N."ExpDate"
) G
) Y
) X
LEFT JOIN OINV IH ON X."DocType"=13 AND IH."DocEntry"=X."DocEntry"
LEFT JOIN INV1 IL ON X."DocType"=13 AND IL."DocEntry"=X."DocEntry" AND IL."LineNum"=X."DocLine"
LEFT JOIN ODLN DH ON X."DocType"=15 AND DH."DocEntry"=X."DocEntry"
LEFT JOIN DLN1 DL ON X."DocType"=15 AND DL."DocEntry"=X."DocEntry" AND DL."LineNum"=X."DocLine"
) W
LEFT JOIN OINV I0 ON W."DocType"=13 AND I0."DocEntry"=W."DocEntry"
LEFT JOIN ODLN D0 ON W."DocType"=15 AND D0."DocEntry"=W."DocEntry"
LEFT JOIN OSLP S ON S."SlpCode"=COALESCE(I0."SlpCode",D0."SlpCode")
LEFT JOIN OUSR U ON U."USERID"=COALESCE(I0."UserSign",D0."UserSign")
LEFT JOIN OITM M0 ON M0."ItemCode"=W."ItemCode"
WHERE W."Score">0
ORDER BY W."Score" DESC,W."Val" DESC
</script>
<script type="text/plain" id="sql_q12">
/* SELECT T0."RefDate" FROM OJDT T0 WHERE T0."RefDate" BETWEEN [%0] AND [%1] */
SELECT J0."TransId" AS "فتح القيد",
X."Number" AS "رقم القيد",
X."RefDate" AS "تاريخ القيد",
X."CreateDate" AS "تاريخ الادخال",
DAYS_BETWEEN(X."RefDate",X."CreateDate") AS "ايام التأخير",
CASE WHEN X."IsCorr"=1 THEN 'تصحيح سند قبض' ELSE 'شيك مرتجع' END AS "نوع القيد",
B0."CardCode" AS "فتح العميل",
B0."CardName" AS "اسم العميل",
S."SlpName" AS "المندوب",
X."Amt" AS "مبلغ الشيك",
RC."CN" AS "رقم الشيك",
RC."DD" AS "تاريخ استحقاق الشيك",
RC."BK" AS "البنك",
R0."DocEntry" AS "فتح سند القبض",
R0."DocNum" AS "سند القبض",
R0."DocDate" AS "تاريخ القبض",
DAYS_BETWEEN(RC."DD",X."RefDate") AS "أيام من الاستحقاق للقيد",
CASE WHEN LOCATE(IFNULL(X."LM",''),'-')>0 THEN TRIM(SUBSTRING(X."LM",LOCATE(X."LM",'-')+1)) END AS "سبب الارتداد",
X."RepN" AS "شيكات مرتجعة للعميل اخر سنة",
X."SalesN" AS "فواتير بعد القيد",
ROUND(X."SalesV",3) AS "قيمة البيع بعد القيد",
B0."Balance" AS "الرصيد الحالي",
B0."CreditLine" AS "حد الائتمان",
CASE WHEN B0."frozenFor"='Y' OR B0."validFor"='N' THEN 'مجمد' ELSE 'فعال' END AS "حالة العميل",
X."F1"+X."F2"+X."F3"+X."F4"+X."F5"+X."F6"+X."F7" AS "درجة الخطورة",
RTRIM(
CASE WHEN X."F7"=1 THEN '✖ تصحيح سند قبض بقيد يدوي / ' ELSE '' END||
CASE WHEN X."F1"=1 THEN '✖ بيع للعميل بعد ارتداد الشيك / ' ELSE '' END||
CASE WHEN X."F2"=1 THEN '✖ شيك مرتجع متكرر / ' ELSE '' END||
CASE WHEN X."F3"=1 THEN '✖ العميل غير مجمد / ' ELSE '' END||
CASE WHEN X."F6"=1 THEN '✖ الرصيد الحالي فوق حد الائتمان / ' ELSE '' END||
CASE WHEN X."F4"=1 THEN '✖ لم يطابق مع شيك مستلم / ' ELSE '' END||
CASE WHEN X."F5"=1 THEN '✖ بدون بيان / ' ELSE '' END
,' /') AS "التنبيه",
X."LM" AS "بيان سطر العميل",
X."Memo" AS "بيان القيد",
X."U_NAME" AS "المستخدم"
FROM (
SELECT Y.*,
CASE WHEN Y."IsCorr"=0 AND Y."SalesN">0 THEN 1 ELSE 0 END AS "F1",
CASE WHEN Y."IsCorr"=0 AND Y."RepN">=2 THEN 1 ELSE 0 END AS "F2",
CASE WHEN Y."IsCorr"=0 AND C."frozenFor"<>'Y' AND C."validFor"='Y' THEN 1 ELSE 0 END AS "F3",
CASE WHEN Y."RcE" IS NULL THEN 1 ELSE 0 END AS "F4",
CASE WHEN IFNULL(TRIM(Y."LM"),'')='' AND IFNULL(TRIM(Y."Memo"),'')='' THEN 1 ELSE 0 END AS "F5",
CASE WHEN C."CreditLine">0 AND C."Balance">C."CreditLine" THEN 1 ELSE 0 END AS "F6",
CASE WHEN Y."IsCorr"=1 THEN 1 ELSE 0 END AS "F7"
FROM (
SELECT T0."TransId",T0."Number",T0."RefDate",T0."CreateDate",T0."Memo",U."U_NAME",E."Card",E."Amt",E."RepN",E."LM",E."IsCorr",
COALESCE(
(SELECT MAX(H."DocEntry") FROM ORCT H INNER JOIN RCT1 R1 ON R1."DocNum"=H."DocEntry" WHERE H."CardCode"=E."Card" AND H."Canceled"='N' AND ABS(R1."CheckSum"-E."Amt")<0.01 AND IFNULL(E."LM",'')||IFNULL(T0."Memo",'') LIKE '%'||TO_VARCHAR(R1."CheckNum")||'%'),
(SELECT MAX(H."DocEntry") FROM ORCT H INNER JOIN RCT1 R1 ON R1."DocNum"=H."DocEntry" WHERE H."CardCode"=E."Card" AND H."Canceled"='N' AND ABS(R1."CheckSum"-E."Amt")<0.01 AND R1."DueDate" BETWEEN ADD_DAYS(E."RD",-180) AND ADD_DAYS(E."RD",7))
) AS "RcE",
(SELECT COUNT(*) FROM OINV V WHERE V."CardCode"=E."Card" AND V."CANCELED"='N' AND V."DocDate">T0."RefDate") AS "SalesN",
(SELECT SUM(V."DocTotal") FROM OINV V WHERE V."CardCode"=E."Card" AND V."CANCELED"='N' AND V."DocDate">T0."RefDate") AS "SalesV"
FROM OJDT T0
INNER JOIN (
SELECT V.*,SUM(CASE WHEN V."RD">=ADD_DAYS(CURRENT_DATE,-365) AND V."IsCorr"=0 THEN 1 ELSE 0 END) OVER (PARTITION BY V."Card") AS "RepN"
FROM (
SELECT R.*,CASE WHEN IFNULL(R."LM",'')||IFNULL(R."HM",'') LIKE '%توجيه%' OR IFNULL(R."LM",'')||IFNULL(R."HM",'') LIKE '%خطأ%' OR IFNULL(R."LM",'')||IFNULL(R."HM",'') LIKE '%خطا%' OR IFNULL(R."LM",'')||IFNULL(R."HM",'') LIKE '%تصحيح%' THEN 1 ELSE 0 END AS "IsCorr"
FROM (
SELECT J."TransId",MAX(J."RefDate") AS "RD",J."ShortName" AS "Card",SUM(J."Debit"-J."Credit") AS "Amt",MAX(J."LineMemo") AS "LM",MAX(HD."Memo") AS "HM",MAX(BK."BankNet") AS "BankNet",MAX(CN."CustNet") AS "CustNet"
FROM JDT1 J
INNER JOIN OJDT HD ON HD."TransId"=J."TransId"
INNER JOIN OCRD BC ON BC."CardCode"=J."ShortName" AND BC."CardType"='C' AND BC."CardCode" NOT LIKE 'E%'
INNER JOIN (SELECT K."TransId",SUM(K."Credit"-K."Debit") AS "BankNet" FROM JDT1 K WHERE K."TransType"='30' AND LEFT(K."Account",4) IN ('1112','2111') AND K."RefDate">=ADD_DAYS(CURRENT_DATE,-400) GROUP BY K."TransId" HAVING SUM(K."Credit"-K."Debit")>0) BK ON BK."TransId"=J."TransId"
INNER JOIN (SELECT K."TransId",SUM(K."Debit"-K."Credit") AS "CustNet" FROM JDT1 K INNER JOIN OCRD KC ON KC."CardCode"=K."ShortName" AND KC."CardType"='C' AND KC."CardCode" NOT LIKE 'E%' WHERE K."TransType"='30' AND K."RefDate">=ADD_DAYS(CURRENT_DATE,-400) GROUP BY K."TransId" HAVING SUM(K."Debit"-K."Credit")>0) CN ON CN."TransId"=J."TransId"
WHERE J."TransType"='30' AND J."RefDate">=ADD_DAYS(CURRENT_DATE,-400)
GROUP BY J."TransId",J."ShortName"
HAVING SUM(J."Debit"-J."Credit")>0
) R
WHERE R."CustNet"<=R."BankNet"+0.01
AND (
EXISTS (SELECT 1 FROM RCT1 Q1 INNER JOIN ORCT QH ON QH."DocEntry"=Q1."DocNum" WHERE QH."CardCode"=R."Card" AND QH."Canceled"='N' AND ABS(Q1."CheckSum"-R."Amt")<0.01 AND Q1."DueDate" BETWEEN ADD_DAYS(R."RD",-180) AND ADD_DAYS(R."RD",7))
OR IFNULL(R."LM",'')||IFNULL(R."HM",'') LIKE '%ارجاع شيك%'
OR IFNULL(R."LM",'')||IFNULL(R."HM",'') LIKE '%شيك راجع%'
OR IFNULL(R."LM",'')||IFNULL(R."HM",'') LIKE '%شيك مرتجع%'
)
) V
) E ON E."TransId"=T0."TransId"
LEFT JOIN OUSR U ON U."USERID"=T0."UserSign"
WHERE T0."CreateDate" BETWEEN [%0] AND [%1]
AND T0."TransType"='30'
) Y
LEFT JOIN OCRD C ON C."CardCode"=Y."Card"
) X
LEFT JOIN OJDT J0 ON J0."TransId"=X."TransId"
LEFT JOIN OCRD B0 ON B0."CardCode"=X."Card"
LEFT JOIN OSLP S ON S."SlpCode"=B0."SlpCode"
LEFT JOIN ORCT R0 ON R0."DocEntry"=X."RcE"
LEFT JOIN (SELECT R1."DocNum",R1."CheckSum",MAX(R1."CheckNum") AS "CN",MAX(R1."DueDate") AS "DD",MAX(R1."BankCode") AS "BK" FROM RCT1 R1 GROUP BY R1."DocNum",R1."CheckSum") RC ON RC."DocNum"=X."RcE" AND ABS(RC."CheckSum"-X."Amt")<0.01
ORDER BY X."F1"+X."F2"+X."F3"+X."F4"+X."F5"+X."F6"+X."F7" DESC,X."Amt" DESC
</script>
<script type="text/plain" id="sql_q13">
/* SELECT T0."DocDate" FROM OPCH T0 WHERE T0."DocDate" BETWEEN [%0] AND [%1] */
SELECT P0."DocEntry" AS "فتح فاتورة الشراء",
X."DocNum" AS "رقم الفاتورة",
X."DocDate" AS "التاريخ",
X."CreateDate" AS "تاريخ الادخال",
DAYS_BETWEEN(X."DocDate",X."CreateDate") AS "ايام التأخير",
CASE WHEN X."isIns"='Y' THEN 'فاتورة حجز' ELSE 'فاتورة عادية' END AS "نوع الفاتورة",
B0."CardCode" AS "فتح المورد",
X."CardName" AS "المورد",
M0."ItemCode" AS "فتح الصنف",
X."Dscription" AS "اسم الصنف",
X."Quantity" AS "الكمية المفوترة",
X."unitMsr" AS "الوحدة",
X."Cur" AS "العملة",
X."Rate" AS "سعر الصرف",
X."PriceBefDi" AS "السعر بعملة الفاتورة",
