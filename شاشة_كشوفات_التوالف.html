function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtN(n,d){ if(n==null||isNaN(n)) return '—'; return (+n).toLocaleString('en-US',{minimumFractionDigits:d==null?0:d,maximumFractionDigits:d==null?3:d}); }
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=String(iso).split('-'); return `${d}/${m}/${y}`; }
function isoToday(){ return new Date().toISOString().slice(0,10); }
function safeGet(key, fallback){ try{ const v = localStorage.getItem(key); return v==null ? fallback : JSON.parse(v); } catch(e){ return fallback; } }
function safeSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function splitTabOrComma(line){
  if(line.includes('\t')) return line.split('\t');
  if(line.includes(',')) return line.split(',');
  return line.split(/\s{2,}/).filter(s=>s!=='');
}
function parseNum(s){ return parseFloat(String(s==null?'':s).replace(/,/g,'')); }
function normalizeStorage(raw){
  const s = String(raw||'').trim().toLowerCase();
  if(!s) return '';
  if(s.includes('sweet')||s.includes('حلويات')) return 'حلويات';
  if(s.includes('chill')||s.includes('مبرد')) return 'مبرد';
  if(s.includes('frozen')||s.includes('مجمد')) return 'مجمد';
  if(s.includes('dry')||s.includes('نواشف')||s.includes('جاف')) return 'نواشف';
  return String(raw).trim();
}
/* ---------------- تحويل رقم إلى كتابة عربية (للمبلغ بالدينار) ---------------- */
function numToArWords(num){
  num = Math.floor(num);
  if(num === 0) return 'صفر';
  const ones = ['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'];
  const teens = ['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens = ['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hundreds = ['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];
  function threeDigits(n){
    const parts = []; const h = Math.floor(n/100), r = n%100;
    if(h) parts.push(hundreds[h]);
    if(r){
      if(r < 10) parts.push(ones[r]);
      else if(r < 20) parts.push(teens[r-10]);
      else { const t = Math.floor(r/10), o = r%10; parts.push(o ? (ones[o] + ' و' + tens[t]) : tens[t]); }
    }
    return parts.join(' و');
  }
  const million = Math.floor(num / 1000000);
  const thousand = Math.floor((num % 1000000) / 1000);
  const rest = num % 1000;
  const segments = [];
  if(million){
    segments.push(million===1 ? 'مليون' : million===2 ? 'مليونان' : million<=10 ? (threeDigits(million)+' ملايين') : (threeDigits(million)+' مليون'));
  }
  if(thousand){
    segments.push(thousand===1 ? 'ألف' : thousand===2 ? 'ألفان' : thousand<=10 ? (threeDigits(thousand)+' آلاف') : (threeDigits(thousand)+' ألف'));
  }
  if(rest) segments.push(threeDigits(rest));
  return segments.join(' و');
}
function amountInWordsJOD(amount){
  const dinars = Math.floor(amount+1e-9);
  const fils = Math.round((amount - dinars) * 1000);
  return `فقط ${numToArWords(dinars)} دينار و${String(fils).padStart(3,'0')} فلس لا غير`;
}

/* ---------------- تسجيل الدخول (Supabase Auth) ---------------- */
function renderLoginGate(errMsg){
  document.getElementById('shell').innerHTML = `
  <div class="gate">
    <h1>🔐 تسجيل الدخول</h1>
    <p class="sub">مركز الكيلاني للأغذية — كشوفات التوالف</p>
    <div class="field"><label>البريد الإلكتروني</label><input type="email" id="loginEmail"></div>
    <div class="field"><label>كلمة المرور</label><input type="password" id="loginPass"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">دخول</button>
    ${errMsg?`<div class="err">${esc(errMsg)}</div>`:''}
  </div>`;
}
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  if(!email || !password){ renderLoginGate('الرجاء إدخال البريد الإلكتروني وكلمة المرور.'); return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ renderLoginGate('فشل الدخول: ' + error.message); return; }
  SESSION = data.session;
  await checkPermissionAndRender();
}
async function doLogout(){ await sb.auth.signOut(); SESSION = null; SCREEN_PERM = null; CAN_EDIT = false; renderLoginGate(''); }

/* ---------------- صلاحية هذه الشاشة (user_screen_permissions) ---------------- */

    <p class="sub">${esc(msg)}</p>
    <button class="btn ghost" style="width:100%" onclick="doLogout()">تسجيل خروج</button>
  </div>`;
}
async function checkPermissionAndRender(){
  document.getElementById('shell').innerHTML = '<div class="center-load">جاري التحقق من صلاحيتك...</div>';
  const { data: permRow, error: permErr } = await sb.from('user_screen_permissions')
    .select('permission').eq('user_id', SESSION.user.id).eq('screen_id', SCREEN_ID).maybeSingle();
  if(permErr){
    renderUnauthorized('warn', 'تعذّر التحقق من صلاحيتك',
      'حصل خطأ تقني أثناء التحقق من صلاحيتك على هذه الشاشة. حدّث الصفحة وحاول مجدداً، وإذا تكرر راجع مدير الصلاحيات.');
    return;
  }
  SCREEN_PERM = permRow ? permRow.permission : null;
  if(!SCREEN_PERM){
    renderUnauthorized('err', 'لا تملك صلاحية الدخول',
      'حسابك غير مخوَّل بالدخول على شاشة كشوفات التوالف. راجع مدير الصلاحيات لمنحك صلاحية (VIEW/INPUT/ADMIN) من شاشة إدارة المستخدمين والصلاحيات.');
    return;
  }
  CAN_EDIT = SCREEN_PERM==='INPUT' || SCREEN_PERM==='ADMIN';
  await loadInitialDataAndRender();
}

/* ---------------- طبقة البيانات (Supabase) ---------------- */
async function fetchItems(){
  const { data, error } = await sb.from('item_master').select('*').order('item_code');
  if(error) throw error;
  return data || [];
}
async function upsertItemsRemote(rows){
  const payload = rows.map(r=>({
    item_code:r.itemCode, item_name:r.itemName||null, uom:r.uom||null,
    unit_weight:r.unitWeight||0, unit_cost:r.unitCost||0, storage:r.storage||null,
    tax_pct:r.taxPct||0, updated_at:new Date().toISOString(),
  }));
  const { error } = await sb.from('item_master').upsert(payload, { onConflict:'item_code' });
  if(error) throw error;
}
async function deleteItemRemote(code){
  const { error } = await sb.from('item_master').delete().eq('item_code', code);
  if(error) throw error;
}
async function deleteItemsRemote(codes){
  const { error } = await sb.from('item_master').delete().in('item_code', codes);
  if(error) throw error;
}
async function lookupItemsRemote(codes){
  if(!codes.length) return {};
  const { data, error } = await sb.from('item_master').select('*').in('item_code', codes);
  if(error) throw error;
  const map = {}; (data||[]).forEach(r=>map[r.item_code]=r); return map;
}
async function fetchBatches(){
  const { data, error } = await sb.from('damage_batches')
    .select('*, damage_items(*)')
    .order('batch_date', { ascending:false }).order('id', { ascending:false });
  if(error) throw error;
  return data || [];
}
async function insertBatchRemote(header, items){
  const { data: userData } = await sb.auth.getUser();
  const { data: batch, error } = await sb.from('damage_batches').insert({
    batch_date: header.batchDate, transfer_doc_num: header.transferDocNum || null,
    notes: header.notes || null, created_by: userData && userData.user ? userData.user.id : null,
  }).select().single();
  if(error) throw error;
  await insertItemsRemote(batch.id, items);
  return batch.id;
}
async function insertItemsRemote(batchId, items){
  const payload = items.map((it, idx)=>({
    batch_id: batchId, line_no: idx+1, item_code: it.itemCode, item_name: it.itemName || null,
    qty: it.qty, uom: it.uom || null, unit_weight: it.unitWeight || 0, unit_cost: it.unitCost || 0,
    tax_pct: it.taxPct || 0, storage: it.storage || null,
  }));
  const { error } = await sb.from('damage_items').insert(payload);
  if(error) throw error;
}

/* ---------------- بيانات الأصناف ---------------- */
/* كويري SAP موثّقة ومؤكدة (تم التحقق حياً من بيئة SAP الفعلية لمركز الكيلاني):
   - الوزن والوحدة: من OITM حسب "وحدة البيع" (SalUnitMsr / SWeight1) — مطابقة مؤكدة لكشف تالف فعلي.
   - الكلفة: لكل باتش موجود فعلياً بمستودع 100، كلفة الوحدة = OBTN.CostTotal ÷ OBTN.Quantity
     (إجمالي كلفة الباتش الأصلية ÷ إجمالي كميته — نفس القيمة التي تعرضها SAP حرفياً بحقل
     "Cost" بشاشة Batch Details، تم تأكيدها حياً: 45,765.382 ÷ 25,814 = 1.773 لباتش حقيقي).
     تُضرب كلفة كل باتش بكميته الفعلية بمستودع 100 (OBTQ.Quantity) وتُجمع كل الباتشات
     لإعطاء كلفة وحدة مرجّحة للصنف. لم نعتمد OBTN.Balance لأنه تبيّن أنه غير موثوق لبعض
     الباتشات (مثال حقيقي: باتش فيه فجوة كبيرة بين Quantity وOutput Quantity أعطى Balance
     ضخماً وغير منطقي رغم إن CostTotal/Quantity له بقيت سليمة ومطابقة لشاشة SAP نفسها).
     كذلك لم نعتمد OITW.StockValue/OnHand ولا OITW.AvgPrice (صفر لهذه الأصناف المُدارة بباتشات).
     الربط بين الجداول عبر ItemCode + SysNumber (رقم الباتش الداخلي).
   - الضريبة: OITM.VatGourpSa مربوطة بـ OVTG.Rate (كود ضريبي مباشر، مش مجموعة ضريبية).
   - المستودع/التصنيف الحراري: حقول OITM.QryGroup1..4 (الاسم الظاهر بالواجهة "Properties"
     لكن الاسم التقني الحقيقي بقاعدة البيانات QryGroup — تم تأكيده حياً، Property1=حلويات،
     Property2=مبرد، Property3=مجمد، Property4=نواشف).
   مفلترة على الأصناف الموجودة فعلياً بمستودع 100 (كميات باتشات <> صفر) فقط. */
const SAP_ITEM_QUERY = `SELECT
  T0."ItemCode",
  T0."ItemName",
  T0."SalUnitMsr" AS "UoM",
  T0."SWeight1" AS "UnitWeight",
  CASE WHEN SUM(T2."Quantity") <> 0 THEN SUM((T1."CostTotal" / NULLIF(T1."Quantity",0)) * T2."Quantity") / SUM(T2."Quantity") ELSE 0 END AS "UnitCost",
  CASE
    WHEN T0."QryGroup1" = 'Y' THEN 'حلويات'
    WHEN T0."QryGroup2" = 'Y' THEN 'مبرد'
    WHEN T0."QryGroup3" = 'Y' THEN 'مجمد'
    WHEN T0."QryGroup4" = 'Y' THEN 'نواشف'
    ELSE ''
  END AS "Storage",
  T3."Rate" AS "TaxPct"
FROM OITM T0
INNER JOIN OBTQ T2 ON T0."ItemCode" = T2."ItemCode" AND T2."WhsCode" = '100' AND T2."Quantity" <> 0
INNER JOIN OBTN T1 ON T2."ItemCode" = T1."ItemCode" AND T2."SysNumber" = T1."SysNumber"
LEFT JOIN OVTG T3 ON T0."VatGourpSa" = T3."Code"
GROUP BY T0."ItemCode", T0."ItemName", T0."SalUnitMsr", T0."SWeight1", T0."QryGroup1", T0."QryGroup2", T0."QryGroup3", T0."QryGroup4", T3."Rate"
ORDER BY T0."ItemCode"`;
function copySapQuery(){
  const el = document.getElementById('sapQueryBox');
  const done = ()=>{ MSG_ITEMS = 'تم نسخ الكويري — نفّذها بـ Query Generator بالسAP والصق نتيجتها بمربع اللصق أعلاه.'; render(); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(SAP_ITEM_QUERY).then(done).catch(()=>{ el.select(); document.execCommand('copy'); done(); }); }
  else { el.select(); document.execCommand('copy'); done(); }
}
function parseItemMasterPaste(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows = []; let start = 0;
  if(lines.length){ const c0 = splitTabOrComma(lines[0]); if(c0[3]!=null && isNaN(parseNum(c0[3]))) start = 1; }
  for(let i=start;i<lines.length;i++){
    const c = splitTabOrComma(lines[i]);
    if(c.length<2) continue;
    const itemCode = (c[0]||'').trim();
    if(!itemCode) continue;
    const unitWeight = parseNum(c[3]); const unitCost = parseNum(c[4]); const taxPct = parseNum(c[6]);
    rows.push({ itemCode, itemName:(c[1]||'').trim(), uom:(c[2]||'').trim(),
      unitWeight:isNaN(unitWeight)?0:unitWeight, unitCost:isNaN(unitCost)?0:unitCost,
      storage:normalizeStorage(c[5]), taxPct:isNaN(taxPct)?0:taxPct });
  }
  return rows;
}

  const text = document.getElementById('imPasteArea').value;

/* ---------------- كشوفات التوالف ---------------- */
/* كويري SAP تجيب كل الأصناف الموجودة فعلياً بمستودع 100 (كود، اسم، كمية، وحدة) —
   بديل عن النسخ اليدوي من سند التحويل. */
const SAP_WHS100_ITEMS_QUERY = `SELECT
  T0."ItemCode",
  T0."ItemName",
  T1."OnHand" AS "Quantity",
  T0."SalUnitMsr" AS "UoM"
FROM OITM T0
INNER JOIN OITW T1 ON T0."ItemCode" = T1."ItemCode" AND T1."WhsCode" = '100' AND T1."OnHand" <> 0
ORDER BY T0."ItemCode"`;
function copyWhs100Query(){
  const el = document.getElementById('whs100QueryBox');
  const done = ()=>{ MSG_DAMAGE = 'تم نسخ الكويري — نفّذها بـ Query Generator بالسAP والصق نتيجتها بمربع اللصق تحت.'; render(); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(SAP_WHS100_ITEMS_QUERY).then(done).catch(()=>{ el.select(); document.execCommand('copy'); done(); }); }
  else { el.select(); document.execCommand('copy'); done(); }
}
function parseDamagePaste(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows = []; let start = 0;
  if(lines.length){ const c0 = splitTabOrComma(lines[0]); if(c0[2]!=null && isNaN(parseNum(c0[2]))) start = 1; }
  for(let i=start;i<lines.length;i++){
    const c = splitTabOrComma(lines[i]);
    if(c.length<3) continue;
    const itemCode = (c[0]||'').trim(); const qty = parseNum(c[2]);
    if(!itemCode || isNaN(qty)) continue;
    rows.push({ itemCode, itemName:(c[1]||'').trim(), qty, uom:(c[3]||'').trim() });
  }
  return rows;
}
function newDamageBatch(){

const DAMAGE_SORT_COLUMNS = {
  itemCode: r=>r.itemCode||'',
  itemName: r=>r.itemName||'',
  qty: r=>+r.qty||0,
  uom: r=>r.uom||'',
  unitWeight: r=>+r.unitWeight||0,
  totalWeight: r=>(+r.qty||0)*(+r.unitWeight||0),
  unitCost: r=>+r.unitCost||0,

};
function sortDamageDetail(key){
  if(DAMAGE_DETAIL_SORT.key === key){ DAMAGE_DETAIL_SORT.dir *= -1; }
  else { DAMAGE_DETAIL_SORT.key = key; DAMAGE_DETAIL_SORT.dir = 1; }
  render();
}
function sortedDamageItems(items){
  const { key, dir } = DAMAGE_DETAIL_SORT;
  if(!key) return items;
  const getVal = DAMAGE_SORT_COLUMNS[key];
  return items.slice().sort((a,b)=>{
    const va = getVal(a), vb = getVal(b);
    if(typeof va === 'string' || typeof vb === 'string') return String(va).localeCompare(String(vb), 'ar') * dir;
    return (va - vb) * dir;
  });
}

}
function downloadCsv(filename, headers, rows){
  const cell = v => { const s = String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [headers.map(cell).join(','), ...rows.map(r=>r.map(cell).join(','))];
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportDamageDetailCsv(id){
  const b = BATCHES_CACHE.find(x=>x.id===id); if(!b) return;
  const headers = ['#','كود الصنف','اسم الصنف','الكمية','الوحدة','وزن الوحدة','اجمالي الوزن','كلفة الوحدة','اجمالي الكلفة','الضريبة %','المستودع','مبلغ الضريبة'];
  const rows = sortedDamageItems(b.items).map((r,i)=>[i+1, r.itemCode, r.itemName||'', r.qty, r.uom||'', r.unitWeight, r.qty*r.unitWeight, r.unitCost, r.qty*r.unitCost, r.taxPct, r.storage||'', (r.qty*r.unitCost*r.taxPct)/100]);
  downloadCsv(`كشف_تالف_${b.batchDate}.csv`, headers, rows);
}

async function parseDamageAndMerge(){
  DAMAGE_MSG_ERR = false;
  const text = document.getElementById('dmgPasteArea').value;
  const parsed = parseDamagePaste(text);
  if(!parsed.length){ MSG_DAMAGE = 'لم يتم التعرف على أي صنف — تأكد من ترتيب الأعمدة.'; render(); return; }
  MSG_DAMAGE = 'جاري الجلب من قاعدة الأصناف...'; render();
  let master = {};
  try{ master = await lookupItemsRemote([...new Set(parsed.map(r=>r.itemCode))]); }
  catch(e){ MSG_DAMAGE = 'تعذّر الاتصال بقاعدة الأصناف: ' + e.message; render(); return; }
  const merged = parsed.map(r=>{
    const m = master[r.itemCode];
    const incomplete = !!m && (!(+m.unit_weight>0) || !(+m.unit_cost>0) || !m.storage);
    return {
      itemCode:r.itemCode, itemName:r.itemName || (m?m.item_name:'') || '', qty:r.qty,
      uom:r.uom || (m?m.uom:'') || '',
      unitWeight:m?+m.unit_weight:0, unitCost:m?+m.unit_cost:0, taxPct:m?+m.tax_pct:0, storage:m?(m.storage||''):'',
      unmatched:!m, incomplete,
    };
  });
  DAMAGE_DRAFT = DAMAGE_DRAFT.concat(merged);
  const missing = merged.filter(r=>r.unmatched).length;
  const incompleteCount = merged.filter(r=>r.incomplete).length;
  const parts = [];
  if(missing) parts.push(`${missing} صنف غير موجود بقاعدة الأصناف`);
  if(incompleteCount) parts.push(`${incompleteCount} صنف ناقص بيانات (وزن الوحدة أو الكلفة أو المستودع)`);
  MSG_DAMAGE = parts.length ? `تنبيه: ${parts.join(' — ')} — عبّئ الناقص يدوياً بالجدول، أو حدّثه بشاشة "بيانات الأصناف".` : '';
  render();
}
function addDamageRow(){ DAMAGE_DRAFT.push({itemCode:'',itemName:'',qty:0,uom:'',unitWeight:0,unitCost:0,taxPct:0,storage:''}); render(); }
function removeDamageRow(idx){ DAMAGE_DRAFT.splice(idx,1); render(); }
function updateDamageField(idx, field, value){
  const numeric = ['qty','unitWeight','unitCost','taxPct'];
  DAMAGE_DRAFT[idx][field] = numeric.includes(field) ? (parseFloat(value)||0) : value;
  if(numeric.includes(field)){
    const r = DAMAGE_DRAFT[idx];
    document.getElementById(`dW-${idx}`).textContent = fmtN(r.qty*r.unitWeight,3);
    document.getElementById(`dC-${idx}`).textContent = fmtN(r.qty*r.unitCost,3);
    document.getElementById(`dT-${idx}`).textContent = fmtN(r.qty*r.unitCost*r.taxPct/100,3);
    const el = document.getElementById('dmgFooterTotals'); if(el) el.textContent = damageTotalsText(DAMAGE_DRAFT);
  }
}
function hasInvalidCostWeight(r){ return (+r.unitCost||0) <= 0 || (+r.unitWeight||0) <= 0; }
function damageTotals(items){
  const tw = items.reduce((s,r)=>s+(+r.qty||0)*(+r.unitWeight||0),0);
  const tc = items.reduce((s,r)=>s+(+r.qty||0)*(+r.unitCost||0),0);
  const tt = items.reduce((s,r)=>s+((+r.qty||0)*(+r.unitCost||0)*(+r.taxPct||0))/100,0);
  return {tw,tc,tt};
}
function damageTotalsText(items){
  const t = damageTotals(items);
  return `إجمالي الوزن: ${fmtN(t.tw,3)} كغم — إجمالي الكلفة: ${fmtN(t.tc,3)} — إجمالي الضريبة: ${fmtN(t.tt,3)}`;
}
async function saveDamageBatch(){
  if(!DAMAGE_DRAFT.length){ MSG_DAMAGE='أضف صنفاً واحداً على الأقل.'; DAMAGE_MSG_ERR=true; render(); return; }
  const badRows = DAMAGE_DRAFT.map((r,i)=>({r,i})).filter(({r})=>hasInvalidCostWeight(r));
  if(badRows.length){
    const list = badRows.map(({r,i})=>`#${i+1} ${r.itemCode||r.itemName||''}`).join('، ');
    MSG_DAMAGE = `تنبيه: كلفة الوحدة ووزن الوحدة يجب أن يكونا أكبر من صفر — عدّل الأسطر: ${list}`;
    DAMAGE_MSG_ERR = true; render(); return;
  }
  DAMAGE_MSG_ERR = false;
  MSG_DAMAGE = 'جاري الحفظ...'; render();
  const items = DAMAGE_DRAFT.map(({unmatched, ...rest})=>rest);
  try{
    let id = DAMAGE_EDIT_ID;
    if(id){ await updateBatchRemote(id, DAMAGE_HEADER, items); }
    else{ id = await insertBatchRemote(DAMAGE_HEADER, items); }
    BATCHES_CACHE = (await fetchBatches()).map(normalizeBatchRow);
    DAMAGE_DETAIL_ID = id; DAMAGE_MODE='view'; DAMAGE_DRAFT=[]; MSG_DAMAGE='';
  }catch(e){ MSG_DAMAGE = 'فشل الحفظ: ' + e.message; DAMAGE_MSG_ERR = true; }
  render();
}
let DAMAGE_DRAFT_SORT = { key:null, dir:1 };
function sortDamageDraft(key){
  if(DAMAGE_DRAFT_SORT.key === key){ DAMAGE_DRAFT_SORT.dir *= -1; }
  else { DAMAGE_DRAFT_SORT.key = key; DAMAGE_DRAFT_SORT.dir = 1; }
  render();
}
function damageDraftSortHeader(label, key, cls){
  const active = DAMAGE_DRAFT_SORT.key===key;
  const arrow = active ? (DAMAGE_DRAFT_SORT.dir===1?' ▲':' ▼') : '';
  return `<th${cls?` class="${cls}"`:''} title="دبل كليك للترتيب" style="cursor:pointer;user-select:none" ondblclick="sortDamageDraft('${key}')">${esc(label)}${arrow}</th>`;
}
function sortedDamageDraftIndices(){
  const idxs = DAMAGE_DRAFT.map((_,i)=>i);
  const { key, dir } = DAMAGE_DRAFT_SORT;
  if(!key) return idxs;
  const getVal = DAMAGE_SORT_COLUMNS[key];
  return idxs.slice().sort((ia,ib)=>{
    const va = getVal(DAMAGE_DRAFT[ia]), vb = getVal(DAMAGE_DRAFT[ib]);
    if(typeof va === 'string' || typeof vb === 'string') return String(va).localeCompare(String(vb), 'ar') * dir;
    return (va - vb) * dir;
  });
}
function renderDamageDraftRows(){
  return sortedDamageDraftIndices().map((idx,pos)=>{
    const r = DAMAGE_DRAFT[idx];
    const rw = (r.qty||0)*(r.unitWeight||0), rc=(r.qty||0)*(r.unitCost||0), rt=(rc*(r.taxPct||0))/100;
    return `<tr class="${r.unmatched?'unmatched':(hasInvalidCostWeight(r)?'invalidnum':(r.incomplete?'incomplete':''))}">
      <td>${pos+1}</td>

      <td class="num" id="dC-${idx}">${fmtN(rc,3)}</td>

      <td class="num" id="dT-${idx}">${fmtN(rt,3)}</td>
      <td><button class="btn ghost sm" onclick="removeDamageRow(${idx})">حذف</button></td>
    </tr>`;
  }).join('');
}

      <td class="num">${fmtN(r.taxPct,0)}%</td><td class="num">${fmtN(rt,3)}</td></tr>`;
  });
  const totalsRowHtml = `<tr class="p-total"><td colspan="6">الإجمالي</td><td class="num">${fmtN(t.tw,3)}</td><td></td><td class="num">${fmtN(t.tc,3)}</td><td colspan="2"></td><td></td><td class="num">${fmtN(t.tt,3)}</td></tr>`;
  const footerHtml = statementFooterHtml(t);
  // Measure everything once against a single-page structure identical to what statementPage() builds.
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;visibility:hidden;left:-9999px;top:0;width:297mm;';
  holder.innerHTML = statementPage(company, b, rowsHtml.join('') + totalsRowHtml) + `<div id="__footProbe">${footerHtml}</div>`;
  document.body.appendChild(holder);
  const headBlock = holder.querySelector('.p-head');
  const titleBlock = holder.querySelector('.p-title');
  const thead = holder.querySelector('thead');
  const trs = [...holder.querySelectorAll('tbody tr')];
  const rowHeights = trs.slice(0, -1).map(r=>r.getBoundingClientRect().height);
  const totalsHeight = trs[trs.length-1].getBoundingClientRect().height;
  const footerHeight = holder.querySelector('#__footProbe').getBoundingClientRect().height;
  const theadHeight = thead.getBoundingClientRect().height;
  const pageHeight = statementPageContentHeightPx();
  const SAFETY_BUFFER_PX = 40;
  const budget = pageHeight - ((headBlock?headBlock.getBoundingClientRect().height:0)
    + (titleBlock?titleBlock.getBoundingClientRect().height:0) + theadHeight) - SAFETY_BUFFER_PX;
  document.body.removeChild(holder);
  // Chunk rows into pages (every page pays the same head+title+thead overhead, since each is standalone).
  const pages = [];
  let current = [], remaining = budget;
  rowHeights.forEach((h,i)=>{
    if(current.length && remaining - h < 0){ pages.push(current); current = []; remaining = budget; }
    current.push(i); remaining -= h;
  });
  if(current.length || !pages.length) pages.push(current);
  // Does the totals row + footer fit alongside the last page's rows?
  if(remaining < totalsHeight + footerHeight + SAFETY_BUFFER_PX){
    pages.push([]); // totals+footer get their own trailing page
  }
  return { rowsHtml, totalsRowHtml, footerHtml, pages };
}
function buildStatementHtml(b, company){
  const { rowsHtml, totalsRowHtml, footerHtml, pages } = chunkStatementPages(b, company);
  return pages.map((rowIdxs, pageIdx) => {
    const isLast = pageIdx === pages.length - 1;
    const body = rowIdxs.map(i=>rowsHtml[i]).join('') + (isLast ? totalsRowHtml : '');
    return statementPage(company, b, body, isLast ? footerHtml : '');
  }).join('');
}
function statementPageContentHeightPx(){
  // 210mm (A4 landscape short side) - @page statement margin (6mm top+bottom) - .p-page's own padding
  // (8mm top+bottom, applies per-page now that every page is its own standalone .p-page block) = 182mm
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;height:182mm;width:1px;top:0;left:0;';
  document.body.appendChild(probe);
  const h = probe.getBoundingClientRect().height;
  document.body.removeChild(probe);
  return h;
}
function estimateStatementPageCount(b, company){
  return chunkStatementPages(b, company).pages.length;
}
function buildLetterHtml(b, company){
  const t = damageTotals(b.items);
  const pageCount = Math.max(1, estimateStatementPageCount(b, company));
  const [y,m,d] = isoToday().split('-');
  return `<div class="letter">
    <div class="lhead"></div>
    <div class="ldate">التاريخ: <b>${y}/${m}/${d}</b></div>
    <div class="lto">${esc(company.attn)}<br>${esc(company.city)}</div>
    <div class="lsubject">الموضوع / طلب إتلاف مواد غذائية</div>
    <p>تحية طيبة وبعد ،،</p>
    <p>نرجوا التكرم بتحديد موعد لعملية إتلاف كمية من المواد الغذائية وزن (<b>${fmtN(t.tw,3)}</b>) كغم وبقيمة (<b>${fmtN(t.tc,3)}</b>) ${esc(amountInWordsJOD(t.tc))} وانتداب مندوب من دائرتكم الموقّرة لحضور عملية الإتلاف. رقم ضريبة المبيعات (<b>${esc(company.salesTaxNo)}</b>) رقم ضريبة الدخل (<b>${esc(company.incomeTaxNo)}</b>).</p>
    <p>مرفق كشف مكون من ( <b>${pageCount}</b> صفحات ).</p>
    <p>شاكرين لكم حسن تعاونكم ...</p>
    <p>وتفضلوا بقبول فائق الإحترام ....</p>
    <div class="lsign">${esc(company.name)}</div>
  </div>`;
}
function printStatement(id){
  const b = BATCHES_CACHE.find(x=>x.id===id); if(!b) return;
  document.getElementById('printStatement').innerHTML = buildStatementHtml(b, loadCompany());
  document.body.classList.add('printing-statement');
  window.print();
}
function printLetter(id){
  const b = BATCHES_CACHE.find(x=>x.id===id); if(!b) return;
  document.getElementById('printLetter').innerHTML = buildLetterHtml(b, loadCompany());
  document.body.classList.add('printing-letter');
  window.print();
}
window.addEventListener('afterprint', ()=>{
  document.body.classList.remove('printing-statement');
  document.body.classList.remove('printing-letter');
});
</script>
