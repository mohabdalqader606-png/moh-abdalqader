<script>
/* ==================== التخزين (IndexedDB — يتحمل ملايين السطور، بعكس localStorage اللي كان محدود ~5-10 ميجا) ==================== */
const IDB_NAME='WD_STORE_DB',IDB_STORE='kv';
let idbHandle=null;
function openIdb(){
  if(idbHandle)return idbHandle;
  idbHandle=new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error('هذا المتصفح لا يدعم IndexedDB'));return}
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{req.result.createObjectStore(IDB_STORE)};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return idbHandle;
}
async function idbGet(key){
  const db=await openIdb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const req=tx.objectStore(IDB_STORE).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbSet(key,value){
  const db=await openIdb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(value,key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
const STORE_KEYS=['ROWS','STOCK','QUOTES','RESERVED','SETTINGS','FORECASTS','ACCURACY','ACTIONLOG'];
function defaultSettings(){return {offDays:[5],holidays:[],grace:0,leadTimeDays:3,alphaInterval:0.4,alphaQty:0.35,graceMissedMult:1.5,growthThreshold:0.15}}
let ROWS=[],STOCK=[],QUOTES=[],RESERVED=[],SETTINGS=defaultSettings(),FORECASTS={},ACCURACY=[],ACTIONLOG=[],ROWKEYS=new Set();
async function loadAll(){
  const vals=await Promise.all(STORE_KEYS.map(k=>idbGet(k).catch(()=>undefined)));
  ROWS=vals[0]||[];STOCK=vals[1]||[];QUOTES=vals[2]||[];RESERVED=vals[3]||[];
  SETTINGS=Object.assign(defaultSettings(),vals[4]||{});
  FORECASTS=vals[5]||{};ACCURACY=vals[6]||[];ACTIONLOG=vals[7]||[];
  ROWKEYS=new Set(ROWS.map(rowKey));
}
// حفظ بالخلفية (لا نوقف الواجهة بانتظاره) — IndexedDB غير متزامن أصلاً وموثوق حتى بدون انتظار النتيجة هون
function persistAll(){
  const values={ROWS,STOCK,QUOTES,RESERVED,SETTINGS,FORECASTS,ACCURACY,ACTIONLOG};
  Promise.all(STORE_KEYS.map(k=>idbSet(k,values[k]))).catch(e=>{
    alert(`تعذّر الحفظ الدائم (${e.message}) — البيانات ظلّت شغالة بهالجلسة الحالية بس ممكن ما تنحفظ بعد إغلاق الصفحة. لو مستمر، فرّغ مساحة تخزين بالجهاز.`);
  });
}
function rowKey(r){return [r.custCode,r.itemCode,r.wdDate,r.qty,r.uom].join('|')}

/* ==================== أدوات عامة ==================== */
function todayIso(){const d=new Date();return isoDate(d)}
function isoDate(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return String(n).padStart(2,'0')}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function mean(a){return a.length?a.reduce((s,x)=>s+x,0)/a.length:null}
function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
function stdev(a){if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))}
function mad(a){if(!a.length)return 0;const m=median(a);return median(a.map(x=>Math.abs(x-m)))}
function fmtN(n,d){if(n==null||isNaN(n))return '—';return (+n).toLocaleString('en-US',{maximumFractionDigits:d==null?1:d,minimumFractionDigits:0})}
function fmtDate(iso){if(!iso)return '—';const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

/* ==================== تقويم أيام العمل ==================== */
function holidaySet(){return new Set((SETTINGS.holidays||[]).map(h=>h.date))}
function isWorkingDay(iso){const d=new Date(iso+'T00:00:00');if((SETTINGS.offDays||[5]).includes(d.getDay()))return false;if(holidaySet().has(iso))return false;return true}
function addWorkingDays(iso,n){if(n==null||isNaN(n))return null;let d=new Date(iso+'T00:00:00');let steps=Math.round(n);const dir=steps>=0?1:-1;steps=Math.abs(steps);let guard=0;while(steps>0&&guard<20000){d.setDate(d.getDate()+dir);guard++;if(isWorkingDay(isoDate(d)))steps--}return isoDate(d)}
// حساب مباشر (بدون تكرار يوم-بيوم) عشان يضل سريع حتى لو الفجوة بين تاريخين سنين طويلة
// (كان قبل بيعلّق الشاشة لما يكون عندك عملاء/أصناف ما طلبوا من فترة بعيدة عن اليوم)
function workingDaysBetween(iso1,iso2){
  if(!iso1||!iso2)return null;
  if(iso1===iso2)return 0;
  let sign=1,a=iso1,b=iso2;
  if(a>b){sign=-1;[a,b]=[b,a]}
  const da=new Date(a+'T00:00:00'),db=new Date(b+'T00:00:00');
  const totalDays=Math.round((db-da)/86400000);
  const offDays=(SETTINGS.offDays&&SETTINGS.offDays.length)?SETTINGS.offDays:[5];
  const offSet=new Set(offDays);
  const startDow=(da.getDay()+1)%7;
  const fullWeeks=Math.floor(totalDays/7);
  let offWeekly=fullWeeks*offDays.length;
  const rem=totalDays%7;
  for(let i=0;i<rem;i++){const dow=(startDow+i)%7;if(offSet.has(dow))offWeekly++}
  let workingDays=totalDays-offWeekly;
  let holidayDeduct=0;
  holidaySet().forEach(hd=>{
    if(hd>a&&hd<=b){
      const dow=new Date(hd+'T00:00:00').getDay();
      if(!offSet.has(dow))holidayDeduct++;
    }
  });
  workingDays-=holidayDeduct;
  return workingDays*sign;
}

/* ==================== استيراد البيانات ==================== */
function parseDate(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'||/^\d+(\.\d+)?$/.test(String(v).trim())&&+v>20000&&+v<80000){
    const n=+v;const d=new Date(Date.UTC(1899,11,30)+n*86400000);return isoDate(d);
  }
  v=String(v).trim();let m;
  if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return `${m[1]}-${p2(m[2])}-${p2(m[3])}`;
  if(m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/)){
    let d=+m[1],mo=+m[2],y=+m[3];
    if(d>12&&mo<=12){/*DD/MM*/}else if(mo>12&&d<=12){[d,mo]=[mo,d]}
    if(mo>12||d>31)return null;
    return `${y}-${p2(mo)}-${p2(d)}`;
  }
  // ملاحظة: تعمّدنا عدم استخدام new Date(v) كحل احتياطي أخير — مفسّر التواريخ بالمتصفح
  // متساهل بشكل خطير (مثلاً new Date("صنف 0") بيرجع تاريخ صحيح!) وبيقبل نصوص مش تواريخ أصلاً.
  // لو ما طابق أي نمط معروف أعلاه، الأصح نرفضه صراحة بدل ما نخمّن تاريخ غلط بصمت.
  return null;
}
function splitLine(line){return line.includes('\t')?line.split('\t'):line.split(',')}
// SAP B1 Query Generator بيضيف أحياناً عمود ترقيم صفوف "#" بأول كل سطر عند النسخ من الشبكة،
// فبيزيح كل الأعمدة خانة وحدة لليمين. نكتشف هذا تلقائياً بدل ما نطلب من المستخدم يشيله يدوياً كل مرة.
function detectOffset(cols,dateIdx){
  if(parseDate(cols[dateIdx]))return 0;
  if(parseDate(cols[dateIdx+1]))return 1;
  return 0;
}
const BAD_SAMPLE_CAP=2000;
function emptyBadResult(){return {added:0,dup:0,bad:0,reasons:{},badSample:[]}}
function addBad(result,reason,rawLine){
  result.bad++;
  result.reasons[reason]=(result.reasons[reason]||0)+1;
  if(result.badSample.length<BAD_SAMPLE_CAP)result.badSample.push({reason,line:rawLine});
}
function parseWithdrawalText(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const result=emptyBadResult();
  if(!lines.length)return result;
  let start=0;
  const c0=splitLine(lines[0]);
  const qtyTest=c0[6];
  const dateTest=parseDate(c0[4]);
  if((qtyTest!=null&&isNaN(parseFloat(qtyTest)))||!dateTest)start=1;
  if(start>=lines.length)return result;
  const off=detectOffset(splitLine(lines[start]),4);
  for(let i=start;i<lines.length;i++){
    const c=splitLine(lines[i]);
    if(c.length<7+off){addBad(result,`عدد أعمدة غير كافٍ (${c.length} من ${7+off} مطلوبة)`,lines[i]);continue}
    const custCode=(c[0+off]||'').trim(),custName=(c[1+off]||'').trim(),itemCode=(c[2+off]||'').trim(),itemName=(c[3+off]||'').trim();
    const wdDateRaw=c[4+off],qtyRaw=c[6+off];
    const wdDate=parseDate(wdDateRaw);
    const qty=parseFloat(qtyRaw);
    const uom=(c[7+off]||'').trim();
    const rep=(c[8+off]||'').trim();
    const custCategory=(c[9+off]||'').trim();
    const itemCategory=(c[10+off]||'').trim();
    if(!custCode){addBad(result,'كود العميل فاضي',lines[i]);continue}
    if(!itemCode){addBad(result,'كود الصنف فاضي',lines[i]);continue}
    if(!wdDate){addBad(result,`تاريخ غير مفهوم: "${wdDateRaw}"`,lines[i]);continue}
    if(isNaN(qty)){addBad(result,`كمية غير صالحة: "${qtyRaw}"`,lines[i]);continue}
    const r={custCode,custName,itemCode,itemName,wdDate,qty,uom,rep,custCategory,itemCategory};
    const k=rowKey(r);
    if(ROWKEYS.has(k)){result.dup++;continue}
    ROWKEYS.add(k);ROWS.push(r);result.added++;
  }
  return result;
}
function parseStockText(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let start=0;const c0=splitLine(lines[0]||'');
  if(c0[3]!=null&&isNaN(parseFloat(c0[3])))start=1;
  if(start>=lines.length)return 0;
  const off=detectOffset(splitLine(lines[start]),3);
  let added=0;
  for(let i=start;i<lines.length;i++){
    const c=splitLine(lines[i]);if(c.length<4+off)continue;
    const custCode=(c[0+off]||'').trim(),itemCode=(c[1+off]||'').trim();
    const type=(c[2+off]||'').trim().toLowerCase().includes('open')?'opening':'delivery';
    const date=parseDate(c[3+off])||todayIso();
    const qty=parseFloat(c[4+off]!=null?c[4+off]:c[3+off]);
    if(!custCode||!itemCode)continue;
    STOCK.push({custCode,itemCode,type,date,qty:isNaN(qty)?0:qty});added++;
  }
  return added;
}
function parseQuotesText(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let start=0;const c0=splitLine(lines[0]||'');
  if(c0[5]!=null&&isNaN(parseFloat(c0[5])))start=1;
  if(start>=lines.length)return 0;
  const off=detectOffset(splitLine(lines[start]),4);
  let added=0;
  for(let i=start;i<lines.length;i++){
    const c=splitLine(lines[i]);if(c.length<6+off)continue;
    const custCode=(c[0+off]||'').trim(),custName=(c[1+off]||'').trim(),itemCode=(c[2+off]||'').trim(),itemName=(c[3+off]||'').trim();
    const quoteDate=parseDate(c[4+off]);
    const qty=parseFloat(c[5+off]);
    const openQty=parseFloat(c[6+off]);
    const rep=(c[7+off]||'').trim();
    if(!custCode||!itemCode||!quoteDate)continue;
    QUOTES.push({custCode,custName,itemCode,itemName,quoteDate,qty:isNaN(qty)?0:qty,openQty:isNaN(openQty)?null:openQty,rep});added++;
  }
  return added;
}
function parseReservedText(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let start=0;const c0=splitLine(lines[0]||'');
  if(c0[10]!=null&&isNaN(parseFloat(c0[10])))start=1;
  if(start>=lines.length)return 0;
  const off=detectOffset(splitLine(lines[start]),1);
  let added=0;
  for(let i=start;i<lines.length;i++){
    const c=splitLine(lines[i]);if(c.length<11+off)continue;
    const docNum=(c[0+off]||'').trim();
    const invoiceDate=parseDate(c[1+off]);
    const custCode=(c[2+off]||'').trim(),custName=(c[3+off]||'').trim(),itemCode=(c[4+off]||'').trim(),itemName=(c[5+off]||'').trim();
    const undeliveredQty=parseFloat(c[10+off]);
    if(!custCode||!itemCode||!invoiceDate||isNaN(undeliveredQty)||undeliveredQty<=0)continue;
    RESERVED.push({docNum,invoiceDate,custCode,custName,itemCode,itemName,undeliveredQty});added++;
  }
  return added;
}
function matchSignal(g){
  const q=QUOTES.filter(x=>x.custCode===g.custCode&&x.itemCode===g.itemCode&&x.quoteDate>=g.last.date).sort((a,b)=>a.quoteDate<b.quoteDate?1:-1)[0];
  const r=RESERVED.filter(x=>x.custCode===g.custCode&&x.itemCode===g.itemCode&&x.invoiceDate>=g.last.date).sort((a,b)=>a.invoiceDate<b.invoiceDate?1:-1)[0];
  if(r)return {kind:'reserved',date:r.invoiceDate,qty:r.undeliveredQty};
  if(q)return {kind:'quote',date:q.quoteDate,qty:q.openQty!=null?q.openQty:q.qty};
  return null;
}

/* ==================== محرك التحليل والتوقع ==================== */
function buildGroups(){
  const map=new Map();
  ROWS.forEach(r=>{
    const key=r.custCode+'||'+r.itemCode;
    if(!map.has(key))map.set(key,{key,custCode:r.custCode,custName:r.custName,itemCode:r.itemCode,itemName:r.itemName,rep:'',custCategory:'',itemCategory:'',uom:'',events:[]});
    const g=map.get(key);
    g.events.push({date:r.wdDate,qty:+r.qty});
    if(r.rep)g.rep=r.rep;if(r.custCategory)g.custCategory=r.custCategory;if(r.itemCategory)g.itemCategory=r.itemCategory;if(r.uom)g.uom=r.uom;
    if(r.custName)g.custName=r.custName;if(r.itemName)g.itemName=r.itemName;
  });
  map.forEach(g=>g.events.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0));
  return map;
}
function linSlope(arr){const n=arr.length;if(n<2)return 0;const xs=arr.map((_,i)=>i);const mx=mean(xs),my=mean(arr);let num=0,den=0;for(let i=0;i<n;i++){num+=(xs[i]-mx)*(arr[i]-my);den+=(xs[i]-mx)**2}return den?num/den:0}
function ewma(arr,alpha){if(!arr.length)return null;let s=arr[0];for(let i=1;i<arr.length;i++)s=alpha*arr[i]+(1-alpha)*s;return s}

function analyzeGroup(g,events,today){
  const n=events.length;
  const qtyArr=events.map(e=>e.qty);
  const intervals=[];for(let i=1;i<n;i++)intervals.push(workingDaysBetween(events[i-1].date,events[i].date));
  const last=events[n-1];
  const avgInt=mean(intervals),medInt=median(intervals),sdInt=stdev(intervals);
  const cvInt=avgInt?sdInt/avgInt:null;
  const avgQty=mean(qtyArr),medQty=median(qtyArr),sdQty=stdev(qtyArr),madQty=mad(qtyArr);
  const cvQty=avgQty?sdQty/avgQty:null;
  const slopeQty=linSlope(qtyArr);
  const relSlope=avgQty?(slopeQty*n)/avgQty:0;
  const trend=relSlope>SETTINGS.growthThreshold?'up':relSlope<-SETTINGS.growthThreshold?'down':'flat';
  const wdCount={};events.forEach(e=>{const dow=new Date(e.date+'T00:00:00').getDay();wdCount[dow]=(wdCount[dow]||0)+1});
  let domDow=null,domPct=0;Object.entries(wdCount).forEach(([k,v])=>{const pct=v/n;if(pct>domPct){domPct=pct;domDow=+k}});
  const seasonalOk=n>=12;
  const daysSinceLast=workingDaysBetween(last.date,today);
  let expInt=null,expDate=null;
  if(n>=2){expInt=ewma(intervals,SETTINGS.alphaInterval);expDate=addWorkingDays(last.date,expInt)}
  let expQty=null,qtyLow=null,qtyHigh=null;
  if(n>=1){
    expQty=ewma(qtyArr,SETTINGS.alphaQty);
    expQty=Math.max(0,expQty+(n>=2?slopeQty:0));
    const spread=madQty?madQty*1.4826*1.2:expQty*0.12;
    qtyLow=Math.max(0,expQty-spread);qtyHigh=expQty+spread;
  }
  let confidence=n>=1?15:0;
  if(n>=2){
    const nScore=Math.min(n,10)/10*100;
    const regScore=cvInt!=null?clamp((1-cvInt)*100,0,100):30;
    const qtyRegScore=cvQty!=null?clamp((1-cvQty)*100,0,100):30;
    let recencyScore=100;
    if(expInt){const ratio=expInt?daysSinceLast/expInt:1;recencyScore=ratio<=1.2?100:clamp(100-(ratio-1.2)*60,10,100)}
    confidence=Math.round(0.35*nScore+0.30*regScore+0.15*qtyRegScore+0.20*recencyScore);
    if(n<3)confidence=Math.min(confidence,40);
    confidence=clamp(confidence,5,99);
  }
  let anomaly=null;
  if(n>=4&&madQty>0){
    const z=(last.qty-medQty)/(madQty*1.4826);
    if(Math.abs(z)>2)anomaly={z:+z.toFixed(2),dir:z>0?'high':'low'};
  }
  let overdueWD=expDate?workingDaysBetween(expDate,today):null;
  let status='future';
  if(n<2)status='insufficient';
  else if(overdueWD!=null){
    const missThresh=(medInt||avgInt||1)*SETTINGS.graceMissedMult;
    if(overdueWD>missThresh)status='missed';
    else if(overdueWD>=SETTINGS.grace)status='dueNow';
    else if(overdueWD>=-3)status='due3';
    else if(overdueWD>=-7)status='due7';
    else status='future';
  }
  return Object.assign({},g,{n,intervals,avgInt,medInt,sdInt,cvInt,avgQty,medQty,sdQty,madQty,cvQty,slopeQty,relSlope,trend,domDow,domPct,seasonalOk,last,daysSinceLast,expInt,expDate,expQty,qtyLow,qtyHigh,confidence,anomaly,overdueWD,status,events});
}

let GROUPS=[];
function recomputeAll(userTriggered){
  const today=todayIso();
  const map=buildGroups();
  const newGroups=[];
  map.forEach((g,key)=>{
    const prevF=FORECASTS[key];
    if(prevF&&prevF.expDate){
      const newEvents=g.events.filter(e=>e.date>prevF.lastEventDate&&e.date!==prevF._loggedActualDate);
      if(newEvents.length){
        const actual=newEvents[0];
        const already=ACCURACY.some(a=>a.key===key&&a.predictedDate===prevF.expDate&&a.actualDate===actual.date);
        if(!already){
          ACCURACY.push({
            key,custCode:g.custCode,custName:g.custName,itemCode:g.itemCode,itemName:g.itemName,
            predictedDate:prevF.expDate,predictedQty:prevF.expQty,
            actualDate:actual.date,actualQty:actual.qty,
            errDays:workingDaysBetween(prevF.expDate,actual.date),
            errQtyPct:actual.qty?Math.abs((prevF.expQty||0)-actual.qty)/actual.qty*100:null,
            loggedAt:today
          });
        }
      }
    }
    const a=analyzeGroup(g,g.events,today);
    FORECASTS[key]={key,expDate:a.expDate,expQty:a.expQty,confidence:a.confidence,lastEventDate:a.last.date};
    newGroups.push(a);
  });
  GROUPS=newGroups;
  persistAll();
  if(userTriggered)render();
}

/* ==================== المخزون التقديري ==================== */
function estimatedStock(g,today){
  const key=g.custCode+'||'+g.itemCode;
  const feed=STOCK.filter(s=>s.custCode===g.custCode&&s.itemCode===g.itemCode);
  const opening=feed.filter(s=>s.type==='opening').sort((a,b)=>a.date<b.date?1:-1)[0];
  if(!opening)return {known:false};
  const deliveries=feed.filter(s=>s.type==='delivery'&&s.date>=opening.date&&s.date<=today).reduce((s,x)=>s+x.qty,0);
  const withdrawn=g.events.filter(e=>e.date>=opening.date&&e.date<=today).reduce((s,x)=>s+x.qty,0);
  const est=opening.qty+deliveries-withdrawn;
  const dailyCons=g.avgInt&&g.avgQty?g.avgQty/g.avgInt:null;
  const safety=(g.madQty||0)*1.4826*0.5;
  const reorderPoint=dailyCons!=null?dailyCons*SETTINGS.leadTimeDays+safety:null;
  let daysToReorder=null,reorderDate=null;
  if(dailyCons&&reorderPoint!=null){
    daysToReorder=Math.ceil((est-reorderPoint)/dailyCons);
    reorderDate=addWorkingDays(today,Math.max(0,daysToReorder));
  }
  return {known:true,openingDate:opening.date,est,reorderPoint,daysToReorder,reorderDate,dailyCons};
}

/* ==================== سجل الإجراءات ==================== */
function actionKey(g,type){return g.key+'::'+type}
function logAction(g,type,status,snoozeDays){
  const today=todayIso();
  ACTIONLOG.push({key:g.key,type,status,at:today,snoozeUntil:snoozeDays?addWorkingDays(today,snoozeDays):null,custName:g.custName,itemName:g.itemName});
  persistAll();render();
}
function isSuppressed(g,type){
  const today=todayIso();
  const entries=ACTIONLOG.filter(l=>l.key===g.key&&l.type===type);
  if(!entries.length)return false;
  const last=entries[entries.length-1];
  if(last.status==='done')return true;
  if(last.status==='snoozed'&&last.snoozeUntil&&last.snoozeUntil>=today)return true;
  if(last.status==='contacted'&&last.at===today)return true;
  return false;
}

/* ==================== توليد بيانات تجريبية ==================== */
function genSeries(cu,it,rep,cat,intervalWD,baseQty,trendPct,cycles){
  const today=todayIso();
  let d=addWorkingDays(today,-(intervalWD*cycles));
  let qty=baseQty;
  const rows=[];
  let guard=0;
  while(d<=today&&guard<200){
    guard++;
    const outQty=Math.max(5,Math.round(qty));
    rows.push({custCode:cu[0],custName:cu[1],itemCode:it[0],itemName:it[1],wdDate:d,qty:outQty,uom:'كرتون',rep,custCategory:cat,itemCategory:it[0]<='I102'?'أساسي':'ثانوي'});
    qty=Math.max(5,qty*(1+trendPct)+(Math.random()*baseQty*0.10-baseQty*0.05));
    d=addWorkingDays(d,Math.max(1,intervalWD+Math.round(Math.random()*2-1)));
  }
  return rows;
}

/* ==================== Backtest ==================== */
function runBacktest(){
  const today=todayIso();
  const map=buildGroups();
  const results=[];
  map.forEach((g)=>{
    if(g.events.length<4)return;
    const sub=g.events.slice(0,-1);
    const actual=g.events[g.events.length-1];
    const boundary=sub[sub.length-1].date;
    const a=analyzeGroup(g,sub,boundary);
    if(!a.expDate)return;
    results.push({
      custName:g.custName,itemName:g.itemName,
      predictedDate:a.expDate,actualDate:actual.date,
      errDays:workingDaysBetween(a.expDate,actual.date),
      predictedQty:a.expQty,actualQty:actual.qty,
      errQtyPct:actual.qty?Math.abs((a.expQty||0)-actual.qty)/actual.qty*100:null
    });
  });
  return results;
}

/* ---------- مركز إجراءات اليوم ---------- */
function filterOptions(){
  const reps=new Set(),ccats=new Set(),icats=new Set();
  GROUPS.forEach(g=>{if(g.rep)reps.add(g.rep);if(g.custCategory)ccats.add(g.custCategory);if(g.itemCategory)icats.add(g.itemCategory)});
  return {reps:[...reps],ccats:[...ccats],icats:[...icats]};
}
let ACTION_FILTERS={rep:'',ccat:'',icat:'',q:'',minConf:0};
function applyFilters(list){
  return list.filter(g=>{
    if(ACTION_FILTERS.rep&&g.rep!==ACTION_FILTERS.rep)return false;
    if(ACTION_FILTERS.ccat&&g.custCategory!==ACTION_FILTERS.ccat)return false;
    if(ACTION_FILTERS.icat&&g.itemCategory!==ACTION_FILTERS.icat)return false;
    if(ACTION_FILTERS.minConf&&(g.confidence||0)<ACTION_FILTERS.minConf)return false;
    if(ACTION_FILTERS.q){
      const s=(g.custName+' '+g.custCode+' '+g.itemName+' '+g.itemCode).toLowerCase();
      if(!s.includes(ACTION_FILTERS.q.toLowerCase()))return false;
    }
    return true;
  });
}
function reason(g,type){
  if(type==='dueNow')return `موعد السحب المتوقع حان${g.overdueWD>0?' (متأخر '+g.overdueWD+' يوم عمل)':''} — بناءً على متوسط فترة ${fmtN(g.medInt,1)} يوم عمل بين السحوبات.`;
  if(type==='due3')return `يُتوقع الطلب خلال ${Math.abs(g.overdueWD)} يوم عمل تقريباً، بناءً على ${g.n} سحبة سابقة.`;
  if(type==='due7')return `يُتوقع الطلب خلال أسبوع تقريباً (${Math.abs(g.overdueWD)} يوم عمل)، بناءً على النمط المعتاد.`;
  if(type==='missed')return `تجاوز العميل نمطه المعتاد بفارق كبير (${g.overdueWD} يوم عمل عن الموعد المتوقع، مقابل فترة معتادة ${fmtN(g.medInt,1)} يوم) — احتمال توقف الطلب أو التحول لمورد آخر.`;
  if(type==='anomaly')return `آخر سحبة بتاريخ ${fmtDate(g.last.date)} كانت ${fmtN(g.last.qty,0)} وهي ${g.anomaly.dir==='high'?'أعلى':'أقل'} بشكل غير معتاد من الوسيط التاريخي ${fmtN(g.medQty,0)}.`;
  if(type==='growth')return `الكمية المسحوبة في اتجاه تصاعدي مستمر (تغيّر تقديري ${(g.relSlope*100).toFixed(0)}% عبر آخر ${g.n} سحبة).`;
  return '';
}
function recAction(type){
  return {dueNow:'يوصى بالتواصل مع العميل خلال يوم عمل واحد.',due3:'يوصى بالتواصل خلال 1-2 يوم عمل قبل الموعد المتوقع.',due7:'أدرجه في خطة التواصل لهذا الأسبوع.',missed:'تواصل فوري لمعرفة السبب قبل فقدان العميل على هذا الصنف.',anomaly:'تحقق من سبب الانحراف (طلبية استثنائية، مشكلة تخزين، أو تحول جزئي لمورد آخر).',growth:'فرصة لزيادة السقف المقترح أو عرض بيع إضافي على هذا الصنف.'}[type];
}

function readFileSmart(file,cb){
  const r=new FileReader();
  r.onload=()=>{
    const buf=r.result;const b=new Uint8Array(buf);let enc='utf-8',skip=0;
    if(b[0]===0xFF&&b[1]===0xFE){enc='utf-16le';skip=2}
    else if(b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF){enc='utf-8';skip=3}
    try{cb(new TextDecoder(enc).decode(buf.slice(skip)))}catch(e){cb(new TextDecoder('utf-8').decode(buf))}
  };
  r.readAsArrayBuffer(file);
}

/* ---------- اتجاهات الطلب ---------- */
function renderTrends(){
  if(!GROUPS.length)return `<div class="card"><h2>لا توجد بيانات بعد</h2></div>`;
  const byItem={};
  GROUPS.forEach(g=>{
    const k=g.itemCode+'|'+g.itemName;
    if(!byItem[k])byItem[k]={itemName:g.itemName,itemCode:g.itemCode,totalQty:0,totalSlope:0,n:0,customers:0};
    byItem[k].totalQty+=g.events.reduce((s,e)=>s+e.qty,0);
    byItem[k].totalSlope+=g.relSlope||0;
    byItem[k].n+=g.n;byItem[k].customers++;
  });
  const itemRows=Object.values(byItem).sort((a,b)=>b.totalSlope-a.totalSlope);
  const byRep={};
  GROUPS.forEach(g=>{
    const k=g.rep||'—';
    if(!byRep[k])byRep[k]={rep:k,pairs:0,dueNow:0,missed:0,growth:0};
    byRep[k].pairs++;
    if(g.status==='dueNow')byRep[k].dueNow++;
    if(g.status==='missed')byRep[k].missed++;
    if(g.trend==='up'&&g.n>=4)byRep[k].growth++;
  });
  return `
  <div class="card">
    <h2>اتجاه الطلب حسب الصنف (مجمّع عبر كل العملاء)</h2>
    <table><tr><th>الصنف</th><th>عدد العملاء</th><th>إجمالي الكمية التاريخية</th><th>مؤشر الاتجاه</th></tr>

    <h2>ملخص حسب المندوب</h2>

    <div class="kpi">
      <div class="box"><b>${ACCURACY.length}</b>عدد المقارنات المسجّلة</div>
      <div class="box"><b>${fmtN(overallMAE,1)}</b>MAE (أيام عمل)</div>
      <div class="box"><b>${overallMAPE!=null?fmtN(overallMAPE,1)+'%':'—'}</b>MAPE (كمية)</div>
    </div>
    ${ACCURACY.length?`<table><tr><th>العميل</th><th>الصنف</th><th>تاريخ متوقع</th><th>تاريخ فعلي</th><th>خطأ (يوم عمل)</th><th>خطأ الكمية %</th></tr>
    ${ACCURACY.slice().reverse().slice(0,200).map(a=>`<tr><td>${esc(a.custName)}</td><td>${esc(a.itemName)}</td><td>${fmtDate(a.predictedDate)}</td><td>${fmtDate(a.actualDate)}</td><td class="num">${a.errDays}</td><td class="num">${a.errQtyPct!=null?fmtN(a.errQtyPct,0)+'%':'—'}</td></tr>`).join('')}
    </table>`:'<div class="empty">لا توجد مقارنات بعد — ستظهر تلقائياً عند استيراد بيانات جديدة لاحقة لتوقعات محفوظة.</div>'}
  </div>`;
}

/* ---------- الإعدادات ---------- */
const DOW_NAMES=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function renderSettings(){
  return `
  <div class="card">
    <h2>أيام العطلة الأسبوعية</h2>
    <div class="row">${DOW_NAMES.map((n,i)=>`<label><input type="checkbox" data-dow="${i}" ${(SETTINGS.offDays||[]).includes(i)?'checked':''} onchange="toggleOffDay(${i},this.checked)"> ${n}</label>`).join('')}</div>
  </div>
  <div class="card">
    <h2>العطل الرسمية</h2>
    <div class="row"><input type="date" id="holDate"><input type="text" id="holDesc" placeholder="وصف العطلة"><button class="btn sm" onclick="addHoliday()">إضافة</button></div>
    <div class="pill-list">${(SETTINGS.holidays||[]).map((h,i)=>`<span class="pill">${fmtDate(h.date)} — ${esc(h.desc||'')}<button onclick="removeHoliday(${i})">×</button></span>`).join('')||'<span class="hint">لا توجد عطل مضافة</span>'}</div>
  </div>
  <div class="card">
    <h2>عتبات التنبيهات والمحرك</h2>
    <div class="row">
      <label>مهلة سماح قبل اعتباره متأخراً (يوم عمل)</label><input type="number" id="setGrace" value="${SETTINGS.grace}" style="width:60px">
      <label>مضاعف اعتبار "Missed" (× متوسط الفترة)</label><input type="number" step="0.1" id="setMissMult" value="${SETTINGS.graceMissedMult}" style="width:60px">
      <label>مهلة التوريد Lead Time (يوم عمل)</label><input type="number" id="setLead" value="${SETTINGS.leadTimeDays}" style="width:60px">
      <label>عتبة اعتبار الطلب "صاعد/هابط" %</label><input type="number" step="1" id="setGrowth" value="${SETTINGS.growthThreshold*100}" style="width:60px">
      <button class="btn sm" onclick="saveEngineSettings()">حفظ</button>
    </div>
  </div>
  <div class="card">
    <h2>1) كويري المسحوبات (معتمد ✅) — مصدر البيانات الأساسي</h2>
    <p class="hint">مستندات التسليم (Delivery Notes) مع تصنيف العميل وفئة الصنف مدمجين مباشرة بالنتيجة.</p>
    <textarea readonly style="min-height:220px">${esc(SAP_QUERY)}</textarea>
    <button class="btn ghost sm" onclick="copyQuery('SAP_QUERY')">نسخ الكويري</button>
  </div>
  <div class="card">
    <h2>2) كويري عروض الأسعار المفتوحة (معتمد ✅)</h2>
    <textarea readonly style="min-height:160px">${esc(QUOTE_QUERY)}</textarea>
    <button class="btn ghost sm" onclick="copyQuery('QUOTE_QUERY')">نسخ الكويري</button>
  </div>
  <div class="card">
    <h2>3) كويري الفواتير المحجوزة بانتظار تسليم (معتمد ✅)</h2>
    <textarea readonly style="min-height:280px">${esc(RESERVE_QUERY)}</textarea>
    <button class="btn ghost sm" onclick="copyQuery('RESERVE_QUERY')">نسخ الكويري</button>
  </div>`;
}
function toggleOffDay(dow,checked){
  const s=new Set(SETTINGS.offDays||[]);
  if(checked)s.add(dow);else s.delete(dow);
  SETTINGS.offDays=[...s];persistAll();recomputeAll(true);
}
function addHoliday(){
  const d=document.getElementById('holDate').value,desc=document.getElementById('holDesc').value;
  if(!d)return alert('اختر تاريخاً');
  SETTINGS.holidays=SETTINGS.holidays||[];SETTINGS.holidays.push({date:d,desc});
  persistAll();recomputeAll(true);
}
function removeHoliday(i){SETTINGS.holidays.splice(i,1);persistAll();recomputeAll(true)}
function saveEngineSettings(){
  SETTINGS.grace=+document.getElementById('setGrace').value||0;
  SETTINGS.graceMissedMult=+document.getElementById('setMissMult').value||1.5;
  SETTINGS.leadTimeDays=+document.getElementById('setLead').value||3;
  SETTINGS.growthThreshold=(+document.getElementById('setGrowth').value||15)/100;
  persistAll();recomputeAll(true);
}
const SAP_QUERY=`-- كويري المسحوبات المعتمد — مستندات تسليم + تصنيف العميل + فئة الصنف مدمجين
SELECT
  T0."CardCode"        AS "CustCode",
  T0."CardName"        AS "CustName",
  T1."ItemCode"        AS "ItemCode",
  T1."Dscription"      AS "ItemName",
  T0."DocDate"         AS "WDDate",
  DAYNAME(T0."DocDate") AS "DOW",
  T1."Quantity"        AS "Qty",
  T1."UomCode"         AS "UOM",
  T2."SlpName"         AS "Rep",
  T4."GroupName"       AS "CustCategory",
  T6."ItmsGrpNam"      AS "ItemCategory"
FROM ODLN T0
INNER JOIN DLN1 T1 ON T1."DocEntry" = T0."DocEntry"
LEFT JOIN OSLP T2 ON T2."SlpCode" = T0."SlpCode"
LEFT JOIN OCRD T3 ON T3."CardCode" = T0."CardCode"
LEFT JOIN OCRG T4 ON T4."GroupCode" = T3."GroupCode"
LEFT JOIN OITM T5 ON T5."ItemCode" = T1."ItemCode"
LEFT JOIN OITB T6 ON T6."ItmsGrpCod" = T5."ItmsGrpCod"
WHERE T0."DocDate" BETWEEN [%0] AND [%1]      -- بيسألك SAP B1 عن تاريخ البداية والنهاية كل ما تشغّل الكويري
  AND T0."CANCELED" = 'N'
ORDER BY T0."CardCode", T1."ItemCode", T0."DocDate";`;

const QUOTE_QUERY=`-- كويري عروض الأسعار المفتوحة المعتمد
SELECT
  T0."CardCode"   AS "CustCode",
  T0."CardName"   AS "CustName",
  T1."ItemCode"   AS "ItemCode",
  T1."Dscription" AS "ItemName",
  T0."DocDate"    AS "QuoteDate",
  T1."Quantity"   AS "Qty",
  T1."OpenQty"    AS "OpenQty",
  T2."SlpName"    AS "Rep"
FROM OQUT T0
INNER JOIN QUT1 T1 ON T1."DocEntry" = T0."DocEntry"
LEFT JOIN OSLP T2 ON T2."SlpCode" = T0."SlpCode"
WHERE T1."LineStatus" = 'O'
ORDER BY T0."CardCode", T1."ItemCode", T0."DocDate";`;

const RESERVE_QUERY=`-- كويري الفواتير المحجوزة بانتظار تسليم المعتمد (isIns='Y'، بعد خصم التسليم والمرتجع الجزئي)
SELECT
    I0."DocNum" AS "DocNum", I0."DocDate" AS "InvoiceDate",
    I0."CardCode" AS "CustCode", I0."CardName" AS "CustName",
    I1."ItemCode" AS "ItemCode", I1."Dscription" AS "ItemName",
    SUM(I1."Quantity") AS "TotalQty", SUM(I1."LineTotal") AS "TotalValue",
    IFNULL((SELECT SUM(D1."Quantity") FROM DLN1 D1 INNER JOIN ODLN D0 ON D0."DocEntry"=D1."DocEntry"
      WHERE D0."CANCELED"='N' AND D1."BaseType"=13 AND D1."BaseEntry"=I0."DocEntry" AND D1."ItemCode"=I1."ItemCode"),0) AS "DeliveredQty",
    IFNULL((SELECT SUM(R1."Quantity") FROM RIN1 R1 INNER JOIN ORIN R0 ON R0."DocEntry"=R1."DocEntry"
      WHERE R0."CancelDate" IS NULL AND R1."BaseType"=13 AND R1."BaseEntry"=I0."DocEntry" AND R1."ItemCode"=I1."ItemCode"),0) AS "ReturnedQty",
    SUM(I1."Quantity")
      - IFNULL((SELECT SUM(D1."Quantity") FROM DLN1 D1 INNER JOIN ODLN D0 ON D0."DocEntry"=D1."DocEntry"
          WHERE D0."CANCELED"='N' AND D1."BaseType"=13 AND D1."BaseEntry"=I0."DocEntry" AND D1."ItemCode"=I1."ItemCode"),0)
      - IFNULL((SELECT SUM(R1."Quantity") FROM RIN1 R1 INNER JOIN ORIN R0 ON R0."DocEntry"=R1."DocEntry"
          WHERE R0."CancelDate" IS NULL AND R1."BaseType"=13 AND R1."BaseEntry"=I0."DocEntry" AND R1."ItemCode"=I1."ItemCode"),0) AS "UndeliveredQty"
FROM OINV I0
INNER JOIN INV1 I1 ON I0."DocEntry"=I1."DocEntry"
WHERE I0."isIns"='Y'
  AND I0."DocDate" >= [%0]      -- بيسألك SAP B1 عن التاريخ كل ما تشغّل الكويري (اكتب مثلاً 2026-01-01)
GROUP BY I0."DocNum",I0."DocDate",I0."CardCode",I0."CardName",I1."ItemCode",I1."Dscription",I0."DocEntry"
HAVING SUM(I1."Quantity")
      - IFNULL((SELECT SUM(D1."Quantity") FROM DLN1 D1 INNER JOIN ODLN D0 ON D0."DocEntry"=D1."DocEntry"
          WHERE D0."CANCELED"='N' AND D1."BaseType"=13 AND D1."BaseEntry"=I0."DocEntry" AND D1."ItemCode"=I1."ItemCode"),0)
      - IFNULL((SELECT SUM(R1."Quantity") FROM RIN1 R1 INNER JOIN ORIN R0 ON R0."DocEntry"=R1."DocEntry"
          WHERE R0."CancelDate" IS NULL AND R1."BaseType"=13 AND R1."BaseEntry"=I0."DocEntry" AND R1."ItemCode"=I1."ItemCode"),0) > 0
  -- استبعاد أي سطر عليه مرتجع نهائياً (بدل خصمه فقط) لتفادي بيانات المرتجعات غير الموثوقة
  AND IFNULL((SELECT SUM(R1."Quantity") FROM RIN1 R1 INNER JOIN ORIN R0 ON R0."DocEntry"=R1."DocEntry"
          WHERE R0."CancelDate" IS NULL AND R1."BaseType"=13 AND R1."BaseEntry"=I0."DocEntry" AND R1."ItemCode"=I1."ItemCode"),0) = 0
ORDER BY I0."DocDate", I0."DocNum", I1."ItemCode";`;

function copyQuery(name){
  const text={SAP_QUERY,QUOTE_QUERY,RESERVE_QUERY}[name];
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);alert('تم نسخ الكويري');
}

/* ---------- نسخ احتياطي ---------- */
function backupJson(){
  const data={ROWS,STOCK,QUOTES,RESERVED,SETTINGS,FORECASTS,ACCURACY,ACTIONLOG,exportedAt:new Date().toISOString()};
  downloadFile('نسخة_احتياطية_نظام_التنبؤ.json',JSON.stringify(data),'application/json');
}
function restoreJson(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      ROWS=data.ROWS||[];STOCK=data.STOCK||[];QUOTES=data.QUOTES||[];RESERVED=data.RESERVED||[];SETTINGS=Object.assign(defaultSettings(),data.SETTINGS||{});
      FORECASTS=data.FORECASTS||{};ACCURACY=data.ACCURACY||[];ACTIONLOG=data.ACTIONLOG||[];
      ROWKEYS=new Set(ROWS.map(rowKey));
      persistAll();recomputeAll(false);render();
      alert('تمت الاستعادة بنجاح');
    }catch(e){alert('ملف غير صالح: '+e.message)}
  };
  r.readAsText(file);
}
function wireDynamic(){
  const fr=document.getElementById('fRestore');
  if(fr)fr.onchange=()=>{if(fr.files[0])restoreJson(fr.files[0])};
}
