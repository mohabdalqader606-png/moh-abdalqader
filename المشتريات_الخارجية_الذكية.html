<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المشتريات الخارجية الذكية — مركز قرار الشراء | الكيلاني للأغذية</title>
<!--
  هذه الشاشة تعمل بالكامل من طرف المتصفح: لا اتصال مباشر بقاعدة بيانات SAP.
  البيانات تُرفع يدوياً من "مركز البيانات" (نتيجة كويريهات SAP B1 HANA الجاهزة بالشاشة،
  تُنسخ من أداة الاستعلام أو تُصدَّر CSV/TSV ثم تُرفع كملف أو تُلصق مباشرة).
  التخزين محلي بالمتصفح عبر IndexedDB (قاعدة procurement_intel):
  كل مصدر بيانات بجدول (Object Store) مستقل، بدون أي بيانات فعلية مضمّنة داخل هذا الملف.
  البيانات التاريخية (2022-2025) تُقفل كـ Historical Baseline بعد أول استيراد ناجح؛
  أي استيراد لاحق لنفس الفترة أو لـ2026 يُعامَل كتحديث تزايدي (Incremental) بالاعتماد على
  المفتاح الفريد لكل مستند (DocEntry/DocNum أو ما يعادله) لمنع التكرار — وليس إعادة بناء كامل.
-->
<style>
  :root{
    --navy:#152A4A; --navy-deep:#0E1E36; --paper:#F4F6F9; --card:#FFFFFF; --line:#E1E6EE;
    --ink:#1B2536; --ink-soft:#5B667A; --ink-faint:#8894A8;
    --gold:#8A6416; --gold-bg:#FCEFD6;
    --teal:#1F7A6C; --teal-bg:#E7F5F1;
    --crimson:#B23A34; --crimson-bg:#FCEBEA;
    --violet:#5B4B9E; --violet-bg:#ECE8F7;
    --slate:#5B667A; --slate-bg:#EEF1F5;
    --mono:'IBM Plex Mono','Consolas',monospace; --disp:'Segoe UI',Tahoma,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--disp);}
  body{padding-bottom:60px;}
  a{color:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#C7D0DE;border-radius:6px;}

  /* ===== Topbar ===== */
  header.topbar{background:linear-gradient(135deg,var(--navy-deep),var(--navy) 70%); color:#fff; padding:20px 28px 0; position:relative; overflow:hidden;}
  header.topbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 46px); pointer-events:none;}
  .topbar-inner{position:relative; display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; padding-bottom:16px;}
  .eyebrow{font-size:11.5px; letter-spacing:.08em; color:#9FB0CC; margin-bottom:5px; font-weight:600;}
  h1{margin:0; font-size:21px; font-weight:700;}
  .sub{color:#B8C4DA; font-size:12px; margin-top:5px; max-width:620px; line-height:1.7;}
  .topbar-stats{display:flex; gap:22px; flex-wrap:wrap;}
  .topbar-stats div{text-align:center;}
  .topbar-stats b{display:block; font-family:var(--mono); font-size:19px;}
  .topbar-stats span{font-size:10px; color:#B8C4DA;}

  /* ===== Nav (هرمية العرض) ===== */
  nav.mainnav{position:relative; display:flex; gap:2px; overflow-x:auto; padding-top:2px;}
  nav.mainnav button{background:rgba(255,255,255,.06); color:#C7D3E8; border:none; border-bottom:3px solid transparent; padding:11px 16px; font-family:var(--disp); font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:7px; border-radius:8px 8px 0 0;}
  nav.mainnav button:hover{background:rgba(255,255,255,.12); color:#fff;}
  nav.mainnav button.active{background:var(--paper); color:var(--navy); border-bottom-color:var(--gold);}
  nav.mainnav button .cnt{background:rgba(255,255,255,.15); border-radius:10px; padding:1px 7px; font-size:10px; font-family:var(--mono);}
  nav.mainnav button.active .cnt{background:var(--crimson-bg); color:var(--crimson);}
  nav.mainnav button.crit .cnt{background:var(--crimson); color:#fff;}

  main{max-width:1520px; margin:0 auto; padding:0 22px 40px;}
  .view{display:none;}
  .view.active{display:block;}
  section.panel{background:var(--card); border:1px solid var(--line); border-radius:14px; margin-top:18px; box-shadow:0 10px 30px -20px rgba(21,42,74,.2); position:relative;}
  section.panel > .panel-head{padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  section.panel > .panel-head h2{margin:0; font-size:14.5px; display:flex; align-items:center; gap:8px;}
  section.panel > .panel-head .hint{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}

  /* ===== Global filter bar ===== */
  .filterbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 22px; background:#FAFBFD; border-bottom:1px solid var(--line); border-radius:14px 14px 0 0;}
  .filterbar .fld{display:flex; flex-direction:column; gap:2px;}
  .filterbar label{font-size:9.5px; color:var(--ink-faint); font-weight:700;}
  .filterbar select,.filterbar input{border:1.3px solid var(--line); border-radius:7px; padding:5px 8px; font-size:11.5px; font-family:var(--disp); background:#fff; min-width:108px;}
  .filterbar input[type=date]{font-family:var(--mono);}
  .filterbar .spacer{flex:1;}

  button{font-family:var(--disp); font-size:12.5px; font-weight:600; cursor:pointer; border-radius:9px; padding:8px 15px; border:none; transition:.15s;}
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-gold{background:var(--gold); color:#fff;}
  .btn-teal{background:var(--teal); color:#fff;}
  .btn-danger{background:var(--crimson); color:#fff;}
  .btn-ghost{background:#fff; color:var(--navy); border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-sm{padding:5px 11px; font-size:11px; border-radius:7px;}
  .btn-xs{padding:3px 8px; font-size:10px; border-radius:6px;}
  button:disabled{opacity:.45; cursor:not-allowed;}
  .status-msg{font-size:11.5px; color:var(--ink-soft);}
  .status-msg.err{color:var(--crimson);} .status-msg.ok{color:var(--teal);}

  /* ===== KPI strip ===== */
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px; padding:18px 22px;}
  .kpi{background:#FAFBFD; border:1px solid var(--line); border-radius:12px; padding:13px 15px; cursor:pointer;}
  .kpi:hover{border-color:var(--navy);}
  .kpi .lbl{font-size:10.5px; color:var(--ink-soft); margin-bottom:6px;}
  .kpi .val{font-family:var(--mono); font-size:22px; font-weight:700; color:var(--navy);}
  .kpi .sub2{font-size:10px; color:var(--ink-faint); margin-top:3px;}
  .kpi.crit .val{color:var(--crimson);} .kpi.warn .val{color:var(--gold);} .kpi.ok .val{color:var(--teal);} .kpi.info .val{color:var(--violet);}

  /* ===== Badges ===== */
  .badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:10.5px; font-weight:700; white-space:nowrap;}
  .badge.ok{background:var(--teal-bg); color:var(--teal);}
  .badge.crit{background:var(--crimson-bg); color:var(--crimson);}
  .badge.warn{background:var(--gold-bg); color:var(--gold);}
  .badge.gray{background:var(--slate-bg); color:var(--slate);}
  .badge.info{background:var(--violet-bg); color:var(--violet);}

  /* ===== Tables ===== */
  .tbl-scroll{overflow:auto; max-height:72vh; border:1px solid var(--line); border-radius:10px; margin:0 22px 18px;}
  table.datatbl{width:100%; border-collapse:collapse; font-size:11.5px;}
  table.datatbl th{background:#EEF2F8; color:var(--navy); text-align:right; padding:7px 9px; font-weight:700; font-size:10.5px; white-space:nowrap; border-bottom:1.5px solid var(--line); position:sticky; top:0; z-index:2;}
  table.datatbl td{padding:6px 9px; border-bottom:1px solid var(--line); white-space:nowrap;}
  table.datatbl tbody tr:hover{background:#FAFBFD;}
  table.datatbl .num{font-family:var(--mono); text-align:left; direction:ltr;}
  table.datatbl .freeze{position:sticky; z-index:1; box-shadow:1px 0 0 var(--line); background:#fff;}
  table.datatbl th.freeze{z-index:3; background:#EEF2F8;}
  table.datatbl tbody tr:hover td.freeze{background:#FAFBFD;}
  .sortable-th{cursor:pointer; user-select:none;}
  .sortable-th .sort-ic{display:inline-block; width:10px; opacity:.5; font-size:9px;}
  .sortable-th.sorted .sort-ic{opacity:1; color:var(--gold);}
  .qty-click{color:var(--navy); font-weight:700; text-decoration:underline dotted; cursor:pointer;}
  .qty-click:hover{color:var(--gold);}
  .qty-click.zero{color:var(--ink-faint); text-decoration:none; cursor:default; font-weight:400;}

  /* ===== Reason / explainability chain ===== */
  .reason-list{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:6px;}
  .reason-list li{background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:11.5px; display:flex; justify-content:space-between; gap:10px;}
  .reason-list li b{color:var(--navy);}
  .reason-list li span.v{font-family:var(--mono); direction:ltr;}
  .why-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .why-chip{background:var(--slate-bg); border:1px solid var(--line); border-radius:20px; padding:4px 11px; font-size:10.5px; color:var(--ink);}

  /* ===== Modal / Drawer ===== */
  .overlay{position:fixed; inset:0; background:rgba(14,30,54,.55); display:none; align-items:stretch; justify-content:flex-end; z-index:50;}
  .overlay.open{display:flex;}
  .drawer{background:#fff; width:min(880px,96vw); height:100%; overflow:auto; box-shadow:-14px 0 40px -12px rgba(0,0,0,.35); animation:slidein .18s ease;}
  @keyframes slidein{from{transform:translateX(-24px); opacity:0;} to{transform:translateX(0); opacity:1;}}
  .drawer-head{position:sticky; top:0; background:var(--navy); color:#fff; padding:16px 22px; display:flex; justify-content:space-between; align-items:center; z-index:2;}
  .drawer-head h3{margin:0; font-size:15px;}
  .drawer-head button{background:rgba(255,255,255,.12); color:#fff; border-radius:8px;}
  .drawer-body{padding:18px 22px 40px;}
  .modal-sm{max-width:560px; margin:auto;}
  .overlay.center{justify-content:center; align-items:center;}
  .overlay.center .drawer{width:min(560px,92vw); height:auto; max-height:88vh; border-radius:14px;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr;}}
  .stat-box{background:#FAFBFD; border:1px solid var(--line); border-radius:10px; padding:12px 14px;}
  .stat-box .lbl{font-size:10.5px; color:var(--ink-soft); margin-bottom:4px;}
  .stat-box .val{font-family:var(--mono); font-weight:700; font-size:16px; color:var(--navy);}

  /* ===== Data Center ===== */
  .dc-source-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; padding:18px 22px;}
  .dc-card{border:1px solid var(--line); border-radius:12px; padding:14px 16px; background:#fff; display:flex; flex-direction:column; gap:8px;}
  .dc-card-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .dc-card-title{font-weight:700; font-size:13px; color:var(--navy);}
  .dc-card-stats{display:flex; flex-wrap:wrap; gap:10px; font-size:10.5px; color:var(--ink-soft);}
  .dc-card-stats b{color:var(--ink); font-family:var(--mono);}
  .dc-card-actions{display:flex; gap:7px; flex-wrap:wrap; margin-top:2px;}
  .dc-score-box{display:flex; align-items:center; gap:14px; background:linear-gradient(135deg,#F8FAFD,#EEF2F8); border:1px solid var(--line); border-radius:14px; padding:16px 20px; margin:18px 22px 0;}
  .dc-score-num{width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:20px; font-weight:700; color:#fff; background:var(--navy); flex-shrink:0;}
  .dc-score-box.ok .dc-score-num{background:var(--teal);}
  .dc-score-box.warn .dc-score-num{background:var(--gold);}
  .dc-score-box.crit .dc-score-num{background:var(--crimson);}
  textarea.pastebox{width:100%; min-height:90px; resize:vertical; border:1.5px dashed #C4CEDD; border-radius:10px; background:#FAFBFD; padding:11px; font-family:var(--mono); font-size:11px; color:var(--ink); direction:ltr; text-align:left;}
  textarea.pastebox:focus{outline:none; border-color:var(--navy); background:#fff;}
  details.sqlbox summary{cursor:pointer; font-size:11.5px; color:var(--navy); font-weight:600; padding:3px 0;}
  code.sql{direction:ltr; display:block; background:#0E1E36; color:#CFE0FF; padding:12px 14px; border-radius:8px; margin-top:6px; font-size:10.8px; white-space:pre-wrap; font-family:var(--mono); line-height:1.6; overflow:auto; max-height:320px;}

  /* ===== Tabs (sub-views inside a panel, e.g. Recommendation Center) ===== */
  .subtabs{display:flex; gap:6px; padding:12px 22px 0; flex-wrap:wrap;}
  .subtabs button{background:#fff; color:var(--ink-soft); border:1.3px solid var(--line); border-radius:9px 9px 0 0; padding:8px 14px; font-size:11.5px; border-bottom:none;}
  .subtabs button.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  /* ===== Toast ===== */
  #toastHost{position:fixed; bottom:18px; left:18px; z-index:100; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--navy); color:#fff; padding:11px 18px; border-radius:9px; font-size:12.5px; box-shadow:0 8px 24px -8px rgba(0,0,0,.4); max-width:360px;}
  .toast.err{background:var(--crimson);} .toast.ok{background:var(--teal);}

  /* ===== Print ===== */
  @media print{
    header.topbar, nav.mainnav, .filterbar, .dc-card-actions, .subtabs, button, .no-print{display:none !important;}
    body{background:#fff; padding:0;}
    main{max-width:none; padding:0; margin:0;}
    section.panel{border:none; box-shadow:none; margin:0;}
    .tbl-scroll{max-height:none; overflow:visible; border:none;}
    .printhead{display:block !important; padding:0 0 12px; border-bottom:2px solid #152A4A; margin-bottom:14px;}
  }
  .printhead{display:none;}
  .printhead h2{margin:0 0 4px; font-size:16px; color:#152A4A;}
  .printhead .meta{font-size:11px; color:#555; display:flex; gap:18px; flex-wrap:wrap;}

  [hidden]{display:none !important;}
  .empty-state{padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:12.5px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div>
      <div class="eyebrow">مركز الكيلاني للأغذية · نظام دعم القرار</div>
      <h1>المشتريات الخارجية الذكية</h1>
      <div class="sub">لا يخبرك ماذا حدث فقط — يخبرك ماذا تطلب الآن، بكم، من أي مورد، ولماذا.</div>
    </div>
    <div class="topbar-stats" id="topbarStats">
      <div><b id="statOrderNow">—</b><span>اطلب الآن</span></div>
      <div><b id="statOrderSoon">—</b><span>اطلب قريباً</span></div>
      <div><b id="statStockoutRisk">—</b><span>خطر انقطاع</span></div>
      <div><b id="statDataHealth">—</b><span>صحة البيانات</span></div>
    </div>
  </div>
  <nav class="mainnav" id="mainNav">
    <button data-view="decisions" class="active">🎯 القرارات</button>
    <button data-view="risks">⚠️ المخاطر</button>
    <button data-view="plan">📦 خطة الشراء</button>
    <button data-view="demand">📈 تحليل الطلب</button>
    <button data-view="suppliers">🏭 تحليل الموردين</button>
    <button data-view="items">🔍 تفاصيل الأصناف</button>
    <button data-view="datacenter">🗄️ مركز البيانات</button>
  </nav>
</header>

<main>

  <!-- ============ فلاتر عامة (تؤثر على كل الشاشات) ============ -->
  <section class="panel" style="margin-top:16px;">
    <div class="filterbar" id="globalFilterBar"></div>
  </section>

  <!-- ============ 1) القرارات ============ -->
  <section class="view active" id="view-decisions" data-view="decisions"></section>

  <!-- ============ 2) المخاطر ============ -->
  <section class="view" id="view-risks" data-view="risks"></section>

  <!-- ============ 3) خطة الشراء ============ -->
  <section class="view" id="view-plan" data-view="plan"></section>

  <!-- ============ 4) تحليل الطلب ============ -->
  <section class="view" id="view-demand" data-view="demand"></section>

  <!-- ============ 5) تحليل الموردين ============ -->
  <section class="view" id="view-suppliers" data-view="suppliers"></section>

  <!-- ============ 6) تفاصيل الأصناف ============ -->
  <section class="view" id="view-items" data-view="items"></section>

  <!-- ============ 7) مركز البيانات ============ -->
  <section class="view" id="view-datacenter" data-view="datacenter"></section>

</main>

<!-- ============ Overlays: Drill-down / Item Detail / Supplier Detail / Explainability ============ -->
<div class="overlay" id="drawerOverlay" onclick="if(event.target===this) closeDrawer()">
  <div class="drawer" id="drawerBox"></div>
</div>
<div class="overlay center" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="drawer modal-sm" id="modalBox"></div>
</div>

<div id="toastHost"></div>

<script>
'use strict';
/* ==========================================================================================
   0) CONFIG — كل الثوابت وقواعد العمل بمكان واحد (Business Rules ثابتة، وليست موزّعة بالكود)
   ========================================================================================== */
const CONFIG = {
  dbName: 'kfc_foreign_procurement_v1',
  dbVersion: 1,

  // قواعد المستودعات الخاصة (ثابتة حسب طلب المستخدم — قسم 9)
  warehouseRules: {
    '004': { label:'تالف/معطوب', excludeFromAvailable:true, includeInSalesDemand:false },
    '100': { label:'تالف/معطوب', excludeFromAvailable:true, includeInSalesDemand:false },
    '006': { label:'تالف/معطوب', excludeFromAvailable:true, includeInSalesDemand:false },
    '011': { label:'مبيعات عسكرية (المؤسسة الاستهلاكية العسكرية)', excludeFromAvailable:true, includeInSalesDemand:true },
    '003': { label:'عينات مُصدَرة للعملاء', excludeFromAvailable:true, includeInSalesDemand:false },
    '005': { label:'فروقات جرد', excludeFromAvailable:true, includeInSalesDemand:false },
    '008': { label:'فروقات استلام', excludeFromAvailable:true, includeInSalesDemand:false },
  },

  // إعدادات قابلة للتعديل من "مركز البيانات ▸ إعدادات المحرك"
  tunable: {
    expiryNearDays: 30,        // "قريب الانتهاء" خلال كم يوم
    expiryMidDays: 90,         // "متوسط الخطورة" خلال كم يوم
    quotationWeight: 0.30,     // وزن عروض الأسعار (Potential Demand) بحساب الطلب — 0 تجاهل، 1 معاملتها كمؤكدة
    outlierLowRatio: 0.35,     // شهر أقل من (الوسيط × هذه النسبة) = مرشّح لانقطاع/شذوذ
    outlierHighRatio: 2.60,    // شهر أعلى من (الوسيط × هذه النسبة) = مرشّح لطلب استثنائي/تخزين عميل
    defaultLeadTimeDays: 30,   // Lead Time افتراضي إذا لم يتوفر بجدول الموردين
    serviceBufferDays: 7,      // أيام أمان تُضاف فوق مدة التوريد بحساب نقطة إعادة الطلب
    minCoverageDaysCritical: 7,
    minCoverageDaysSoon: 21,
    overstockCoverageMonths: 6,     // تغطية أكثر من كذا شهر = فائض مخزون
    deadStockMonthsNoSale: 6,       // بدون أي بيع خلال كذا شهر ومعه مخزون = راكد تماماً
    slowStockCoverageMonths: 3,     // تغطية أكثر من كذا شهر (وأقل من overstock) مع بيع نادر = بطيء الحركة
  },

  // فترات تاريخية = Baseline مقفلة بعد أول استيراد ناجح (قسم 2)
  historicalYears: [2022, 2023, 2024, 2025],
  currentYear: 2026,

  version: '1.0.0',
};

/* ==========================================================================================
   1) DATA SOURCES — مصدر واحد لكل نوع بيانات: الأعمدة + مفتاح التكرار + كويري SAP HANA المقترح
   ========================================================================================== */
const DATA_SOURCES = {

  salesInvoices: {
    label: 'فواتير المبيعات (Sales Invoices)',
    store: 'salesInvoices',
    keyFields: ['DocEntry','LineNum'],
    dateField: 'DocDate',
    columns: [
      {key:'DocEntry', label:'DocEntry', aliases:['رقم المستند','DocEntry'], type:'text', required:true},
      {key:'DocNum', label:'رقم الفاتورة', aliases:['DocNum','رقم الفاتورة'], type:'text', required:false},

   2) UTILITIES
   ========================================================================================== */
const U = {
  toast(msg, type){
    const host = document.getElementById('toastHost');
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' '+type : '');
    el.textContent = msg;
    host.appendChild(el);
    setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 320); }, 3600);
  },
  esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  num(n, dp){ n = Number(n)||0; return n.toLocaleString('en-US', {minimumFractionDigits:dp||0, maximumFractionDigits:dp==null?2:dp}); },
  parseDate(v){
    if(v==null || v==='') return null;
    if(v instanceof Date) return isNaN(v)?null:v;
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m) return new Date(+m[1], +m[2]-1, +m[3]);
    m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if(m) return new Date(+m[3], +m[2]-1, +m[1]);
    const d = new Date(s);
    return isNaN(d) ? null : d;
  },
  fmtDateTime(ts){
    if(!ts) return '—';
    const d = new Date(ts);
    const p = n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  },
  fmtDate(d){
    if(!d) return '—';
    if(!(d instanceof Date)) d = U.parseDate(d);
    if(!d) return '—';
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  },
  monthKey(d){ if(!(d instanceof Date)) d = U.parseDate(d); if(!d) return null; return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); },
  daysBetween(a,b){ return Math.round((b-a)/86400000); },
  addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; },
  median(arr){
    if(!arr.length) return 0;
    const s = arr.slice().sort((a,b)=>a-b);
    const mid = Math.floor(s.length/2);
    return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
  },
  mode(arr){
    if(!arr.length) return null;
    const cnt = new Map();
    arr.forEach(v=>cnt.set(v,(cnt.get(v)||0)+1));
    let best=arr[0], bestN=0;
    cnt.forEach((n,v)=>{ if(n>bestN){ bestN=n; best=v; } });
    return best;
  },
  uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); },
  debounce(fn, ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a), ms||300); }; },
  normHeader(s){ return String(s||'').trim().replace(/\s+/g,' ').toLowerCase(); },
};

/* ==========================================================================================
   3) INDEXEDDB DATA LAYER
   ========================================================================================== */
const DB = {
  _db: null,
  async open(){
    if(this._db) return this._db;
    this._db = await new Promise((resolve, reject)=>{
      const req = indexedDB.open(CONFIG.dbName, CONFIG.dbVersion);
      req.onupgradeneeded = (ev)=>{
        const db = ev.target.result;
        Object.keys(DATA_SOURCES).forEach(srcKey=>{
          const src = DATA_SOURCES[srcKey];
          if(!db.objectStoreNames.contains(src.store)){
            const os = db.createObjectStore(src.store, {keyPath:'_key'});
            os.createIndex('ItemCode', 'ItemCode', {unique:false});
            if(src.dateField) os.createIndex('_date', '_dateIdx', {unique:false});
            os.createIndex('_batchId', '_batchId', {unique:false});
          }
        });
        if(!db.objectStoreNames.contains('importLog')) db.createObjectStore('importLog', {keyPath:'id'});
        if(!db.objectStoreNames.contains('planOverrides')) db.createObjectStore('planOverrides', {keyPath:'ItemCode'});
        if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', {keyPath:'k'});
      };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
    return this._db;
  },
  async tx(storeNames, mode){
    const db = await this.open();
    return db.transaction(storeNames, mode||'readonly');
  },
  async getAll(store){
    const t = await this.tx(store, 'readonly');
    return new Promise((res,rej)=>{
      const r = t.objectStore(store).getAll();
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>rej(r.error);
    });
  },
  async bulkPut(store, rows){
    const t = await this.tx(store, 'readwrite');
    return new Promise((res,rej)=>{
      const os = t.objectStore(store);
      rows.forEach(r=>os.put(r));
      t.oncomplete = ()=>res(true);
      t.onerror = ()=>rej(t.error);
    });
  },
  async bulkDelete(store, keys){
    const t = await this.tx(store, 'readwrite');
    return new Promise((res,rej)=>{
      const os = t.objectStore(store);
      keys.forEach(k=>os.delete(k));
      t.oncomplete = ()=>res(true);
      t.onerror = ()=>rej(t.error);
    });
  },
  async clearStore(store){
    const t = await this.tx(store, 'readwrite');
    return new Promise((res,rej)=>{ const r=t.objectStore(store).clear(); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error); });
  },
  async getMeta(key, dflt){
    const t = await this.tx('meta','readonly');
    return new Promise((res)=>{
      const r = t.objectStore('meta').get(key);
      r.onsuccess = ()=>res(r.result ? r.result.v : dflt);
      r.onerror = ()=>res(dflt);
    });
  },
  async setMeta(key, val){
    const t = await this.tx('meta','readwrite');
    return new Promise((res,rej)=>{ t.objectStore('meta').put({k:key, v:val}); t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error); });
  },
};

/* ذاكرة تخزين مؤقتة بالمتصفح لكل المصادر بعد التحميل — لتفادي قراءة IndexedDB بكل تفاعل صغير */
const STATE = {
  data: {},        // STATE.data[storeKey] = [rows...]
  loaded: false,
  filters: {},

/* ==========================================================================================
   4) IMPORT PIPELINE — Parse / Validate / Preview / Duplicate Detection / Commit / Rollback
   ========================================================================================== */
const IMPORT = {

  parseDelimited(text){
    text = String(text||'').replace(/\r\n?/g,'\n').trim();
    if(!text) return {headers:[], rows:[]};
    const lines = text.split('\n').filter(l=>l.length);
    const first = lines[0];
    const delim = (first.split('\t').length >= first.split(',').length) ? '\t' : ',';
    const splitLine = (l)=>{
      if(delim === '\t') return l.split('\t');
      // فاصلة مع احترام الاقتباس "..."
      const out=[]; let cur=''; let inQ=false;
      for(let i=0;i<l.length;i++){
        const c=l[i];
        if(c === '"'){ inQ = !inQ; continue; }
        if(c === ',' && !inQ){ out.push(cur); cur=''; continue; }
        cur += c;
      }
      out.push(cur);
      return out;
    };
    const headers = splitLine(lines[0]).map(h=>h.trim());
    const rows = lines.slice(1).filter(l=>l.trim()).map(l=>splitLine(l));
    return {headers, rows};
  },

  buildHeaderMap(sourceKey, headers){
    const src = DATA_SOURCES[sourceKey];
    const map = {}; // columnIndex -> col.key
    const normed = headers.map(U.normHeader);
    src.columns.forEach(col=>{
      const names = [col.key, col.label, ...(col.aliases||[])].map(U.normHeader);
      let idx = normed.findIndex(h=>names.includes(h));
      if(idx === -1){
        // مطابقة جزئية كحل أخير
        idx = normed.findIndex(h=>names.some(n=>h.includes(n)||n.includes(h)));
      }
      if(idx !== -1) map[idx] = col.key;
    });
    return map;
  },

  buildKey(sourceKey, row){
    const src = DATA_SOURCES[sourceKey];
    return src.keyFields.map(f=>String(row[f]==null?'':row[f]).trim()).join('|');
  },

  mapRows(sourceKey, text){
    const src = DATA_SOURCES[sourceKey];
    const {headers, rows} = this.parseDelimited(text);
    if(!headers.length) return {mapped:[], errors:[{row:0, msg:'لا يوجد بيانات'}], headerMap:{}, unmatched:[]};
    const headerMap = this.buildHeaderMap(sourceKey, headers);
    const matchedCols = new Set(Object.values(headerMap));
    const unmatched = src.columns.filter(c=>c.required && !matchedCols.has(c.key));
    const errors = [];
    const seenKeys = new Set();
    const mapped = [];
    rows.forEach((cells, rIdx)=>{
      const row = {};
      Object.keys(headerMap).forEach(idx=>{ row[headerMap[idx]] = cells[idx]!==undefined ? cells[idx].trim() : ''; });
      const rowErrors = [];
      src.columns.forEach(col=>{
        let v = row[col.key];
        if(col.required && (v===undefined || v==='')){ rowErrors.push(col.label+' مفقود'); return; }
        if(v===undefined || v==='') return;
        if(col.type === 'number'){
          const n = Number(String(v).replace(/,/g,''));
          if(isNaN(n)){ rowErrors.push(col.label+' غير رقمي: "'+v+'"'); }
          else {
            row[col.key] = n;
            if(n < 0 && /qty|quantity|كمية/i.test(col.key+col.label)) rowErrors.push(col.label+' سالبة ('+n+')');
          }
        } else if(col.type === 'date'){
          const d = U.parseDate(v);
          if(!d){ rowErrors.push(col.label+' تاريخ غير صالح: "'+v+'"'); }
          else row[col.key] = d;
        }
      });
      if(!rowErrors.length){
        const key = this.buildKey(sourceKey, row);
        if(seenKeys.has(key)) rowErrors.push('سطر مكرر داخل نفس الملف (مفتاح: '+key+')');
        seenKeys.add(key);
        row._key = key;
        if(src.dateField && row[src.dateField] instanceof Date) row._dateIdx = row[src.dateField].getTime();
      }
      if(rowErrors.length) errors.push({row:rIdx+2, msg:rowErrors.join('، ')});
      else mapped.push(row);
    });
    return {mapped, errors, headerMap, unmatched, totalRows:rows.length};
  },

  async preview(sourceKey, mapped){
    const src = DATA_SOURCES[sourceKey];
    const existing = await DB.getAll(src.store);
    const existingMap = new Map(existing.map(r=>[r._key, r]));
    let toAdd=0, toUpdate=0, unchanged=0;
    const historicalLocked = await DB.getMeta('historicalLocked', false);
    const lockedRowsTouched = [];
    mapped.forEach(row=>{
      const prev = existingMap.get(row._key);
      if(!prev) toAdd++;
      else{
        const changed = src.columns.some(c=>String(prev[c.key]??'') !== String(row[c.key]??''));
        if(changed) toUpdate++; else unchanged++;
      }
      if(historicalLocked && src.dateField && row[src.dateField] instanceof Date){
        const y = row[src.dateField].getFullYear();
        if(CONFIG.historicalYears.includes(y)) lockedRowsTouched.push(row);
      }
    });
    return {toAdd, toUpdate, unchanged, total:mapped.length, historicalLocked, lockedRowsTouched: lockedRowsTouched.length};
  },

  async commit(sourceKey, mapped, opts){
    opts = opts || {};
    const src = DATA_SOURCES[sourceKey];
    const existing = await DB.getAll(src.store);
    const existingMap = new Map(existing.map(r=>[r._key, r]));
    const batchId = U.uid();
    const added = [];
    const updatedBefore = []; // للتراجع: القيمة قبل التحديث
    const toWrite = [];
    mapped.forEach(row=>{
      const prev = existingMap.get(row._key);
      const rec = Object.assign({}, row, {_batchId: prev ? (prev._batchId) : batchId, _importBatch: batchId});
      if(!prev){ added.push(row._key); }
      else { updatedBefore.push(prev); }
      toWrite.push(rec);
    });
    await DB.bulkPut(src.store, toWrite);
    STATE.data[sourceKey] = await DB.getAll(src.store);
    const logEntry = {
      id: batchId, source: sourceKey, ts: Date.now(),
      addedKeys: added, updatedBefore, recordCount: mapped.length,
      mode: opts.mode || 'incremental',
    };
    const t = await DB.tx('importLog','readwrite');
    await new Promise((res,rej)=>{ t.objectStore('importLog').put(logEntry); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); });
    await DB.setMeta('lastImport_'+sourceKey, {ts: Date.now(), count: mapped.length, batchId});
    return {batchId, added: added.length, updated: updatedBefore.length};
  },

  async lastImportLogFor(sourceKey){
    const all = await DB.getAll('importLog');
    const mine = all.filter(l=>l.source===sourceKey).sort((a,b)=>b.ts-a.ts);
    return mine[0] || null;
  },

  async rollback(sourceKey){
    const log = await this.lastImportLogFor(sourceKey);
    if(!log) return {ok:false, msg:'لا يوجد استيراد سابق للتراجع عنه'};
    const src = DATA_SOURCES[sourceKey];
    await DB.bulkDelete(src.store, log.addedKeys);
    if(log.updatedBefore && log.updatedBefore.length) await DB.bulkPut(src.store, log.updatedBefore);
    const t = await DB.tx('importLog','readwrite');
    await new Promise((res,rej)=>{ t.objectStore('importLog').delete(log.id); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); });
    STATE.data[sourceKey] = await DB.getAll(src.store);
    return {ok:true, removed: log.addedKeys.length, restored: log.updatedBefore.length};
  },
};

/* ==========================================================================================
   5) DATA HEALTH
   ========================================================================================== */
const HEALTH = {
  async scoreSource(sourceKey){
    const src = DATA_SOURCES[sourceKey];
    const rows = STATE.data[sourceKey] || [];
    if(!rows.length) return {score:0, count:0, lastUpdate:null, coverage:null, issues:['لا توجد بيانات مرفوعة']};
    const requiredCols = src.columns.filter(c=>c.required);
    let filled = 0, total = 0;
    rows.forEach(r=>{ requiredCols.forEach(c=>{ total++; if(r[c.key]!==undefined && r[c.key]!==null && r[c.key]!=='') filled++; }); });
    const completeness = total ? filled/total : 1;
    let coverage = null;
    if(src.dateField){
      const dates = rows.map(r=>r[src.dateField]).filter(d=>d instanceof Date);
      if(dates.length){
        const min = new Date(Math.min(...dates)), max = new Date(Math.max(...dates));
        coverage = {min, max};
      }
    }
    const lastImp = await DB.getMeta('lastImport_'+sourceKey, null);
    const issues = [];
    if(completeness < 1) issues.push('حقول إلزامية ناقصة ببعض السطور ('+Math.round((1-completeness)*100)+'%)');
    const score = Math.round(completeness*100);
    return {score, count:rows.length, lastUpdate: lastImp?lastImp.ts:null, coverage, issues};
  },
  async overallScore(){
    const keys = Object.keys(DATA_SOURCES);
    const coreKeys = ['salesInvoices','purchaseInvoices','inventory','suppliers'];
    const scores = await Promise.all(keys.map(k=>this.scoreSource(k)));
    const byKey = {}; keys.forEach((k,i)=>byKey[k]=scores[i]);
    const coreScores = coreKeys.map(k=>byKey[k].count? byKey[k].score : 0);
    const overall = Math.round(coreScores.reduce((a,b)=>a+b,0)/coreScores.length);
    return {overall, byKey};
  },
};

async function confirmImport(){
  if(!_dcPendingImport) return;
  const {sourceKey, mapped} = _dcPendingImport;
  const prev = await IMPORT.preview(sourceKey, mapped);
  let rows = mapped;
  if(prev.historicalLocked){
    const src = DATA_SOURCES[sourceKey];
    if(src.dateField) rows = mapped.filter(r=>{
      const d = r[src.dateField];
      return !(d instanceof Date) || !CONFIG.historicalYears.includes(d.getFullYear());
    });
  }
  const mode = CONFIG.historicalYears.includes(new Date().getFullYear()) ? 'incremental' : 'incremental';
  const res = await IMPORT.commit(sourceKey, rows, {mode});
  U.toast(`تم الاستيراد: ${res.added} سطر جديد، ${res.updated} سطر محدَّث`, 'ok');
  closeModal();
  await refreshSourceStats(sourceKey);
  await renderDcHealthHero();
  await renderDcImportLog();
  if(window.onDataChanged) window.onDataChanged();
}

async function rollbackImport(sourceKey){
  const log = await IMPORT.lastImportLogFor(sourceKey);
  if(!log){ U.toast('لا يوجد استيراد سابق لهذا المصدر', 'err'); return; }
  if(!confirm(`التراجع عن آخر استيراد لـ"${DATA_SOURCES[sourceKey].label}" (${U.fmtDateTime(log.ts)}, ${log.recordCount} سطر). متابعة؟`)) return;
  const res = await IMPORT.rollback(sourceKey);
  if(res.ok){ U.toast(`تم التراجع: حُذف ${res.removed}، استُعيد ${res.restored}`, 'ok'); await refreshSourceStats(sourceKey); await renderDcHealthHero(); await renderDcImportLog(); if(window.onDataChanged) window.onDataChanged(); }

}

/* ==========================================================================================
   8) SALES ENGINE — صافي المبيعات (فواتير - مرتجعات) بدون ازدواجية، بدون احتساب المُلغى
   ========================================================================================== */
const SALES = {
  _norm(r, sign){
    return {
      ItemCode:r.ItemCode, ItemName:r.ItemName||'', date:(r.DocDate instanceof Date?r.DocDate:null),
      WhsCode:r.WhsCode||'', CardCode:r.CardCode||'', CardName:r.CardName||r.CardCode||'', SlpName:r.SlpName||'',
      qty:(Number(r.Quantity)||0)*sign, amount:(Number(r.LineTotal)||0)*sign,
    };
  },
  buildNetLines(){
    const inv = (STATE.data.salesInvoices||[]).filter(r=>String(r.Canceled||'N').toUpperCase()!=='Y');
    const ret = (STATE.data.salesReturns||[]).filter(r=>String(r.Canceled||'N').toUpperCase()!=='Y');
    const lines = inv.map(r=>this._norm(r,+1)).concat(ret.map(r=>this._norm(r,-1)));
    return lines;
  },
  filteredLines(opts){
    opts = opts || {};
    return this.buildNetLines().filter(l=>{
      if(!matchesTxFilters(l, {dateField: opts.ignoreDateFilter ? undefined : 'date'})) return false;
      if(opts.demandOnly){
        const rule = CONFIG.warehouseRules[l.WhsCode];
        if(rule && !rule.includeInSalesDemand) return false;
      }
      return true;
    });
  },
};

/** يحدد المورد "الغالب" لصنف اعتماداً على نمط الشراء الفعلي التاريخي (وليس حقلاً ثابتاً) */
function resolveSupplierForItem(itemCode){
  const rows = (STATE.data.purchaseInvoices||[]).filter(r=>r.ItemCode===itemCode && r.SupplierCode);
  if(rows.length){
    const counts = new Map();
    rows.forEach(r=>counts.set(r.SupplierCode, (counts.get(r.SupplierCode)||0) + (Number(r.Quantity)||0)));
    let best=null, bestQty=-1;
    counts.forEach((q,code)=>{ if(q>bestQty){ bestQty=q; best=code; } });
    const nameRow = rows.find(r=>r.SupplierCode===best);
    return {code:best, name: (nameRow&&nameRow.SupplierName) || supplierName(best) || best};
  }
  const map = (STATE.data.itemSupplierMap||[]).find(r=>r.ItemCode===itemCode && String(r.IsPreferred||'').toUpperCase()==='Y');
  if(map) return {code:map.SupplierCode, name: supplierName(map.SupplierCode) || map.SupplierCode};
  return {code:null, name:'—'};
}
function supplierName(code){
  if(!code) return null;
  const s = (STATE.data.suppliers||[]).find(r=>r.SupplierCode===code);
  return s ? s.SupplierName : null;
}
function itemGroupOf(itemCode){
  const it = (STATE.data.items||[]).find(r=>r.ItemCode===itemCode);
  return it ? it.ItemGroup : null;
}

/* ===== نطاق التاريخ الفعّال + المدة الحقيقية بالأيام (قسم 4) ===== */
function getActiveDateRange(){
  const f = STATE.filters;
  let to = f.dateTo ? new Date(f.dateTo) : null;
  let from = f.dateFrom ? new Date(f.dateFrom) : null;
  if(!to || !from){
    const dates = SALES.buildNetLines().map(l=>l.date).filter(d=>d instanceof Date);
    const maxD = dates.length ? new Date(Math.max(...dates)) : new Date();
    if(!to) to = maxD;
    if(!from) from = new Date(to.getFullYear(), to.getMonth()-11, 1);
  }
  return {from, to};
}
function monthsInRange(from, to){
  const months = [];
  let cur = new Date(from.getFullYear(), from.getMonth(), 1);
  const end = new Date(to.getFullYear(), to.getMonth(), 1);
  let guard=0;
  while(cur <= end && guard++ < 240){
    months.push(U.monthKey(cur));
    cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
  }
  return months;
}
function periodEquivalentMonths(from, to){
  const days = U.daysBetween(from, to) + 1;
  return {days, months: days>0 ? days/30.4368 : 1};
}
function monthLabel(mk){
  const [y,m] = mk.split('-');
  const names=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return names[+m-1]+' '+y;
}

/** يبني تقرير المبيعات الشهري: Item -> {monthly:Map(monthKey->{qty,amount}), rawAvgQty (بالأيام الفعلية)} */
function buildSalesReport(){
  const {from, to} = getActiveDateRange();
  const months = monthsInRange(from, to);
  const toEnd = new Date(to.getFullYear(), to.getMonth(), to.getDate(), 23,59,59);
  const lines = SALES.filteredLines().filter(l=> l.date instanceof Date && l.date>=from && l.date<=toEnd);
  const byItem = new Map();
  lines.forEach(l=>{
    if(!byItem.has(l.ItemCode)) byItem.set(l.ItemCode, {ItemCode:l.ItemCode, ItemName:l.ItemName||l.ItemCode, monthly:new Map(), totalQty:0, totalAmount:0});
    const it = byItem.get(l.ItemCode);
    if(l.ItemName && (!it.ItemName || it.ItemName===it.ItemCode)) it.ItemName = l.ItemName;
    const mk = U.monthKey(l.date);
    if(!it.monthly.has(mk)) it.monthly.set(mk, {qty:0, amount:0});
    const cell = it.monthly.get(mk);
    cell.qty += l.qty; cell.amount += l.amount;
    it.totalQty += l.qty; it.totalAmount += l.amount;
  });
  const {days, months:equivMonths} = periodEquivalentMonths(from, to);
  let rows = Array.from(byItem.values()).map(it=>{
    it.supplier = resolveSupplierForItem(it.ItemCode);
    it.rawAvgQty = equivMonths>0 ? it.totalQty/equivMonths : 0;
    it.rawAvgAmount = equivMonths>0 ? it.totalAmount/equivMonths : 0;
    return it;
  });
  const f = STATE.filters;
  if(f.itemGroup) rows = rows.filter(r=>itemGroupOf(r.ItemCode)===f.itemGroup);
  if(f.supplier) rows = rows.filter(r=>r.supplier.code===f.supplier);
  return {from, to, months, days, equivMonths, rows};
}

/* ==========================================================================================
   9) SORTABLE TABLE HELPER (عام لكل جداول الشاشة)
   ========================================================================================== */
const SORT_STATE = {};
function toggleSort(tableKey, col, defaultDir){
  const s = SORT_STATE[tableKey] || {col:null, dir:'desc'};
  if(s.col===col) s.dir = (s.dir==='asc'?'desc':'asc'); else { s.col=col; s.dir=defaultDir||'desc'; }
  SORT_STATE[tableKey] = s;
}
function sortIcon(tableKey, col){
  const s = SORT_STATE[tableKey];
  if(!s || s.col!==col) return '<span class="sort-ic">↕</span>';
  return `<span class="sort-ic">${s.dir==='asc'?'↑':'↓'}</span>`;
}
function applySort(tableKey, rows, getter){
  const s = SORT_STATE[tableKey];
  if(!s || !s.col) return rows;
  const dir = s.dir==='asc' ? 1 : -1;
  return rows.slice().sort((a,b)=>{
    const va = getter(a, s.col), vb = getter(b, s.col);
    if(typeof va === 'string' || typeof vb === 'string') return dir * String(va??'').localeCompare(String(vb??''), 'ar');
    return dir * ((va||0) - (vb||0));
  });
}

function renderDemandTable(){
  const rep = buildSalesReport();
  document.getElementById('demandPeriodHint').textContent =
    `الفترة: ${U.fmtDate(rep.from)} → ${U.fmtDate(rep.to)}  (${rep.days} يوم ≈ ${rep.equivMonths.toFixed(2)} شهر فعلي) — عدد الأصناف: ${rep.rows.length}`;
  const rows = applySort('demand', rep.rows, (r,col)=>{
    if(col==='ItemCode') return r.ItemCode;
    if(col==='ItemName') return r.ItemName;
    if(col==='Supplier') return r.supplier.name;
    if(col==='avg') return r.rawAvgQty;
    if(col.startsWith('m:')) return (r.monthly.get(col.slice(2))||{qty:0}).qty;
    return 0;
  });
  const mode = STATE.reportMode;
  const showQty = mode==='qty'||mode==='both', showAmt = mode==='amount'||mode==='both';
  const monthHeaders = rep.months.map(mk=>`<th class="sortable-th" onclick="toggleSort('demand','m:${mk}');renderDemandTable();">${monthLabel(mk)} ${sortIcon('demand','m:'+mk)}</th>`).join('');
  const head = `
    <tr>
      <th class="freeze freeze-1 sortable-th" onclick="toggleSort('demand','ItemCode');renderDemandTable();">رمز الصنف ${sortIcon('demand','ItemCode')}</th>
      <th class="sortable-th" onclick="toggleSort('demand','ItemName');renderDemandTable();">اسم الصنف ${sortIcon('demand','ItemName')}</th>
      <th class="sortable-th" onclick="toggleSort('demand','Supplier');renderDemandTable();">المورد ${sortIcon('demand','Supplier')}</th>
      ${monthHeaders}
      <th class="sortable-th" onclick="toggleSort('demand','avg');renderDemandTable();">المتوسط/شهر ${sortIcon('demand','avg')}</th>
    </tr>`;
  const body = rows.map(r=>{
    const cells = rep.months.map(mk=>{
      const c = r.monthly.get(mk) || {qty:0, amount:0};
      const qtyTxt = c.qty ? `<span class="qty-click" onclick="openCustomerDrilldown('${r.ItemCode}','${mk}')">${U.num(c.qty)}</span>` : `<span class="qty-click zero">0</span>`;
      if(mode==='qty') return `<td class="num">${qtyTxt}</td>`;
      if(mode==='amount') return `<td class="num">${U.num(c.amount)}</td>`;
      return `<td class="num">${qtyTxt}<div style="font-size:9.5px;color:var(--ink-faint)">${U.num(c.amount)}</div></td>`;
    }).join('');
    const avgTxt = showQty ? U.num(r.rawAvgQty,1) : '';
    const avgAmtTxt = showAmt ? U.num(r.rawAvgAmount,1) : '';
    return `<tr>
      <td class="num freeze freeze-1">${U.esc(r.ItemCode)}</td>
      <td>${U.esc(r.ItemName)}</td>
      <td>${U.esc(r.supplier.name)}</td>
      ${cells}
      <td class="num" style="font-weight:700;">${avgTxt}${mode==='both'?`<div style="font-size:9.5px;color:var(--ink-faint)">${avgAmtTxt}</div>`:''}${mode==='amount'?avgAmtTxt:''}</td>
    </tr>`;
  }).join('');
  document.getElementById('demandTableHost').innerHTML = rows.length
    ? `<div class="tbl-scroll"><table class="datatbl"><thead>${head}</thead><tbody>${body}</tbody></table></div>`
    : `<div class="empty-state">لا توجد بيانات مبيعات بالفترة/الفلاتر الحالية — ارفع فواتير المبيعات من "مركز البيانات"</div>`;
}

function openCustomerDrilldown(itemCode, monthKey){

  let totalQty=0, totalAmt=0;

    const key = l.CardCode || l.CardName || '—';
    if(!byCust.has(key)) byCust.set(key, {code:l.CardCode, name:l.CardName||key, qty:0, amount:0});
    const c = byCust.get(key); c.qty += l.qty; c.amount += l.amount; totalQty += l.qty; totalAmt += l.amount;
  });
  const rows = Array.from(byCust.values()).filter(c=>c.qty!==0).sort((a,b)=>b.qty-a.qty);

        <div class="stat-box"><div class="lbl">إجمالي المبلغ</div><div class="val">${U.num(totalAmt)}</div></div>

      <div class="printhead"><h2>تفصيل العملاء — ${U.esc(itemName)}</h2><div class="meta"><span>الشهر: ${monthLabel(monthKey)}</span><span>تاريخ الطباعة: ${U.fmtDate(new Date())}</span></div></div>
      <div class="tbl-scroll" style="margin:0;"><table class="datatbl">

          <td class="num">${totalQty?U.num(c.qty/totalQty*100,1):'0'}%</td><td class="num">${U.num(c.amount)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty-state">لا بيانات</td></tr>'}</tbody>

    </div>`;

}

function printReport(title){

}

/* ==========================================================================================
   12) INVENTORY ENGINE — المخزون الحالي بقواعد المستودعات + الباتش/الصلاحية + إعادة بناء تاريخي
   ========================================================================================== */
function classifyExpiry(expDate){
  if(!(expDate instanceof Date)) return null;
  const days = U.daysBetween(new Date(), expDate);
  if(days < 0) return 'EXPIRED';
  if(days <= CONFIG.tunable.expiryNearDays) return 'NEAR30';
  if(days <= CONFIG.tunable.expiryMidDays) return 'NEAR90';
  return 'VALID';
}

const INV = {
  rowsFor(itemCode){ return (STATE.data.inventory||[]).filter(r=>r.ItemCode===itemCode); },
  batchesFor(itemCode){ return (STATE.data.batches||[]).filter(r=>r.ItemCode===itemCode); },
  isAvailableWhs(whs){ const rule = CONFIG.warehouseRules[whs]; return !(rule && rule.excludeFromAvailable); },

  physicalStock(itemCode){ return this.rowsFor(itemCode).reduce((s,r)=>s+(Number(r.OnHand)||0), 0); },
  availableStockRaw(itemCode){ return this.rowsFor(itemCode).filter(r=>this.isAvailableWhs(r.WhsCode)).reduce((s,r)=>s+(Number(r.OnHand)||0), 0); },
  expiredQty(itemCode){ return this.batchesFor(itemCode).filter(b=>classifyExpiry(b.ExpDate)==='EXPIRED').reduce((s,b)=>s+(Number(b.BatchQty)||0), 0); },
  nearExpiryQty(itemCode, bucket){ return this.batchesFor(itemCode).filter(b=>classifyExpiry(b.ExpDate)===bucket).reduce((s,b)=>s+(Number(b.BatchQty)||0), 0); },
  /** المخزون المتاح الفعلي للشراء: يستبعد المستودعات الخاصة والمنتهي (لا يمنع التوصية، فقط لا يُحتسب متاحاً) */
  availableStock(itemCode){
    const raw = this.availableStockRaw(itemCode);
    const expired = this.batchesFor(itemCode).length ? this.expiredQty(itemCode) : 0;
    return Math.max(0, raw - expired);
  },
  committedQty(itemCode){
    const fromField = this.rowsFor(itemCode).reduce((s,r)=>s+(Number(r.Committed)||0), 0);
    if(fromField) return fromField;
    return (STATE.data.salesOrders||[]).filter(r=>r.ItemCode===itemCode).reduce((s,r)=>s+(Number(r.OpenQty)||0), 0);
  },
  onOrderQty(itemCode){
    const fromField = this.rowsFor(itemCode).reduce((s,r)=>s+(Number(r.OnOrder)||0), 0);
    if(fromField) return fromField;
    return (STATE.data.purchaseOrders||[]).filter(r=>r.ItemCode===itemCode).reduce((s,r)=>s+(Number(r.OpenQty)||0), 0);
  },

  /** إعادة بناء تاريخ "المخزون المتاح" شهرياً بالرجوع للخلف من لقطة اليوم (Snapshot) باستخدام الحركات الفعلية */
  monthlyAvailableTimeline(itemCode){
    const salesLines = SALES.buildNetLines().filter(l=>l.ItemCode===itemCode && this.isAvailableWhs(l.WhsCode) && l.date instanceof Date);
    const recvLines = (STATE.data.goodsReceipts||[]).filter(r=>r.ItemCode===itemCode && this.isAvailableWhs(r.WhsCode) && r.DocDate instanceof Date);
    if(!salesLines.length && !recvLines.length) return [];
    const allDates = salesLines.map(l=>l.date).concat(recvLines.map(r=>r.DocDate));
    const minD = new Date(Math.min(...allDates)), maxD = new Date();
    const months = monthsInRange(minD, maxD);
    const soldByMonth = new Map(), recvByMonth = new Map();
    salesLines.forEach(l=>{ const mk=U.monthKey(l.date); soldByMonth.set(mk, (soldByMonth.get(mk)||0)+l.qty); });
    recvLines.forEach(r=>{ const mk=U.monthKey(r.DocDate); recvByMonth.set(mk, (recvByMonth.get(mk)||0)+(Number(r.Quantity)||0)); });
    const currentClosing = this.availableStockRaw(itemCode);
    const timeline = [];
    let closing = currentClosing;
    for(let i=months.length-1; i>=0; i--){
      const mk = months[i];
      const sold = soldByMonth.get(mk) || 0;
      const recv = recvByMonth.get(mk) || 0;
      const opening = closing - recv + sold; // Opening = Closing - Purchases(Received) + Sales
      timeline.unshift({month:mk, opening, received:recv, sold, closing});
      closing = opening;
    }
    return timeline;
  },

  /** تصنيف حالة المخزون: انقطاع/فائض/بطيء/راكد تماماً/طبيعي — بالاشتراك مع الطلب المعدَّل */
  stockStatus(itemCode){
    const avail = this.availableStock(itemCode);
    const demand = DEMAND.adjustedMonthlyDemand(itemCode); // من محرك الطلب المعدَّل (قسم 7)
    const recentSaleMonths = this.monthsWithSaleInLast(itemCode, CONFIG.tunable.deadStockMonthsNoSale);
    if(recentSaleMonths===0 && avail>0) return 'DEAD';
    if(demand.adjusted <= 0){
      return avail>0 ? 'SLOW' : 'NORMAL';
    }
    const coverageMonths = avail / demand.adjusted;
    if(avail<=0 && demand.adjusted>0) return 'STOCKOUT';
    if(coverageMonths > CONFIG.tunable.overstockCoverageMonths) return 'OVERSTOCK';
    if(coverageMonths > CONFIG.tunable.slowStockCoverageMonths) return 'SLOW';
    return 'NORMAL';
  },
  monthsWithSaleInLast(itemCode, nMonths){
    const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth()-nMonths);
    const months = new Set();
    SALES.buildNetLines().filter(l=>l.ItemCode===itemCode && l.date instanceof Date && l.date>=cutoff && l.qty>0)
      .forEach(l=>months.add(U.monthKey(l.date)));
    return months.size;
  },
};

/* ==========================================================================================
   13) DEMAND ADJUSTMENT ENGINE — كشف الأشهر الشاذة بالاشتراك مع المخزون/التوريد (قسم 7)
   ========================================================================================== */
const DEMAND = {
  _cache: new Map(),

  /** سلسلة شهرية للطلب الفعلي (يحترم قاعدة المستودعات — يشمل 011 العسكري ويستبعد التالف/العينات) */
  monthlySeries(itemCode, nMonths){
    nMonths = nMonths || 12;
    const lines = SALES.filteredLines({demandOnly:true, ignoreDateFilter:true}).filter(l=>l.ItemCode===itemCode);
    if(!lines.length) return [];
    const dates = lines.map(l=>l.date).filter(d=>d instanceof Date);
    const maxDate = new Date(Math.max(...dates));
    const firstSaleDate = new Date(Math.min(...dates));
    const windowStart = new Date(maxDate.getFullYear(), maxDate.getMonth()-(nMonths-1), 1);
    // لا نملأ بأشهر صفرية قبل أول ظهور فعلي للصنف بالمبيعات (عدم توفر بيانات ≠ طلب صفري)
    const minMonth = firstSaleDate > windowStart ? new Date(firstSaleDate.getFullYear(), firstSaleDate.getMonth(), 1) : windowStart;
    const months = monthsInRange(minMonth, maxDate);
    const byMonth = new Map(months.map(mk=>[mk, 0]));
    lines.forEach(l=>{
      if(!(l.date instanceof Date) || l.date < minMonth) return;
      const mk = U.monthKey(l.date);
      if(byMonth.has(mk)) byMonth.set(mk, byMonth.get(mk) + l.qty);
    });
    return months.map(mk=>({month:mk, qty: byMonth.get(mk)||0}));
  },

  /** الطلب الشهري المعدَّل: يستبعد الأشهر الشاذة المؤكدة (بدليل مخزون/توريد) من حساب المتوسط،
      ولا يُخفي أي شهر مستبعد — يعيدها كلها صراحة مع السبب والثقة */
  adjustedMonthlyDemand(itemCode){
    if(this._cache.has(itemCode)) return this._cache.get(itemCode);
    const series = this.monthlySeries(itemCode, 12);
    const result = {raw:0, adjusted:0, series, excludedMonths:[], confidence:'LOW'};
    if(!series.length){ this._cache.set(itemCode, result); return result; }
    const qtys = series.map(s=>s.qty);
    const rawAvg = qtys.reduce((a,b)=>a+b,0) / qtys.length;
    result.raw = rawAvg;
    const nonZero = qtys.filter(q=>q>0);
    const med = U.median(nonZero.length ? nonZero : qtys);
    let timeline = null;
    const excluded = new Set();
    series.forEach(s=>{
      if(med<=0) return;
      const ratio = s.qty / med;
      if(ratio < CONFIG.tunable.outlierLowRatio){
        if(!timeline) timeline = INV.monthlyAvailableTimeline(itemCode);
        const tp = timeline.find(t=>t.month===s.month);
        let reason=null, confidence=null;
        if(tp && tp.opening<=0 && tp.received<=0){ reason='مخزون شبه صفري طوال الشهر + لا توريد وارد — انقطاع مؤكد تقريباً'; confidence='HIGH'; }
        else if(tp && tp.opening<=0){ reason='مخزون افتتاحي شبه صفري — احتمال انقطاع'; confidence='MEDIUM'; }
        else if(tp && tp.received<=0 && tp.opening < med){ reason='لا توريد وارد ومخزون منخفض — احتمال انقطاع جزئي'; confidence='MEDIUM'; }
        if(reason){ excluded.add(s.month); result.excludedMonths.push({month:s.month, qty:s.qty, reason, confidence, direction:'LOW'}); }
        else { result.excludedMonths.push({month:s.month, qty:s.qty, reason:'منخفض عن الوسيط بدون دليل انقطاع واضح بالمخزون — لم يُستبعد', confidence:'LOW', direction:'LOW_UNCONFIRMED', notExcluded:true}); }
      } else if(ratio > CONFIG.tunable.outlierHighRatio){
        excluded.add(s.month);
        result.excludedMonths.push({month:s.month, qty:s.qty, reason:'ارتفاع غير معتاد عن الوسيط (قد يكون طلب دفعة كبيرة/عميل استثنائي) — استُبعد من متوسط الطلب المعتاد', confidence:'MEDIUM', direction:'HIGH'});
      }
    });
    const kept = series.filter(s=>!excluded.has(s.month));
    result.adjusted = kept.length ? kept.reduce((a,b)=>a+b.qty,0)/kept.length : rawAvg;
    const confirmedExclusions = result.excludedMonths.filter(e=>!e.notExcluded);
    const dataMonths = series.length;
    result.confidence = dataMonths>=9 ? (confirmedExclusions.length<=2?'HIGH':'MEDIUM') : dataMonths>=4 ? 'MEDIUM' : 'LOW';
    this._cache.set(itemCode, result);
    return result;
  },

  clearCache(){ this._cache.clear(); },
};
</script>
<script>
'use strict';

const VIEW_RENDERERS = {
  decisions: ()=>{ if(window.renderDecisions) renderDecisions(); },
  risks: ()=>{ if(window.renderRisks) renderRisks(); },

};

function switchView(v){
  document.querySelectorAll('nav.mainnav button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-view')===v); });

}

/* ==========================================================================================
   7) FILTERS — تؤثر على كل التقارير والمحرك
   ========================================================================================== */
STATE.filters = {
  dateFrom:'', dateTo:'', supplier:'', item:'', itemGroup:'', warehouse:'', customer:'',
  salesEmployee:'', recStatus:'', stockStatus:'', supplierCountry:'', expiryStatus:'',
};

function distinctValues(sourceKeys, field, nameField){
  const seen = new Map();
  sourceKeys.forEach(sk=>{
    (STATE.data[sk]||[]).forEach(r=>{
      const v = r[field];
      if(v===undefined || v===null || v==='') return;
      if(!seen.has(v)) seen.set(v, nameField? (r[nameField]||v) : v);
    });
  });
  return Array.from(seen.entries()).map(([code,name])=>({code,name})).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
}

function renderGlobalFilterBar(){
  const f = STATE.filters;
  const suppliers = distinctValues(['suppliers'], 'SupplierCode', 'SupplierName');
  if(!suppliers.length) distinctValues(['purchaseInvoices'], 'SupplierCode', 'SupplierName').forEach(s=>suppliers.push(s));
  const warehouses = Object.keys(CONFIG.warehouseRules).map(c=>({code:c,name:c+' — '+CONFIG.warehouseRules[c].label}));
  distinctValues(['inventory','salesInvoices'], 'WhsCode').forEach(w=>{ if(!warehouses.find(x=>x.code===w.code)) warehouses.push(w); });
  const employees = distinctValues(['salesInvoices'], 'SlpName');
  const countries = distinctValues(['suppliers'], 'Country');
  const itemGroups = distinctValues(['items'], 'ItemGroup');

  const el = document.getElementById('globalFilterBar');
  el.innerHTML = `
    <div class="fld"><label>من تاريخ</label><input type="date" id="f_dateFrom" value="${f.dateFrom}"></div>
    <div class="fld"><label>إلى تاريخ</label><input type="date" id="f_dateTo" value="${f.dateTo}"></div>
    <div class="fld"><label>الصنف</label><input type="text" id="f_item" list="dl_items" placeholder="رمز/اسم الصنف" value="${U.esc(f.item)}"></div>
    <datalist id="dl_items">${itemOptionsList().map(o=>`<option value="${U.esc(o.code)}">${U.esc(o.name)}</option>`).join('')}</datalist>
    <div class="fld"><label>مجموعة الصنف</label><select id="f_itemGroup"><option value="">الكل</option>${itemGroups.map(o=>`<option value="${U.esc(o.code)}" ${f.itemGroup===o.code?'selected':''}>${U.esc(o.code)}</option>`).join('')}</select></div>
    <div class="fld"><label>المورد</label><select id="f_supplier"><option value="">الكل</option>${suppliers.map(o=>`<option value="${U.esc(o.code)}" ${f.supplier===o.code?'selected':''}>${U.esc(o.name)}</option>`).join('')}</select></div>
    <div class="fld"><label>بلد المورد</label><select id="f_supplierCountry"><option value="">الكل</option>${countries.map(o=>`<option value="${U.esc(o.code)}" ${f.supplierCountry===o.code?'selected':''}>${U.esc(o.code)}</option>`).join('')}</select></div>
    <div class="fld"><label>المستودع</label><select id="f_warehouse"><option value="">الكل</option>${warehouses.map(o=>`<option value="${U.esc(o.code)}" ${f.warehouse===o.code?'selected':''}>${U.esc(o.name)}</option>`).join('')}</select></div>
    <div class="fld"><label>العميل</label><input type="text" id="f_customer" list="dl_customers" placeholder="اسم العميل" value="${U.esc(f.customer)}"></div>
    <datalist id="dl_customers">${distinctValues(['salesInvoices'],'CardCode','CardName').map(o=>`<option value="${U.esc(o.name)}">`).join('')}</datalist>
    <div class="fld"><label>مندوب المبيعات</label><select id="f_salesEmployee"><option value="">الكل</option>${employees.map(o=>`<option value="${U.esc(o.code)}" ${f.salesEmployee===o.code?'selected':''}>${U.esc(o.code)}</option>`).join('')}</select></div>
    <div class="fld"><label>حالة التوصية</label><select id="f_recStatus"><option value="">الكل</option>
      ${['CRITICAL','ORDER_SOON','MONITOR','IN_TRANSIT','STOCKOUT_RISK','OVERSTOCK','SLOW_MOVING'].map(s=>`<option value="${s}" ${f.recStatus===s?'selected':''}>${RECO_LABELS[s]||s}</option>`).join('')}</select></div>
    <div class="fld"><label>حالة المخزون</label><select id="f_stockStatus"><option value="">الكل</option>
      ${['STOCKOUT','OVERSTOCK','SLOW','DEAD','NORMAL'].map(s=>`<option value="${s}" ${f.stockStatus===s?'selected':''}>${STOCK_STATUS_LABELS[s]||s}</option>`).join('')}</select></div>
    <div class="fld"><label>حالة الصلاحية</label><select id="f_expiryStatus"><option value="">الكل</option>
      ${['EXPIRED','NEAR30','NEAR90','VALID'].map(s=>`<option value="${s}" ${f.expiryStatus===s?'selected':''}>${EXPIRY_LABELS[s]||s}</option>`).join('')}</select></div>
    <div class="spacer"></div>
    <button class="btn-primary btn-sm" onclick="applyGlobalFilters()">تطبيق الفلاتر</button>
    <button class="btn-ghost btn-sm" onclick="clearGlobalFilters()">✕ مسح الفلاتر</button>
  `;
}

function itemOptionsList(){
  const map = new Map();
  (STATE.data.items||[]).forEach(r=>{ if(r.ItemCode) map.set(r.ItemCode, r.ItemName||r.ItemCode); });
  (STATE.data.salesInvoices||[]).forEach(r=>{ if(r.ItemCode && !map.has(r.ItemCode)) map.set(r.ItemCode, r.ItemName||r.ItemCode); });
  return Array.from(map.entries()).map(([code,name])=>({code,name})).slice(0,3000);
}

const RECO_LABELS = {CRITICAL:'حرِج — اطلب الآن', ORDER_SOON:'اطلب قريباً', MONITOR:'راقب', NO_ORDER:'لا حاجة لطلب', OVERSTOCK:'فائض مخزون', SLOW_MOVING:'راكد', STOCKOUT_RISK:'خطر انقطاع', IN_TRANSIT:'بالطريق'};

function applyGlobalFilters(){
  const g = id=>document.getElementById(id).value;
  Object.assign(STATE.filters, {
    dateFrom:g('f_dateFrom'), dateTo:g('f_dateTo'), item:g('f_item'), itemGroup:g('f_itemGroup'),
    supplier:g('f_supplier'), supplierCountry:g('f_supplierCountry'), warehouse:g('f_warehouse'),
    customer:g('f_customer'), salesEmployee:g('f_salesEmployee'), recStatus:g('f_recStatus'),
    stockStatus:g('f_stockStatus'), expiryStatus:g('f_expiryStatus'),
  });
  if(window.onDataChanged) window.onDataChanged();
}
function clearGlobalFilters(){
  Object.keys(STATE.filters).forEach(k=>STATE.filters[k]='');
  renderGlobalFilterBar();
  if(window.onDataChanged) window.onDataChanged();
}

/** يطبّق فلاتر المستوى-المعاملاتي (تاريخ/صنف/مستودع/عميل/مندوب/مورد) على سطر خام من أي مصدر */
function matchesTxFilters(row, opts){
  opts = opts || {};
  const f = STATE.filters;
  if(f.dateFrom || f.dateTo){
    const d = opts.dateField ? row[opts.dateField] : null;
    if(d instanceof Date){
      if(f.dateFrom && d < new Date(f.dateFrom)) return false;
      if(f.dateTo && d > new Date(f.dateTo+'T23:59:59')) return false;
    }
  }
  if(f.item){
    const q = f.item.trim().toLowerCase();
    const code = String(row.ItemCode||'').toLowerCase(), name = String(row.ItemName||'').toLowerCase();
    if(!code.includes(q) && !name.includes(q)) return false;
  }
  if(f.warehouse && row.WhsCode!==undefined && row.WhsCode!==f.warehouse) return false;
  if(f.customer){
    const q = f.customer.trim().toLowerCase();
    if(row.CardName!==undefined && !String(row.CardName||'').toLowerCase().includes(q)) return false;
  }
  if(f.salesEmployee && row.SlpName!==undefined && row.SlpName!==f.salesEmployee) return false;
  if(f.supplier && row.SupplierCode!==undefined && row.SupplierCode!==f.supplier) return false;
  return true;
}

async function initApp(){
  try{
    await STATE.loadAll();
    const savedTunable = await DB.getMeta('tunable', null);
    if(savedTunable) Object.assign(CONFIG.tunable, savedTunable);
    document.querySelectorAll('nav.mainnav button').forEach(function(btn){
      btn.addEventListener('click', function(){ switchView(btn.getAttribute('data-view')); });
    });
    renderGlobalFilterBar();
    if(window.recomputeAll) recomputeAll();
    switchView('decisions');
  }catch(err){
    console.error(err);
    U.toast('خطأ بتحميل النظام: '+err.message, 'err');
  }
}
window.onDataChanged = function(){ if(window.recomputeAll) recomputeAll(); switchView(document.querySelector('nav.mainnav button.active').getAttribute('data-view')); };

document.addEventListener('DOMContentLoaded', initApp);
function closeDrawer(){ document.getElementById('drawerOverlay').classList.remove('open'); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
</script>
