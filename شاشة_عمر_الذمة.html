<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة تحليل عمر الذمة</title>
<style>
:root{
  --bg:#f4f6f9;--surface:#fff;--surface2:#f8fafc;--ink:#14213d;--ink2:#475569;--muted:#8a94a6;
  --line:#e3e8ef;--line2:#cfd7e3;--accent:#1c5cab;--accent2:#0d366b;--accentSoft:#e8f0fb;
  --gold:#b8862b;--goldSoft:#fff8e8;--good:#1f7a4d;--bad:#b42318;--goodSoft:#e7f5ee;--badSoft:#fdecea;--warn:#a15c07;--warnSoft:#fff4e0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:13px}
button,input,select,textarea{font-family:inherit;font-size:13px}
header.top{background:linear-gradient(135deg,#0d366b,#1c5cab);color:#fff;padding:12px 20px 0}
header.top .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{margin:0;font-size:19px;font-weight:700}
header.top .sub{opacity:.85;font-size:12px;margin-top:3px}
.hbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
.hbtn:hover{background:rgba(255,255,255,.25)}
.tabs{display:flex;gap:3px;margin-top:10px;overflow-x:auto;scrollbar-width:thin;padding-bottom:0}
.tab{background:rgba(255,255,255,.1);color:#fff;border:0;padding:7px 11px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:600;white-space:nowrap;font-size:12.5px;display:flex;align-items:center;gap:6px}
.tab:hover{background:rgba(255,255,255,.2)}
.tab.on{background:var(--bg);color:var(--accent2)}
.tab .n{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:rgba(255,255,255,.2);font-size:11px;text-align:center}
.tab.on .n{background:var(--accentSoft);color:var(--accent2)}
.tab .cnt{font-size:10.5px;opacity:.8;font-weight:400}
.tab.has{box-shadow:inset 0 -3px 0 #f2c14e}
.tab.on.has{box-shadow:none}
main{padding:12px 16px 40px}
.thead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.thead h2{margin:0;font-size:16px;color:var(--accent2)}
.thead .m{color:var(--ink2);font-size:12px}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.stab{border:1px solid var(--line2);background:#fff;color:var(--ink2);border-radius:16px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:12px}
.stab:hover{border-color:var(--accent);color:var(--accent)}
.stab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11px;color:var(--ink2);font-weight:600}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select{border:1px solid var(--line2);border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink)}
.fld input[type=text]{width:190px}
.fld select{max-width:200px}
.btn{border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent2);color:#fff}
.btn.warn:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accentSoft);color:var(--accent2);border:1px solid #c6d9f3;border-radius:14px;padding:3px 10px;font-weight:600;font-size:12px}
.chip b{cursor:pointer;color:var(--bad);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-top:3px solid var(--accent)}
.kpi .t{font-size:11.5px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:19px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.gold{border-top-color:var(--gold)}.kpi.red{border-top-color:var(--bad)}.kpi.green{border-top-color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--accent2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .hint{font-weight:400;color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>.card{margin-bottom:0}
.grid2{margin-bottom:12px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}.fld input[type=text]{width:150px}}
.tw{overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--line);border-radius:8px;background:#fff}
.tw.short{max-height:420px}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
table.t th{position:sticky;top:0;background:#eef2f7;font-size:12px;z-index:3;border-bottom:1px solid var(--line2);user-select:none}
table.t th.s{cursor:pointer}
table.t th.s:hover{color:var(--accent)}
table.t .tx{text-align:right}
table.t tr.tot td{position:sticky;top:30px;background:var(--goldSoft);font-weight:700;z-index:2;border-bottom:2px solid var(--gold)}
table.t th .ar{color:var(--gold);font-size:10px;margin-inline-start:3px}
table.t tr.r:hover td{background:#f3f7fd}
table.t tr.r{cursor:pointer}
td.nm{max-width:300px;overflow:hidden;text-overflow:ellipsis;text-align:right!important}
td.lg{max-width:360px;overflow:hidden;text-overflow:ellipsis;text-align:right!important}
.lnk{color:var(--accent2);font-weight:600;cursor:pointer}
.lnk:hover{text-decoration:underline}
.badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:10px;background:var(--accentSoft);color:var(--accent2);font-weight:700;margin-inline-start:6px}
.code{color:var(--muted);font-size:11px;margin-inline-end:6px}
.z{color:#c0c7d2}
.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:700;margin:0 2px}
.pill.r{background:var(--badSoft);color:var(--bad)}.pill.w{background:var(--warnSoft);color:var(--warn)}.pill.g{background:var(--goodSoft);color:var(--good)}.pill.b{background:var(--accentSoft);color:var(--accent2)}.pill.n{background:#f1f3f6;color:#64748b}
.fx{display:inline-block;padding:1px 6px;border-radius:6px;font-size:11px;background:var(--badSoft);color:var(--bad);margin:1px 2px;white-space:nowrap}
.fx.i{background:#f1f3f6;color:#64748b}
.drop{border:2px dashed var(--line2);border-radius:14px;background:var(--surface);padding:36px 20px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.ov{border-color:var(--accent);background:var(--accentSoft)}
.drop .big{font-size:16px;font-weight:700;margin:10px 0 4px}
.drop .ic{width:52px;height:52px;border-radius:50%;background:var(--accentSoft);display:inline-flex;align-items:center;justify-content:center}
.prog{display:none;height:6px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
textarea.paste{width:100%;min-height:90px;border:1px solid var(--line2);border-radius:8px;padding:8px;font-family:Consolas,monospace;font-size:12px;direction:ltr}
.cols{display:flex;flex-wrap:wrap;gap:6px}
.cols span{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px}
.cols span b{color:var(--accent)}
.cols span.miss{border-color:var(--bad);color:var(--bad);background:var(--badSoft)}
.more{margin-top:8px}
.foot{color:var(--muted);font-size:11px;margin-top:6px}
.guide h4{margin:12px 0 4px;font-size:13px;color:var(--accent2)}
.guide ul{margin:0;padding-right:20px}
.guide table{border-collapse:collapse;width:100%;font-size:12.5px}
.guide td,.guide th{border:1px solid var(--line);padding:5px 8px;text-align:right;vertical-align:top}
.guide th{background:var(--surface2)}
pre.sql{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:12px;font-size:11.5px;direction:ltr;text-align:left;overflow:auto;max-height:520px;white-space:pre-wrap;word-break:break-all;margin:0}
.hb{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}
.hb .l{width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.hb .b{flex:1;height:14px;background:var(--surface2);border-radius:3px;overflow:hidden}
.hb .b i{display:block;height:100%;background:#2a78d6;border-radius:3px}
.hb .b i.neg{background:var(--bad)}
.hb .v{width:110px;text-align:left;font-variant-numeric:tabular-nums;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(10,20,40,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.ov.on{display:flex}
.md{background:#fff;border-radius:12px;width:min(1100px,100%);padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md h2{margin:0 0 10px;font-size:16px;color:var(--accent2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 14px}
.rec div{border-bottom:1px solid var(--line);padding:4px 0;display:flex;justify-content:space-between;gap:10px}
.rec div span:first-child{color:var(--ink2);font-size:12px}
.rec div span:last-child{font-weight:600;text-align:left;word-break:break-word}
.tip{position:fixed;display:none;background:#14213d;color:#fff;padding:6px 10px;border-radius:7px;font-size:12px;pointer-events:none;z-index:99;max-width:320px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
.msg{color:var(--ink2);margin-top:10px}
.msg.err{color:var(--bad);font-weight:700}
.colpick{display:flex;flex-wrap:wrap;gap:4px 10px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);margin-bottom:8px}
.colpick label{display:inline-flex;align-items:center;gap:4px;font-size:12px;cursor:pointer}
.empty{padding:30px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:11px;text-align:center;padding:10px}
.rpt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.rpt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px double var(--accent2);padding-bottom:10px;margin-bottom:10px;flex-wrap:wrap}
.rpt-co1{font-size:18px;font-weight:800;color:var(--accent2)}.rpt-co2{font-size:11px;color:var(--muted);letter-spacing:1px;direction:ltr;text-align:right}
.rpt-title{text-align:center}.rpt-t1{font-size:20px;font-weight:800;color:var(--ink)}.rpt-t2{font-size:13px;color:var(--ink2);margin-top:2px}
.rpt-meta{display:grid;grid-template-columns:auto auto;gap:3px 14px;font-size:12px}.rpt-meta span{color:var(--muted);margin-inline-end:6px}.rpt-meta b{font-weight:700}
.rpt-kpis{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}.rpt-kpis>div{flex:1;min-width:140px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}.rpt-kpis span{display:block;color:var(--ink2);font-size:11px}.rpt-kpis b{font-size:15px}.rpt-kpis b.bad{color:var(--bad)}.rpt-kpis b.warn{color:var(--warn)}.rpt-kpis b.good{color:var(--good)}
.rpt .tw{max-height:none;border-radius:6px}.rpt table.t th{background:var(--accent2);color:#fff}.rpt table.t tr.tot td{top:auto}
.rpt-notes{margin-top:10px;font-size:12px;color:var(--ink2)}.rpt-small{font-size:10.5px;color:var(--muted)}
.rpt-sign{display:flex;justify-content:space-between;gap:24px;margin-top:26px;font-size:12px}.rpt-sign>div{flex:1;text-align:center}.rpt-sign span{display:block;color:var(--ink2);margin-bottom:26px}.rpt-sign i{display:block;border-top:1px solid #333;margin:0 10px}.rpt-sign small{display:block;color:var(--muted);margin-top:3px;font-size:10px}
@media print{.rpt-kpis,.noprint{display:none!important}.rpt{border:0;padding:0 2mm;max-width:100%;overflow:hidden}.rpt table.t th{background:#0d366b!important;color:#fff!important}.rpt .tw{overflow:visible;border:0}
.rpt table.t{font-size:8.5px;width:100%!important;table-layout:fixed}.rpt table.t th,.rpt table.t td{padding:5px 3px;line-height:1.35;white-space:normal;overflow-wrap:break-word;vertical-align:middle;max-width:none}.rpt table.t td.nm{font-size:7.5px;line-height:1.25}.rpt table.t td:not(.tx){white-space:nowrap;overflow:hidden;text-overflow:clip}.rpt table.t td.nm{text-align:right!important}
.rpt table.t .code,.rpt table.t small{font-size:7.5px}.rpt table.t .pill{padding:0 3px;font-size:8px}.rpt-sign{margin-top:14px}}
#printHead,#printExplain{display:none}
@page{size:landscape;margin:6mm 7mm}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff;font-size:10px}
  body{padding:6mm 8mm!important;box-sizing:border-box;width:100%!important;min-width:0!important;max-width:none!important;overflow:visible!important} /* هامش أمان داخل الصفحة لا يتأثر باختيار «الهوامش: بدون» في نافذة الطباعة */
  header.top{background:#fff!important;color:#000;padding:0 0 4px;border-bottom:2px solid #0d366b}
  header.top h1{color:#0d366b;font-size:15px}
  header.top .sub,.tabs,.hbtn,.bar,.subtabs,.btn,.chips,.colpick,.more,footer,.tip,.toast{display:none!important}
  #printHead{display:block!important;font-size:10px;color:#333;border-bottom:1px solid #ccc;padding:4px 0;margin-bottom:6px}
  #printHead b{color:#000}
  header.top h1{display:none}header.top{border-bottom:0;padding:0}
  .thead,.card h3 .hint,.foot,.card .foot,.card h3 select{display:none!important}
  #printExplain{display:block!important;page-break-before:always;font-size:10px;line-height:1.6}
  #printExplain h2{font-size:14px;color:#0d366b;margin:0 0 6px;border-bottom:2px solid #0d366b;padding-bottom:3px}
  #printExplain h3{font-size:11.5px;color:#0d366b;margin:8px 0 3px}
  #printExplain table{border-collapse:collapse;width:100%;font-size:9.5px}#printExplain td,#printExplain th{border:1px solid #ccc;padding:2px 5px;text-align:right;vertical-align:top}#printExplain th{background:#e9eef5}
  #printExplain ul,#printExplain ol{margin:2px 0;padding-right:18px}
  #printHead .ph1{font-size:13px;color:#0d366b}#printHead .ph2{font-size:10.5px;margin-top:2px}#printHead .ph3{font-size:9px;color:#666;margin-top:2px}
  main{padding:0}
  .tw{max-height:none!important;overflow:visible!important;border:0;border-radius:0}
  table.t{font-size:8.5px;width:100%}
  table.t th,table.t td{padding:2px 4px;white-space:normal;border:1px solid #d0d0d0;max-width:none}
  table.t th{position:static;background:#e9eef5!important}
  table.t tr.tot td{position:static;background:#fff4d6!important}
  thead{display:table-header-group}tr{page-break-inside:avoid}
  td.nm,td.lg{max-width:none;white-space:normal}
  .card{break-inside:auto;border:1px solid #ccc;box-shadow:none;padding:6px;margin-bottom:6px;page-break-inside:auto}
  .card h3{font-size:11px;margin-bottom:4px}
  .kpis{grid-template-columns:repeat(6,1fr);gap:4px}.kpi{padding:4px 6px}.kpi .v{font-size:12px}.kpi .t,.kpi .s{font-size:8.5px}
  .grid2{grid-template-columns:1fr 1fr;gap:6px}
  .hb{font-size:9px}.hb .l{width:160px}
  .guide pre.sql{white-space:pre-wrap;font-size:7.5px;max-height:none;background:#f3f3f3;color:#000;word-break:break-all}
  .drop,textarea.paste{display:none}
  .ov{display:none}
  body.print-modal header.top,body.print-modal main,body.print-modal #printHead{display:none!important}
  body.print-rpt #printHead,body.print-rpt header.top,body:has(#view .rpt) #printHead,body:has(#view .rpt) header.top,body:has(#view .rpt) #printExplain{display:none!important}
  body.print-modal .ov{display:block!important;position:static;background:none;padding:0;overflow:visible}
  body.print-modal .md{box-shadow:none;width:100%;padding:0;border-radius:0}
  .md h2{font-size:13px}.rec div{padding:2px 0;font-size:9.5px}
}

.gate{max-width:420px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.gate h2{margin:0 0 4px;font-size:17px;color:var(--accent2)}.gate .sub{color:var(--ink2);font-size:12.5px;margin-bottom:16px}
.gate .fld{margin-bottom:10px}.gate input{width:100%;border:1px solid var(--line2);border-radius:7px;padding:8px}
.gate .err{color:var(--bad);font-weight:700;margin-top:10px}.gate .note{color:var(--muted);font-size:11.5px;margin-top:12px}
.ubox{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.95}.ubox b{font-weight:600}
@media print{.ubox{display:none!important}}
body.scope-aging .tabs{display:none!important}
.tabs{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div><h1>شاشة تحليل عمر الذمة</h1><div class="sub" id="hsub">أرصدة العملاء وأعمارها · الفترات والشيكات المؤجلة · حسب المندوب والمدير والفرع · مركز الكيلاني للأغذية · نسخة مستقلة تعمل بلا إنترنت، البيانات تُحفظ على هذا الجهاز فقط</div></div>
    <span class="sp"></span>
    <span class="ubox" id="ubox" style="display:none"><b id="uEmail"></b><span id="syncSt" style="font-size:11px;opacity:.9"></span><button class="hbtn" onclick="doLogout()">خروج</button></span>
    <button class="hbtn" id="printBtn" onclick="doPrint()" style="display:none">طباعة A4</button>
  </div>
  <div class="tabs" id="qtabs"></div>
</header>
<div id="printHead"></div>
<main id="main"></main>
<div id="printExplain"></div>
<footer id="ver"></footer>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<script type="text/plain" id="sql_aging1">
/* SELECT C."CardCode" FROM OCRD C WHERE C."CreateDate" < [%0] */
SELECT
    C."CardCode"                       AS "رمز العميل",
    C."CardName"                       AS "اسم العميل",
    S."SlpName"                        AS "المندوب",
    C."Phone1"                         AS "رقم الهاتف",
    C."E_Mail"                         AS "البريد الإلكتروني",
    C."CreditLine"                     AS "السقف الائتماني",
    IFNULL(TG."ExtraDays", 0)          AS "أيام السماح",

    IFNULL((
        SELECT SUM(J1."Debit" - J1."Credit")
        FROM JDT1 J1
        WHERE J1."ShortName" = C."CardCode" AND J1."ShortName" <> J1."Account"
          AND J1."RefDate" <= '[%0]'
    ), 0)                               AS "الرصيد حتى تاريخ اللقطة",

    IFNULL((
        SELECT SUM(K."CheckSum")
        FROM RCT1 K INNER JOIN ORCT R ON K."DocNum" = R."DocEntry"
        WHERE R."Canceled" = 'N' AND R."CardCode" = C."CardCode"
          AND R."DocDate" <= '[%0]' AND K."DueDate" > '[%0]'
    ), 0)                               AS "الشيكات المؤجلة",

    IFNULL((SELECT SUM(CASE WHEN X."Kind"='I' THEN X."Amt" ELSE -X."Amt" END)
        FROM (SELECT "CardCode","DocTotal" AS "Amt",'I' AS "Kind","DocDate" FROM OINV WHERE "CANCELED"='N'
              UNION ALL SELECT "CardCode","DocTotal",'R',"DocDate" FROM ORIN WHERE "CANCELED"='N') X
        WHERE X."CardCode"=C."CardCode" AND X."DocDate" <= '[%0]'

  let head=best.parts.map(h=>h.replace(/^﻿/,'').replace(/^"|"$/g,'').trim());
  while(head.length&&!head[head.length-1])head.pop();
  const W=head.length,rows=[];
  for(let li=best.i+1;li<lines.length;li++){const L=lines[li];if(!L||!L.trim())continue;
    const r=splitCSV(L,best.d);let any=false;const row=new Array(W);
    for(let j=0;j<W;j++){const v=(r[j]==null?'':String(r[j])).trim();row[j]=v;if(v)any=true;}
    if(!any)continue;
    if(def.doc){const di=head.indexOf(def.doc);if(di>=0&&!row[di]&&r.length<W/2)continue;}
    rows.push(row);}

  return {src,loaded:new Date().toISOString(),head,rows};

/* ================= column typing & build ================= */
const DELAY_COLS=['ايام التأخير','أيام التأخير','تأخير الادخال'];
const RISK_COL='درجة الخطورة';
/* normalize a flag piece to a stable label: drop ": details", "من X الى Y" tails and "[...]" details */
function flagLabel(p){let q=p.split(/[:：]/)[0].trim();q=q.replace(/\s+من\s+.*?\s+(الى|إلى)\s+.*$/,'').replace(/\s+من\s+(-|\[).*$/,'').replace(/^((?:[✖✗×ℹ]\s*)?(?:تغيير|رفع|تخفيض|تمديد)\s+\S+(?:\s+\S+)?)\s+من\s+.*$/,'$1').replace(/\s+(ب|بـ)\s*\d+\s*(يوم|ايام|أيام|%)?\s*$/,'').trim();return q||p;}
function nameType(t){
  if(/^فتح /.test(t))return 'link';
  if(/تاريخ/.test(t)||t==='تاريخها'||t==='استحقاق اقدم ذمة')return 'd';
  if(/^نسبة/.test(t))return 'p';
  if(/^(رقم|رمز|كود|الفواتير|أرقام)/.test(t)||/^(مرجع|الباتش|المستودع|الشيك)$/.test(t))return 't';
  return null;}
function build(T){
  const D=T.D,def=T.def,n=D.rows.length;
  const cols=D.head.map((t,i)=>({i,t,k:hnorm(t),f:nameType(t)}));
  const txt=new Set((def.text||[]).map(hnorm));for(const c of cols)if(txt.has(c.k))c.f='t';
  const V=new Array(cols.length);
  for(const c of cols){
    const raw=D.rows;
    if(c.f==='link'){let num=0,non=0;for(let i=0;i<n;i++){const s=raw[i][c.i];if(!s)continue;non++;if(/^\d+$/.test(s))num++;}if(non&&num<non*0.95)c.f='t';}
    if(c.f==null){let num=0,non=0;for(let i=0;i<n;i++){const s=raw[i][c.i];if(!s)continue;non++;if(pnum(s)!=null)num++;}
      if(non===0){const inMs=(def.ms||[]).some(m=>hnorm(m)===c.k)||DELAY_COLS.some(m=>hnorm(m)===c.k);c.f=(inMs||/ايام|أيام|عدد|الكمية|قيمة|مبلغ|سعر|نقد|شيكات|تحويل|بطاقات|رصيد|كلفة|ربح|تكاليف|مصاريف|اثر|تأخير|خصم|صافي|اجمالي|إجمالي|^فواتير|^سندات|^قيود|^تسويات|^تعديلات|^اوامر|^اشعارات|حد الائتمان/.test(c.t))?'n':'t';}
      else c.f=(num>=non*0.95)?'n':'t';
      if(c.f==='n'){let allInt=true;for(let i=0;i<n&&allInt;i++){const v=pnum(raw[i][c.i]);if(v!=null&&v!==Math.round(v))allInt=false;}if(allInt)c.f='i';}}
    if(c.f==='d'){const smp=[];for(let i=0;i<n&&smp.length<400;i++)if(raw[i][c.i])smp.push(raw[i][c.i]);const pd=makeDateParser(smp);
      const a=new Array(n);let ok=0,bad=0;for(let i=0;i<n;i++){const s=raw[i][c.i];a[i]=s?pd(s):null;if(s){if(a[i]==null)bad++;else ok++;}}
      if(bad>ok){c.f='t';V[c.i]=raw.map(r=>r[c.i]);}else V[c.i]=a;}
    else if(c.f==='n'||c.f==='i'||c.f==='p'){const a=new Array(n);for(let i=0;i<n;i++)a[i]=pnum(raw[i][c.i]);V[c.i]=a;}
    else V[c.i]=raw.map(r=>r[c.i]);
  }
  for(const d of (def.derive||[])){const src=cols.find(c=>c.k===hnorm(d.frm));if(!src)continue;const i=cols.length;cols.push({i,t:d.t,k:hnorm(d.t),f:'t',derived:1});const a=new Array(n);for(let r=0;r<n;r++){try{a[r]=d.fn(V[src.i][r]||'');}catch(e){a[r]='';}}V[i]=a;}
  const find=name=>{if(!name)return null;const k=hnorm(name);return cols.find(c=>c.k===k)||cols.find(c=>c.k.includes(k))||null;};
  const P={cols,V,n};
  P.cDoc=find(def.doc);P.cDate=find(def.date);if(P.cDate&&P.cDate.f!=='d')P.cDate=null;
  P.cRisk=find(RISK_COL);if(P.cRisk&&!(P.cRisk.f==='n'||P.cRisk.f==='i'))P.cRisk=null;
  P.cDelay=null;for(const d of DELAY_COLS){const c=find(d);if(c&&(c.f==='n'||c.f==='i')){P.cDelay=c;break;}}
  P.dims=(def.dims||[]).map(find).filter(c=>c);
  P.ms=(def.ms||[]).map(find).filter(c=>c&&(c.f==='n'||c.f==='i'||c.f==='p'));
  P.main=P.ms[0]||null;
  P.flagCols=(def.flags||[]).map(find).filter(c=>c&&c.f==='t');
  /* flags per row */
  const FL=new Array(n),cnt=new Map();
  for(let i=0;i<n;i++){const arr=[];
    for(const c of P.flagCols){const s=V[c.i][i];if(!s)continue;
      for(let p of s.split(/\s+\/\s+|\s+\|\s+|\s+·\s+/)){p=p.trim();if(!p)continue;const q=flagLabel(p);if(q&&arr.indexOf(q)<0)arr.push(q);}}
    FL[i]=arr;for(const f of arr)cnt.set(f,(cnt.get(f)||0)+1);}
  P.FL=FL;P.flags=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  P.anyX=P.flags.some(f=>/[✖✗×]/.test(f));
  /* search strings */
  const tc=cols.filter(c=>c.f==='t'||c.f==='link'||c.f==='i');
  P.SS=new Array(n);for(let i=0;i<n;i++){let s='';for(const c of tc){const v=V[c.i][i];if(v!=null&&v!=='')s+=' '+v;}P.SS[i]=norm(s);}
  /* dim distincts */
  P.dimVals={};for(const c of P.dims){const m=new Map();for(let i=0;i<n;i++){const v=V[c.i][i];if(v==null||v==='')continue;m.set(String(v),(m.get(String(v))||0)+1);}P.dimVals[c.i]=[...m.keys()].sort((a,b)=>a.localeCompare(b,'ar'));}
  /* date range */
  if(P.cDate){let mn=Infinity,mx=-Infinity;const a=V[P.cDate.i];for(let i=0;i<n;i++){const v=a[i];if(v==null)continue;if(v<mn)mn=v;if(v>mx)mx=v;}P.dMin=isFinite(mn)?mn:null;P.dMax=isFinite(mx)?mx:null;}
  P.missing=def.cols.filter(t=>!cols.some(c=>c.k===hnorm(t)));
  T.P=P;
}

/* ================= tab state ================= */
const TABS={};let ACTIVE=null;
function newState(){return {q:'',d1:null,d2:null,dim:{},flag:'',risk:0,delay:0,drill:[],per:'auto'};}

const dimLabel=c=>c.t.replace(/^(اسم|كود|رمز|نوع) /,'').replace(/^(ال)?مستخدم$/,'المستخدم');
function invalidate(T){T.flt=null;for(const k in T.ts)T.ts[k].lim=300;}

/* ================= filtering ================= */
function filtered(T){if(T.flt)return T.flt;const P=T.P,S=T.S,V=P.V,n=P.n,out=[];
  const qn=S.q?norm(S.q):'';const dimE=Object.entries(S.dim).filter(e=>e[1]!=='').map(e=>[+e[0],e[1]]);
  const dr=S.drill;const dA=V[P.cDate?P.cDate.i:-1],rA=P.cRisk?V[P.cRisk.i]:null,lA=P.cDelay?V[P.cDelay.i]:null;
  for(let i=0;i<n;i++){
    if(dA&&(S.d1!=null||S.d2!=null)){const d=dA[i];if(S.d1!=null&&(d==null||d<S.d1))continue;if(S.d2!=null&&(d==null||d>S.d2))continue;}
    let ok=true;
    for(const [ci,val] of dimE){if(String(V[ci][i]==null?'':V[ci][i])!==val){ok=false;break;}}if(!ok)continue;
    for(const d of dr){
      if(d.col==='__flag'){if(P.FL[i].indexOf(d.val)<0){ok=false;break;}}
      else if(d.col==='__period'){const v=dA?dA[i]:null;if(v==null||perKey(T,v)!==d.val){ok=false;break;}}
      else if(d.col==='__risk'){const v=rA?rA[i]:null;if((v==null?0:v)!==d.val){ok=false;break;}}
      else{const v=V[d.col][i];if(String(v==null?'':(P.cols[d.col].f==='d'?fmtDay(v):v))!==d.val){ok=false;break;}}}
    if(!ok)continue;
    if(S.flag){const f=P.FL[i];if(S.flag==='*'){if(!f.length)continue;}else if(S.flag==='x'){if(!f.some(x=>/[✖✗×]/.test(x)))continue;}else if(f.indexOf(S.flag)<0)continue;}
    if(S.risk>0){const v=rA?rA[i]:null;if(v==null||v<S.risk)continue;}
    if(S.delay>0){const v=lA?lA[i]:null;if(v==null||v<S.delay)continue;}

  T.flt=out;return out;}
function perMode(T){const S=T.S,P=T.P;if(S.per!=='auto')return S.per;const idx=filtered(T);const a=P.V[P.cDate.i];let mn=Infinity,mx=-Infinity;for(const i of idx){const v=a[i];if(v==null)continue;if(v<mn)mn=v;if(v>mx)mx=v;}

function perKey(T,v){const m=perMode(T);return m==='day'?v:m==='week'?weekKey(v):monthKey(v);}
function perLabel(T,k){const m=perMode(T);return m==='day'?fmtDay(k)+' '+AR_D[dowOf(k)]:m==='week'?weekLabel(k):monthLabel(k);}

/* ================= aggregation ================= */
/* group rows (indices) by key function; returns array of {key,label,n,nd,m:[...sums],fl,fx,risk,rows:[idx]} */
function groupBy(T,idx,keyFn,labelFn){const P=T.P,V=P.V,m=new Map();const dA=P.cDoc?V[P.cDoc.i]:null,rA=P.cRisk?V[P.cRisk.i]:null;
  for(const i of idx){const k=keyFn(i);if(k==null)continue;let g=m.get(k);
    if(!g){g={key:k,label:labelFn?labelFn(k):String(k),n:0,docs:new Set(),m:P.ms.map(()=>0),fl:0,fx:0,risk:0,rows:[]};m.set(k,g);}
    g.n++;g.rows.push(i);if(dA){const d=dA[i];if(d!=null&&d!=='')g.docs.add(d);}
    for(let j=0;j<P.ms.length;j++){const v=V[P.ms[j].i][i];if(v!=null)g.m[j]+=v;}
    const f=P.FL[i];if(f.length){g.fl++;if(f.some(x=>/[✖✗×]/.test(x)))g.fx++;}
    if(rA){const r=rA[i];if(r!=null&&r>g.risk)g.risk=r;}}

function totals(T,idx){const P=T.P,V=P.V;const t={n:idx.length,nd:0,m:P.ms.map(()=>0),fl:0,fx:0,r2:0,dl:0,dlc:0,dlMax:0};const ds=new Set();

  for(const i of idx){if(dA){const d=dA[i];if(d!=null&&d!=='')ds.add(d);}
    for(let j=0;j<P.ms.length;j++){const v=V[P.ms[j].i][i];if(v!=null)t.m[j]+=v;}
    const f=P.FL[i];if(f.length){t.fl++;if(f.some(x=>/[✖✗×]/.test(x)))t.fx++;}

  t.nd=ds.size;return t;}

/* ================= table ================= */

    default:return esc(v);}
}
function csvVal(c,v,r){if(c.csv)return c.csv(r);if(v==null)return '';if(c.f==='d')return fmtDay(v);if(c.f==='pc')return (v*100).toFixed(2);if(c.f==='fl')return v.join(' / ');if(typeof v==='number')return Math.round(v*1000)/1000;return v;}
const gv=(c,r)=>c.get?c.get(r):r[c.k];
const HEAT=['#f3f8fe','#e3eefc','#cde2fb','#b7d3f6','#9ec5f4','#86b6ef'];
const HEATR=['#fff7f5','#fde9e4','#fbd5cb','#f6b8a8','#ef9a86','#e57c65'];
function heatStyle(v,max,red){if(!(v>0)||!(max>0))return '';const p=red?HEATR:HEAT;const i=Math.min(p.length-1,Math.floor(v/max*p.length));return ' style="background:'+p[i]+'"';}
const isTx=c=>c.f==='t'||c.f==='fl'||c.f==='d'||c.tx;
function table(T,el,id,cfg){
  const st=T.ts[id]||(T.ts[id]={sort:cfg.sort||null,dir:cfg.dir||-1,lim:cfg.lim||300});

  h+='</tr>';

  table(T,$('agBC'),'agBC',{name:'كشف_اعمار_الذمم',cols:[{k:'#',t:'#',nos:1},{k:'code',t:'رمز العميل',f:'t',get:r=>r.c.code},{k:'name',t:'اسم العميل',f:'t',cls:'nm',get:r=>r.c.name,h:r=>'<span class="lnk">'+esc(r.c.name)+'</span>'+(r.c.members?'<span class="badge">'+r.c.members.length+' فروع</span>':'')},{k:'rep',t:'المندوب',f:'t',cls:'nm',get:r=>r.c.rep},{k:'mgr',t:'المدير',f:'t',cls:'nm',get:r=>r.c.mgr},{k:'ex',t:'أيام السماح',f:'i',get:r=>r.c.ex},{k:'cl',t:'السقف',f:'n',get:r=>r.c.cl},...(S.mode==='with'?[{k:'bal',t:'الرصيد الدفتري',f:'n',get:r=>r.c.bal},{k:'chk',t:'الشيكات المؤجلة',f:'n',get:r=>r.c.chk}]:[]),{k:'sum',t:S.mode==='with'?'الرصيد + الشيكات':'الرصيد',f:'n'},...bcols,{k:'overAmt',t:'المبلغ المتأخر',f:'n',get:r=>r.c.overAmt>0.005?r.c.overAmt:null,heat:true,red:true},{k:'overPct',t:'% المتأخر',f:'pc',get:r=>r.c.overAmt>0.005?sdiv(r.c.overAmt,r.c.amt):null},{k:'days',t:'أيام التأخير',f:'i',get:r=>(r.c.status==='overdue'||r.c.status==='immaterial')?r.c.days:(r.c.beyond?400:null),h:r=>(r.c.status==='overdue'||r.c.status==='immaterial')?'<span class="dn">'+FI(r.c.days)+'</span>':r.c.beyond?'<span class="dn">13+ شهر</span>':'<span class="z">—</span>'},{k:'interest',t:'فائدة التأخير ('+(S.rate||0)+'%)',f:'n',get:r=>r.c.interest>0.005?r.c.interest:null,heat:true,red:true},{k:'st',t:'الحالة',f:'t',get:r=>r.c.status,h:r=>agPill(r.c)}],rows:SHOWN,total:cTot,sort:'sum',dir:-1,onRow:r=>agModal(T,r.c)});
  const sumRows=L.map((l,j)=>({label:l,amt:tot[j],pct:sdiv(tot[j],T0),nc:cnt[j]}));
  table(T,$('agBS'),'agBS',{name:'ملخص_الفترات',short:true,cols:[{k:'label',t:'الفترة (يوم)',f:'t'},{k:'nc',t:'عملاء',f:'i'},{k:'amt',t:'الرصيد',f:'n',heat:true},{k:'pct',t:'%',f:'pc'}],rows:sumRows,total:{label:'الإجمالي',amt:T0,pct:1,nc:''},sort:null});
  const by=S.grpBy==='mgr'?'mgr':'rep';const RM=new Map();for(const r of CR){let g=RM.get(r.c[by]);if(!g){g={label:r.c[by],n:0,sum:0,b:new Array(nB).fill(0)};RM.set(r.c[by],g);}if(r.sum>0.005)g.n++;g.sum+=r.sum;r.b.forEach((v,j)=>g.b[j]+=v);}
  const rTot={label:'الإجمالي',sum:T0,n:''};tot.forEach((v,j)=>rTot['b'+j]=v);
  table(T,$('agBR'),'agBR',{name:'المندوبون_حسب_الفترات',short:true,cols:[{k:'#',t:'#',nos:1},{k:'label',t:by==='mgr'?'المدير':'المندوب',f:'t',cls:'nm',h:g=>'<span class="lnk">'+esc(g.label)+'</span>'},{k:'n',t:'عملاء برصيد',f:'i'},{k:'sum',t:'الرصيد',f:'n'},...bcols.map(c=>Object.assign({},c,{get:g=>g.b[+c.k.slice(1)]>0.005?g.b[+c.k.slice(1)]:null}))],rows:[...RM.values()],total:rTot,sort:'sum',dir:-1,onRow:g=>{if(by==='mgr')S.mgr=g.label;else S.rep=g.label;renderAging(T);}});
};
/* ================= boot ================= */
async function appBoot(){
  for(const d of QDEF)TABS[d.id]=mkTab(d);
  for(const d of QDEF){if(d.kind==='aging'){await agInit(TABS[d.id]);continue;}if(d.kind==='mil'){await milInit(TABS[d.id]);continue;}const D=await IDB.get(d.id);if(D&&D.rows&&D.rows.length){const T=TABS[d.id];T.D=D;try{build(T);}catch(e){console.error(e);T.D=null;T.P=null;}}}
  let a=LS.get('kap_active');if(location.hash==='#aging'&&TABS.aging)a='aging';
  ACTIVE=(a&&TABS[a])?a:QDEF[0].id;
  $('qtabs').style.display='';$('printBtn').style.display='';
  renderTabs();renderTab(TABS[ACTIVE]);
}
/* نقل بيانات محفوظة قبل نظام الدخول (بدون اسم مستخدم) إلى أول مستخدم يسجّل دخوله على هذا الجهاز */
async function migrateLegacy(){try{if(localStorage.getItem('kap_migrated_'+UID))return;
  const keys=[...QDEF.map(d=>d.id),'aging','aging_chk'];
  for(const k of keys){const old=await IDB.getRaw(k);if(old&&!(await IDB.get(k))){await IDB.put(k,old);}if(old)await IDB.delRaw(k);}
  for(const k of ['kap_active','kap_aging','kap_aging_bands','kap_aging_merge','kap_aging_mgr','kap_aging_grp']){const v=localStorage.getItem(k);if(v!=null){if(LS.get(k)==null)LS.set(k,v);localStorage.removeItem(k);}}
  localStorage.setItem('kap_migrated_'+UID,'1');}catch(e){console.error(e);}}
function renderGate(err){$('qtabs').style.display='none';$('printBtn').style.display='none';$('ubox').style.display='none';
  $('main').innerHTML='<div class="gate"><h2>تسجيل الدخول</h2><div class="sub">مركز الكيلاني للأغذية — شاشة تحليل الحزمة اليومية للتدقيق<br>نفس حساب بوابة الكيلاني. بيانات كل مستخدم (الكشوف والإعدادات) منفصلة عن غيره.</div><div class="fld"><label>البريد الإلكتروني</label><input type="email" id="lgEmail" autocomplete="username"></div><div class="fld"><label>كلمة المرور</label><input type="password" id="lgPass" autocomplete="current-password"></div><button class="btn pri" style="width:100%" id="lgBtn">دخول</button>'+(err?'<div class="err">'+esc(err)+'</div>':'')+'<div class="note">الكشوف التي ترفعها تُحفظ على هذا الجهاز باسم حسابك فقط، ولا تظهر لمستخدم آخر يسجّل دخوله على نفس الجهاز.</div></div>';
  $('lgBtn').onclick=doLogin;$('lgPass').onkeydown=e=>{if(e.key==='Enter')doLogin();};$('lgEmail').onkeydown=e=>{if(e.key==='Enter')doLogin();};}
function renderDenied(title,msg){$('main').innerHTML='<div class="gate"><h2>'+esc(title)+'</h2><div class="sub">'+esc(msg)+'</div><button class="btn" style="width:100%" onclick="doLogout()">تسجيل خروج</button></div>';}
async function doLogin(){const email=($('lgEmail').value||'').trim(),password=$('lgPass').value;if(!email||!password){renderGate('أدخل البريد الإلكتروني وكلمة المرور');return;}
  $('lgBtn').disabled=true;$('lgBtn').textContent='جارٍ الدخول...';
  try{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){renderGate('فشل الدخول: '+error.message);return;}await afterLogin(data.session);}
  catch(e){renderGate('تعذر الاتصال: '+(e.message||e));}}
async function doLogout(){try{await sb.auth.signOut();}catch(e){}location.reload();}
async function afterLogin(session){
  $('main').innerHTML='<div class="gate"><h2>جارٍ التحقق من صلاحيتك...</h2></div>';
  const {data:rows,error}=await sb.from('user_screen_permissions').select('screen_id,permission').eq('user_id',session.user.id).in('screen_id',[SCREEN_ID,AGING_SCREEN_ID]);
  if(error){renderDenied('تعذّر التحقق من صلاحيتك','حصل خطأ أثناء التحقق من صلاحيتك على هذه الشاشة. حدّث الصفحة وحاول مجدداً، وإذا تكرر راجع مدير الصلاحيات.');return;}
  const full=(rows||[]).find(r=>r.screen_id===SCREEN_ID&&r.permission),agOnly=(rows||[]).find(r=>r.screen_id===AGING_SCREEN_ID&&r.permission);
  const row=full||agOnly;
  if(!row){renderDenied('لا تملك صلاحية الدخول','حسابك غير مخوَّل بالدخول على شاشة تحليل الحزمة اليومية للتدقيق ولا على تحليل عمر الذمة. راجع مدير الصلاحيات لمنحك صلاحية من شاشة إدارة المستخدمين والصلاحيات.');return;}
  UID=session.user.id;UEMAIL=session.user.email||'';UPERM=row.permission;SCOPE=full?'all':'aging';
  if(SCOPE==='aging'){/* إبقاء تبويب عمر الذمة فقط: لا شريط تبويبات ولا أي ذكر لباقي الكويريات */
    for(let i=QDEF.length-1;i>=0;i--)if(QDEF[i].kind!=='aging')QDEF.splice(i,1);
    document.title='شاشة تحليل عمر الذمة';const h1=document.querySelector('header.top h1');if(h1)h1.textContent='شاشة تحليل عمر الذمة';const hs=$('hsub');if(hs)hs.textContent='أرصدة العملاء وأعمارها · الفترات والشيكات المؤجلة · حسب المندوب والمدير والفرع · مركز الكيلاني للأغذية · بياناتك محفوظة باسم حسابك وحدك';
    document.body.classList.add('scope-aging');}
  $('uEmail').textContent=UEMAIL;$('ubox').style.display='';
  await migrateLegacy();
  SYNC.on=true;SYNC.status();
  $('main').innerHTML='<div class="gate"><h2>جارٍ تحميل بياناتك من السحابة...</h2><div class="sub">الكشوف والإعدادات المحفوظة باسم حسابك</div></div>';
  try{await syncPull();}catch(e){console.error(e);SYNC.err=e.message||String(e);}
  await appBoot();SYNC.status();
}
(async()=>{
  /* نسخة مستقلة: بلا تسجيل دخول ولا مزامنة سحابية — البيانات على هذا الجهاز فقط */
  UID='local';UEMAIL='';UPERM='ADMIN';SYNC.on=false;
  $('ver').textContent='شاشة تحليل عمر الذمة — v1.0 — مركز الكيلاني للأغذية — نسخة مستقلة';
  try{await appBoot();}catch(e){console.error(e);$('main').innerHTML='<div class="gate"><h2>تعذّر تشغيل الشاشة</h2><div class="sub">'+esc(e.message||String(e))+'</div></div>';}
})();
</script>
